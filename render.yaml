# EOS trusted API — NON-PRODUCTION Render Blueprint.
#
# ════════════════════ WHAT THIS FILE IS ════════════════════
#
# The declaration of the two non-production resources this platform's policy store needs: a
# PostgreSQL database and the trusted API in front of it. Committing it means the environment is
# reviewable and reproducible rather than a sequence of dashboard clicks somebody has to remember.
#
# ════════════════════ WHAT IS DELIBERATELY NOT HERE ════════════════════
#
# NO SECRETS -- AND, AS IT TURNS OUT, NO SECRET IS NEEDED. This Blueprint declares no
# `sync: false` value at all: the environment stands up from this file alone, with nothing to paste
# into a dashboard and nothing to remember to rotate.
#
# That is not a shortcut. It is what is left after asking what each value actually is. An allowed
# ORIGIN is public. A Firebase PROJECT ID is public. Verifying an ID token needs neither a
# service-account key nor any other credential -- see the identity block below, which records the
# measurement. The one genuinely secret value, the database connection string, is never written
# here by anybody: Render injects it. A connection string or a service-account key committed to
# this file would be in git history, which outlives every rotation.
#
# `DATABASE_URL` is the one exception and it is not a secret in this file: it is wired
# `fromDatabase`, so Render substitutes the INTERNAL connection string of the database declared
# below. The value never appears in the repository, never reaches a build log, and never reaches a
# browser.
#
# ════════════════════ NON-PRODUCTION, AND SAYING SO ════════════════════
#
# Every name carries `nonprod`. `EOS_ENVIRONMENT` is `nonprod`, and the service REFUSES TO START if
# it is ever set to production — a check that lives in the process rather than in a naming
# convention somebody can typo. There is no production blueprint in this repository and this file
# must not become one by editing a string.
#
# ════════════════════ MIGRATIONS ════════════════════
#
# Migrations are NOT run by the build. Render runs `preDeployCommand` after the build and before
# starting the new service, which is the deployment phase intended for schema migrations. The
# command runs from this service's `rootDir` (`functions`) and receives the same `DATABASE_URL`
# supplied below from the internal Render PostgreSQL resource.
#
# The service still fails closed if the database is unreachable or unmigrated:
# `requirePolicyDatabaseReady` refuses to open the socket, so an invalid deploy reports unhealthy
# rather than serving requests that all fail.

databases:
  - name: eos-policy-nonprod
    databaseName: eos_policy
    user: eos
    # Smallest paid persistent PostgreSQL tier selected for this environment: it holds one
    # non-production tenant's configuration -- tens of thousands of rows -- and is not a load test.
    # Sizing up to solve a slow query would be buying capacity to hide a missing index.
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []          # internal connections only; nothing reaches it from the public internet

services:
  - type: web
    name: eos-api-nonprod
    runtime: node
    plan: starter
    # The API lives in functions/ alongside the policy subsystem it serves. Render builds and runs
    # from there rather than from the repository root, which has no package.json.
    rootDir: functions
    # --include=dev IS LOAD-BEARING. Render sets NODE_ENV=production for a Node service, and
    # under that npm omits devDependencies -- where `typescript` lives, correctly, because it is a
    # build tool and not a runtime need. Without this flag `npm run build` fails with "tsc: not
    # found" on the first deploy. Measured, not assumed: `npm ls typescript --omit=dev` resolves to
    # (empty) in this package.
    #
    # `node-pg-migrate` and `pg` are runtime DEPENDENCIES, so preDeployCommand and the service keep
    # working whatever the install flags are.
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    preDeployCommand: npm run migrate:up
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: EOS_ENVIRONMENT
        value: nonprod
      - key: DATABASE_URL
        fromDatabase:
          name: eos-policy-nonprod
          property: connectionString
      # The browser origins permitted to call this API. EXPLICIT, comma-separated, and never "*":
      # the API answers with one tenant's policy configuration, and a wildcard would let any page a
      # signed-in administrator visits read it. `readServiceConfig` refuses a "*" outright.
      #
      # Declared here rather than prompted, because an origin is not a credential. Measured from the
      # running preview rather than assumed: taylor-parts-preview.vercel.app serves /version.json
      # reporting environmentId `platform-sandbox`. A per-deployment Vercel URL is a DIFFERENT
      # origin and is deliberately not allowed -- acceptance runs against this stable domain.
      - key: EOS_ALLOWED_ORIGINS
        value: https://taylor-parts-preview.vercel.app
      # ════════════════════ IDENTITY: NO SERVICE-ACCOUNT KEY IS NEEDED ════════════════════
      #
      # Firebase answers exactly one question -- which subject authenticated -- and no claim it
      # returns is read as EOS authority. Verifying an ID token needs the PROJECT ID and Google's
      # PUBLIC signing certificates, fetched over HTTPS. It does not need a credential.
      #
      # Measured, not assumed. With GOOGLE_CLOUD_PROJECT set and no credential of any kind present,
      # `admin.initializeApp()` succeeds and `verifyIdToken` proceeds all the way to checking the
      # token's `kid` against the live public keys. With the variable absent it refuses outright:
      # "Must initialize app with a cert credential or set your Firebase project ID as the
      # GOOGLE_CLOUD_PROJECT environment variable to call verifyIdToken()."
      #
      # This file previously also declared GOOGLE_APPLICATION_CREDENTIALS_JSON. NOTHING READ IT.
      # `firebase-admin` reads GOOGLE_APPLICATION_CREDENTIALS -- a FILE PATH -- and has no `_JSON`
      # inline variant; a search of the repository finds that key in this file and in the one
      # sentence of documentation describing this file, and nowhere else. Keeping it would have had
      # a service-account private key pasted into an environment that never opens it: a real
      # credential, with a real blast radius, in exchange for nothing.
      #
      # NON-PRODUCTION project. `eos-platform-sandbox` is the Firebase identity the deployed
      # preview frontend actually signs into, read from config/environments.json -- the one registry
      # the Vite build injects from. `taylor-parts` (production) and `eos-platform-certification`
      # (Certification) must never appear here.
      - key: GOOGLE_CLOUD_PROJECT
        value: eos-platform-sandbox
