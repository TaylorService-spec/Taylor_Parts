name: Legacy Authorization Surface Gate

# R1-A (Issue #226 readiness) -- prevents the LEGACY authorization surface in
# firestore.rules from growing silently while authorization convergence is in
# progress (ADR-005 §2.7 criterion 1).
#
# Re-parses the real firestore.rules and asserts it still matches the recorded
# corpus in functions/src/access/legacyAuthorizationSurface.ts. Adding a new
# isAdminOrDispatcher()/isAdmin()/isTechnician() call site fails this gate
# until it is removed or deliberately recorded. Removing one also fails, so a
# domain cutover updates the corpus in the SAME change -- the burn-down stays
# evidenced rather than asserted.
#
# Also asserts the two firestore.rules copies remain byte-identical.
#
# Pure logic: no emulator, no deployment, no production access, no secrets.

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "field-ops-app-vite/firestore.rules"
      - "functions/src/access/legacyAuthorizationSurface.ts"
      - "field-ops-app-vite/src/access/legacyAuthorizationSurface.ts"
      - "functions/test/legacyAuthorizationSurface.test.mjs"
      - ".github/workflows/legacy-authorization-surface-gate.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "field-ops-app-vite/firestore.rules"
      - "functions/src/access/legacyAuthorizationSurface.ts"
      - "field-ops-app-vite/src/access/legacyAuthorizationSurface.ts"
      - "functions/test/legacyAuthorizationSurface.test.mjs"
      - ".github/workflows/legacy-authorization-surface-gate.yml"

permissions:
  contents: read

jobs:
  legacy-surface-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build functions (compiles the corpus to lib/)
        working-directory: functions
        run: npm run build

      - name: Legacy authorization surface drift gate
        run: node --test functions/test/legacyAuthorizationSurface.test.mjs
