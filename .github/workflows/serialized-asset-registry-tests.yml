name: Serialized Asset Registry Tests

# Serialized Asset registry, Spec phase M.1 (docs/specifications/serialized-asset-equipment-installation.md
# §D / §I / §M.1, ADR-010 + DECISIONS #59): "Serialized Asset identity + Available Equipment read". Pure-logic
# unit tests for the persistence-contract validator + the trusted read projection core (no emulator, no
# deployment, no production access, no secrets) plus Firestore-emulator coverage for the trusted
# getAvailableEquipment callable's authorization boundary (unauthenticated / ungranted-in-every-project,
# since `inventory.serializedAsset.read` is registered active:false and granted to NO Role in this phase).
# The callable is undeployed; this workflow builds and runs tests against the compiled functions/lib output
# only.

on:
  pull_request:
    paths:
      - "functions/src/serializedAsset/**"
      - "functions/src/constants/collections.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/environmentCapabilityOverrides.ts"
      - "functions/src/index.ts"
      - "field-ops-app-vite/src/access/permissionCatalog.ts"
      - "functions/test/serializedAssetValue.test.mjs"
      - "functions/test/serializedAssetReadService.test.mjs"
      - "functions/test/serializedAssetReadCallable.test.mjs"
      - "functions/test/permissionCatalog.test.mjs"
      - "functions/test/resolveEffectivePermission.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/serialized-asset-registry-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/serializedAsset/**"
      - "functions/src/constants/collections.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/environmentCapabilityOverrides.ts"
      - "functions/src/index.ts"
      - "field-ops-app-vite/src/access/permissionCatalog.ts"
      - "functions/test/serializedAssetValue.test.mjs"
      - "functions/test/serializedAssetReadService.test.mjs"
      - "functions/test/serializedAssetReadCallable.test.mjs"
      - "functions/test/permissionCatalog.test.mjs"
      - "functions/test/resolveEffectivePermission.test.mjs"
      - ".github/workflows/serialized-asset-registry-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serialized-asset-unit-tests:
    name: Serialized Asset registry -- pure contract + projection (build + run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions
      - name: Serialized Asset persistence-contract + projection tests (build + run)
        run: npm run test:serializedAssetRead
        working-directory: functions
      - name: Capability catalog registration tests (build + run)
        run: node test/permissionCatalog.test.mjs && node test/resolveEffectivePermission.test.mjs
        working-directory: functions

  serialized-asset-emulator:
    name: Serialized Asset read callable -- authorization boundary (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/serialized-asset-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/serialized-asset-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Firestore emulator did not become ready in time"
          cat /tmp/serialized-asset-emulator.log
          exit 1
        working-directory: functions

      - name: Serialized Asset read callable tests (build + run)
        run: npm run test:serializedAssetReadEmulator
        working-directory: functions
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serialized-asset-emulator-logs
          path: /tmp/serialized-asset-emulator.log
          if-no-files-found: ignore
          retention-days: 7
