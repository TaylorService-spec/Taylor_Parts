  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  role-governance-tests:
    name: Role governance contract + precedence guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      # Runs the five guard suites, then REGENERATES every governance artifact and
      # fails if the committed copy differs. The generators are the contract: a
      # hand-edited contract, workbook or sweep is a third independent design, which
      # is the exact failure this whole reconciliation exists to end.
      - name: Governance guards + generated-artifact drift
        run: npm run test:governance
        working-directory: functions

      # BELT AND BRACES FOR THE ENVIRONMENT REGISTRY.
      #
      # config/environments.json is guarded by deployment-drift-core-tests.yml, and during Pass 3
      # that suite did not run on the commit that FIXED it -- its last recorded runs on the branch
      # were both failures, from before the fix, while the PR page showed green. The mechanism was
      # never established, which is exactly why the fix does not depend on knowing it.
      #
      # Any change that reaches THIS workflow -- certification fixtures, access artifacts, the
      # environment registry -- now also runs the registry guards. Two independent workflows would
      # both have to fail to notice for a bad registry to merge.
      - name: Environment registry guards (also run by drift-core; deliberately duplicated)
        run: node --test scripts/deploymentDrift.test.mjs scripts/environmentArchitecture.test.mjs
