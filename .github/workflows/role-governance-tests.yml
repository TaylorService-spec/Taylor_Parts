      - "functions/scripts/certificationWorld/**"
      - "functions/src/workOrderPartsPlan/setWorkOrderPartsPlan.ts"
      - "functions/src/createWorkOrder.ts"
      - "functions/test/outstandingInboundQuantity.test.mjs"
      - "functions/test/partBalanceReadService.test.mjs"
