      - "config/environments.json"
      # The certification fixture builders themselves. Without this, a change to the parts catalog
      # or an applier runs no certification suite at all -- which is how the catalog carried an
      # invalid stockingClass and no Part Master metadata for the whole program.
      - "functions/scripts/certificationWorld/**"
      - "config/environments.json"
      - "scripts/deploymentDrift.mjs"
      - "scripts/resolveEnvironment.mjs"
      - "functions/src/workOrderPartsPlan/setWorkOrderPartsPlan.ts"
      - "functions/src/createWorkOrder.ts"
      - "functions/test/outstandingInboundQuantity.test.mjs"
