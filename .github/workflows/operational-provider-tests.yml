name: EOS Operational AI Provider

# Server-only transport proof for North Star operational interpretation.
# No provider credential is required; fetch is injected and no real model/gateway is contacted.
on:
  pull_request:
    paths:
      - "functions/src/ai/operationalProvider.ts"
      - "functions/src/ai/provider.ts"
      - "functions/test/aiOperationalProvider.test.mjs"
      - "field-ops-app-vite/src/**"
      - ".github/workflows/operational-provider-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/ai/operationalProvider.ts"
      - "functions/src/ai/provider.ts"
      - "functions/test/aiOperationalProvider.test.mjs"
      - "field-ops-app-vite/src/**"
      - ".github/workflows/operational-provider-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-provider:
    name: Private-first operational transport boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions
      - name: Build Functions
        run: npm run build
        working-directory: functions
      - name: Server-only operational provider boundary
        run: node --test test/aiOperationalProvider.test.mjs
        working-directory: functions
