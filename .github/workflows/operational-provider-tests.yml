name: EOS Operational AI Provider

# Server-only transport proof for North Star operational interpretation.
# No provider credential is required; fetch is injected and no real model/gateway is contacted.
on:
  pull_request:
    paths:
      - "functions/src/ai/operationalProvider.ts"
      - "functions/src/ai/provider.ts"
      - "functions/test/aiOperationalProvider.test.mjs"
      - "field-ops-app-vite/src/**"
      - ".github/workflows/operational-provider-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/ai/operationalProvider.ts"
      - "functions/src/ai/provider.ts"
      - "functions/test/aiOperationalProvider.test.mjs"
      - "field-ops-app-vite/src/**"
      - ".github/workflows/operational-provider-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Measured: 30 of 71 recent PR
# runs on this estate were superseded by a newer push to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  operational-provider:
    name: Private-first operational transport boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions
      - name: Build Functions
        run: npm run build
        working-directory: functions
      - name: Server-only operational provider boundary
        run: node --test test/aiOperationalProvider.test.mjs
        working-directory: functions
