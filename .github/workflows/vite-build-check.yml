name: Vite Build Check
#
# CI-V2-P0 — trigger scope and deterministic install. No assurance was removed: this file
# runs exactly the same four steps it always did, on exactly the same commits that can
# reach main.
#
# ════════════════════ WHY `push:` WAS SCOPED TO main ════════════════════
#
# This was a bare `push:` — the ONLY one of 118 push triggers in the repository without a
# branches filter — so it fired on every push to every branch, IN ADDITION to the
# `pull_request` run on the identical commit. Measured over its last 200 runs:
#
#     71  pull_request
#    129  push        of which  87 were NOT on main   <- duplicated the PR run
#                               42 were on main
#
# 43.5% of this workflow's runs were a second build of a commit already being built.
#
# COVERAGE IS NOT REDUCED, and the distinction matters:
#   * a branch with an open PR  -> `pull_request` builds the same commit already;
#   * a branch with no PR yet   -> assurance is DEFERRED to the moment a PR opens, which
#                                  is still before anything can reach main;
#   * a direct push to main     -> still built, by `branches: [main]`.
# There is no path to main that loses a build check. Nothing is merely trusted.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      # `npm ci`, not `npm install`. The cache above already pins on this lockfile, so the
      # install was ALREADY assuming the lockfile is authoritative — while `npm install`
      # was free to resolve around it and silently rewrite it in the runner. `npm ci`
      # installs the locked tree exactly and FAILS on a lockfile that has drifted out of
      # sync with package.json, which turns a dependency-management problem into a red
      # build instead of a quiet difference between what CI tested and what anyone else
      # installs.
      #
      # Verified before changing it, per the per-workflow rule: working directory
      # field-ops-app-vite, its own package.json and package-lock.json (lockfileVersion 3),
      # and the full sequence — npm ci -> build -> verify:build-base (12 checks) ->
      # verify:version (10 checks) — run green locally on Node 22.
      - name: Install dependencies
        run: npm ci
        working-directory: field-ops-app-vite
      - name: Build project
        run: npm run build
        working-directory: field-ops-app-vite
      - name: Verify build base (GitHub Pages + Firebase Hosting modes)
        run: npm run verify:build-base
        working-directory: field-ops-app-vite
      # C3/D1 — deployed-version identity. Asserts both build modes emit a
      # readable dist/version.json carrying build provenance (and no secrets),
      # so "what version is production actually running?" is a single HTTP GET
      # rather than a forensic exercise. Foundation for D2 expected-vs-deployed.
      - name: Verify deployed-version manifest (D1)
        run: npm run verify:version
        working-directory: field-ops-app-vite
