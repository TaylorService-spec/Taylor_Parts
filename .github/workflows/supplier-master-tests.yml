name: Supplier Master Tests

# The Supplier Master subsystem (functions/src/supplierMaster/** -- governed Supplier commands,
# callables, validation, and the reorder-PO supplier-linkage migration tooling -- plus the closely
# related Part<->Supplier item surface in functions/src/partMaster/partSupplierItem*.ts) had 13 test
# files with no workflow path-filtering any of them: a change here ran no test in CI at all.
#
# F2 (Firebase retirement, 2026-10-10) removed the Supplier and Part<->Supplier onCall adapters
# (supplierMasterCallables.ts, partSupplierItemCallables.ts) and their 4 tests: no caller remained and
# the Firestore catalog writer is FROZEN. The commands, projections and migration tooling stay tested.
#
# partSupplierItemRules.test.js (part_supplier_items deny-all) is NOT one of the 8 files below --
# it is already covered by firestore-rules-regression.yml, whose `functions/test/**Rules*.test.js`
# filter catches it and whose `npm run test:rules` runs it as part of the registered rulesRegressionRunner
# suite list. Wiring it again here would be a duplicate, not a fix.

on:
  pull_request:
    paths:
      - "functions/src/supplierMaster/**"
      - "functions/src/partMaster/partSupplierItemProjections.ts"
      - "functions/src/partMaster/partSupplierItems.ts"
      - "functions/src/partMaster/partMasterCommands.ts"
      - "functions/src/partMaster/partMasterCallables.ts"
      - "functions/src/partMaster/partMasterRepository.ts"
      - "functions/src/index.ts"
      - "functions/test/partSupplierItemProjections.test.mjs"
      - "functions/test/partSupplierItems.test.mjs"
      - "functions/test/supplierMasterCommands.test.mjs"
      - "functions/test/supplierMasterValidation.test.mjs"
      - "functions/test/reorderPurchaseOrderSupplierLinkage.test.mjs"
      - "functions/test/reorderPurchaseOrderSupplierMigrationEmulator.test.mjs"
      - "functions/test/reorderPurchaseOrderSupplierMigrationExecuteEmulator.test.mjs"
      - "functions/test/reorderPurchaseOrderSupplierMigrationExecuteManifest.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/supplier-master-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/supplierMaster/**"
      - "functions/src/partMaster/partSupplierItemProjections.ts"
      - "functions/src/partMaster/partSupplierItems.ts"
      - "functions/src/partMaster/partMasterCommands.ts"
      - "functions/src/partMaster/partMasterCallables.ts"
      - "functions/src/partMaster/partMasterRepository.ts"
      - "functions/src/index.ts"
      - "functions/test/partSupplierItemProjections.test.mjs"
      - "functions/test/partSupplierItems.test.mjs"
      - "functions/test/supplierMasterCommands.test.mjs"
      - "functions/test/supplierMasterValidation.test.mjs"
      - "functions/test/reorderPurchaseOrderSupplierLinkage.test.mjs"
      - "functions/test/reorderPurchaseOrderSupplierMigrationEmulator.test.mjs"
      - "functions/test/reorderPurchaseOrderSupplierMigrationExecuteEmulator.test.mjs"
      - "functions/test/reorderPurchaseOrderSupplierMigrationExecuteManifest.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/supplier-master-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  supplier-master-offline-tests:
    name: Supplier Master -- offline pure tests (no emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Supplier validation + linkage-compatibility + migration-manifest tests (build + run)
        run: |
          npm run test:supplierMaster
          npm run test:supplierLinkage
          npm run test:supplierMigrationExecute
          npm run test:partSupplierItemProjections
        working-directory: functions

  supplier-master-emulator-tests:
    name: Supplier Master -- Firestore-emulator command + migration + Part-item tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Firebase test-safety guard (functions/test/support/firebaseTestGuard.cjs): emulator suites
      # refuse to run unless the emulator is named explicitly -- never a silent fallback to Google.
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project demo-eos-test --config ../firebase.json > /tmp/supplier-master-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/supplier-master-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulator did not become ready in time"
          cat /tmp/supplier-master-emulator.log
          exit 1
        working-directory: functions

      - name: Supplier Master command + reorder-PO migration emulator tests (build + run)
        run: |
          npm run test:supplierMasterCommands
          npm run test:supplierMigrationEmulator
          npm run test:supplierMigrationExecuteEmulator
        working-directory: functions

      - name: Part<->Supplier item command emulator tests (build + run)
        run: |
          npm run test:partSupplierItems
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-master-emulator-logs
          path: /tmp/supplier-master-emulator.log
          if-no-files-found: ignore
          retention-days: 7
