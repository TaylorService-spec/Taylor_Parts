name: Repo graph

on:
  pull_request:
    paths:
      - "scripts/repoGraph*.mjs"
      - "scripts/buildRepoGraph.mjs"
      - ".github/workflows/repo-graph-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/repoGraph*.mjs"
      - "scripts/buildRepoGraph.mjs"

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test scripts/repoGraph.test.mjs
      # Report-only: the hygiene backlog is pre-existing and must not block PRs.
      - run: node scripts/buildRepoGraph.mjs
