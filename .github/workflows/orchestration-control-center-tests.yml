name: Orchestration Control Center Tests

# Owner Control Center adapter/envelope (docs/orchestration/owner-control-center-placement.md) — the ONLY
# thing project-keystone may depend on. Pure, zero-dependency node:test over the versioned envelope
# (schemaVersion/provenance/preserved distinctions/compatibility, the 8 views, and the v1.1 additive sections:
# agentOperations, networkHealth, recentProgress, populated uxBoard). Fail-closed; no fabricated metrics. No
# Firebase, no emulator, no npm install, no secrets, no deployment.

on:
  pull_request:
    paths:
      - "docs/orchestration/lib/controlCenterAdapter.mjs"
      - "docs/orchestration/lib/controlCenterAdapter.test.mjs"
      - "docs/orchestration/lib/controlCenterContract.mjs"
      - "docs/orchestration/lib/tokenCapacity.mjs"
      - "docs/orchestration/lib/improvementRegister.mjs"
      - "docs/orchestration/lib/controlPlaneSeams.test.mjs"
      - "docs/orchestration/lib/cockpitProjection.test.mjs"
      - "docs/orchestration/lib/durableOutcomeTriage.test.mjs"
      - "docs/orchestration/lib/publishControlCenterEnvelope.mjs"
      - "docs/orchestration/lib/publishControlCenterEnvelope.test.mjs"
      - "docs/orchestration/lib/roadmapModel.mjs"
      - "docs/orchestration/lib/roadmapProjection.mjs"
      - ".github/workflows/orchestration-control-center-tests.yml"
  push:
    branches: [main]
    paths:
      - "docs/orchestration/lib/controlCenterAdapter.mjs"
      - "docs/orchestration/lib/controlCenterAdapter.test.mjs"
      - "docs/orchestration/lib/controlCenterContract.mjs"
      - "docs/orchestration/lib/tokenCapacity.mjs"
      - "docs/orchestration/lib/improvementRegister.mjs"
      - "docs/orchestration/lib/controlPlaneSeams.test.mjs"
      - "docs/orchestration/lib/cockpitProjection.test.mjs"
      - "docs/orchestration/lib/durableOutcomeTriage.test.mjs"
      - "docs/orchestration/lib/publishControlCenterEnvelope.mjs"
      - "docs/orchestration/lib/publishControlCenterEnvelope.test.mjs"
      - "docs/orchestration/lib/roadmapModel.mjs"
      - "docs/orchestration/lib/roadmapProjection.mjs"
      - ".github/workflows/orchestration-control-center-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  control-center:
    name: Control Center adapter/envelope (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Control Center adapter + publish tooling tests (node:test, zero-dependency)
        run: node --test docs/orchestration/lib/controlCenterAdapter.test.mjs docs/orchestration/lib/publishControlCenterEnvelope.test.mjs docs/orchestration/lib/controlPlaneSeams.test.mjs docs/orchestration/lib/cockpitProjection.test.mjs docs/orchestration/lib/durableOutcomeTriage.test.mjs
