name: Sales Opportunity Workspace Tests

# Sales Cycle 2 -- the read-first Opportunity Operating Workspace. Wave 7 added the governed CREATE flow +
# lifecycle chevrons on top of it. Runs the pure-domain unit chain (opportunityLifecycle: lifecycle
# vocabulary, stage->tone, honest attention derivation, pipeline projection, chevron stageProgress), the
# server/client lifecycle drift lockstep test, the create-form validation + write-outcome-mapping unit
# tests, the write-capability access glue test, the action-hook idempotency tests (create + transition), the
# component render gate (vitest + jsdom: pipeline over the synthetic source, attention sort, row->detail
# selection, create flow, lifecycle control), the nav-parity pins (crmSalesNav/equipmentRegister), and lint.
# Pure/offline: no emulator, no Firebase, no deployment, no production access, no secrets. This surface reads
# a SYNTHETIC in-memory source by default and every write path is exercised only against a MOCKED command
# client -- it activates, grants, and deploys nothing.

