permissions:
  contents: read

jobs:
  sales-opportunity-tests:
    name: Opportunity workspace (domain + component + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: field-ops-app-vite

      - name: Opportunity + Sales Order domain unit tests (node:test)
        # opportunityNorthStar covers the record page's derivation layer + the honest read states
        # (domain/opportunityView.js). It is ALSO registered in test/suites.json so `npm test` runs
        # it; both, deliberately, because this lane is the one path-filtered to Opportunity work.
        run: node test/opportunityLifecycle.test.mjs && node test/opportunityLifecycleDrift.test.mjs && node test/opportunityWriteReadiness.test.mjs && node test/opportunityReadMapping.test.mjs && node test/opportunityFieldModel.test.mjs && node test/opportunityCreateForm.test.mjs && node test/opportunityCommandOutcome.test.mjs && node test/opportunityCapabilityAccess.test.mjs && node --test test/opportunityNorthStar.test.mjs && node test/salesOrderView.test.mjs
        working-directory: field-ops-app-vite

      - name: Nav parity pins (crmSalesNav + equipmentRegister)
        run: node test/crmSalesNav.test.mjs && node test/equipmentRegister.test.mjs
        working-directory: field-ops-app-vite

      - name: Frontend/backend permission catalog + compatibility Role parity (node:test)
        run: node --test test/permissionCatalogRoleParity.test.mjs
        working-directory: field-ops-app-vite

      - name: Opportunity write-action hook tests (vitest + jsdom, idempotency-key behavior)
        run: npx vitest run test/useOpportunityCreate.test.jsx test/useOpportunityTransitions.test.jsx
        working-directory: field-ops-app-vite

      - name: Opportunity + Sales Order workspace component tests (vitest + jsdom)
        run: npx vitest run test/salesWorkspace.test.jsx test/salesWorkspaceDate.test.jsx test/useOpportunitiesAsync.test.jsx test/salesOrderDetail.test.jsx test/opportunityLifecycleControl.test.jsx test/newOpportunityForm.test.jsx test/productReferencePicker.test.jsx test/useProductReferenceSearch.test.jsx
        working-directory: field-ops-app-vite

      - name: Lint the Sales slice (oxlint)
        run: npx oxlint src/modules/sales src/domain/opportunityNorthStar.js src/domain/opportunityView.js src/hooks/useOpportunity.js src/services/opportunityReadCallableClient.js src/domain/opportunityLifecycle.js src/domain/opportunityFieldModel.js src/domain/opportunityCreateForm.js src/domain/opportunityCommandOutcome.js src/domain/localDateInput.js src/domain/salesOrderView.js src/access/opportunitySource.js src/access/opportunityWriteReadiness.js src/access/opportunityCapabilityAccess.js src/access/useOpportunityCapabilities.js src/hooks/useOpportunities.js src/hooks/useOpportunityCreate.js src/hooks/useOpportunityTransitions.js src/hooks/useSalesOrder.js src/services/salesOrderReadCallableClient.js src/services/opportunityCommandClient.js src/data/opportunityScenarioFixtures.js src/shared/ui/LifecycleChevrons.jsx
        working-directory: field-ops-app-vite
