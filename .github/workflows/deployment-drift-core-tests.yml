name: Environment & Drift Core Tests

# C3/D2 — expected-vs-deployed comparison, pure-core tests.
#
# Runs ONLY the hermetic core (scripts/deploymentDrift.test.mjs): fixtures in,
# verdicts out. No network, no live deployment, no credentials, no secrets.
#
# Deliberately does NOT run scripts/checkDeployedVersions.mjs, which performs
# real HTTP GETs against live surfaces. Putting that in CI would make the build
# depend on production availability and turn an outage into a red build — the
# same false-signal trap this program has repeatedly flagged. The live check is
# run on demand and by the eventual D3 scheduled check.

on:
  pull_request:
    paths:
      - "scripts/deploymentDrift.mjs"
      - "sandbox-refresh.ps1"
      - "scripts/Invoke-SandboxRefresh.ps1"
      - "scripts/sandboxRefreshWrapper.test.mjs"
      - "scripts/_sandboxRefresh.run.sh"
      - "scripts/verifyInstalledDeps.mjs"
      - "scripts/verifyInstalledDeps.test.mjs"
      - "field-ops-app-vite/test/verifyBuildBase.mjs"
      - "field-ops-app-vite/package.json"
      - "field-ops-app-vite/package-lock.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "scripts/sandboxHostingOnlyMode.test.mjs"
      - "scripts/resolveEnvironment.mjs"
      - "scripts/environmentArchitecture.test.mjs"
      - "scripts/indexDriftGuard.mjs"
      - "scripts/listIndexCoverage.mjs"
      - "field-ops-app-vite/src/metadata/**"
      - "scripts/listIndexCoverage.test.mjs"
      - "scripts/indexDriftGuard.test.mjs"
      - "firestore.indexes.json"
      - "field-ops-app-vite/src/firebase/firebase.js"
      - "field-ops-app-vite/src/config/**"
      - "scripts/deploymentDrift.test.mjs"
      - "scripts/powershellEncoding.test.mjs"
      - "**/*.ps1"
      - "field-ops-app-vite/src/index.css"
      - "field-ops-app-vite/test/cssClassCoverage.test.mjs"
      - "field-ops-app-vite/test/createdRecordIsReachable.test.mjs"
      - "field-ops-app-vite/test/technicianNameIsNotAnId.test.mjs"
      - "field-ops-app-vite/src/domain/actorDisplayName.js"
      - "field-ops-app-vite/src/firebase/collectionStore.js"
      - "field-ops-app-vite/src/metadata/definitions/**"
      - "scripts/deployHosting.mjs"
      - "scripts/deployHosting.test.mjs"
      - "scripts/checkDeployedVersions.mjs"
      - "config/environments.json"
      - ".github/workflows/deployment-drift-core-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/deploymentDrift.mjs"
      - "sandbox-refresh.ps1"
      - "scripts/Invoke-SandboxRefresh.ps1"
      - "scripts/sandboxRefreshWrapper.test.mjs"
      - "scripts/_sandboxRefresh.run.sh"
      - "scripts/verifyInstalledDeps.mjs"
      - "scripts/verifyInstalledDeps.test.mjs"
      - "field-ops-app-vite/test/verifyBuildBase.mjs"
      - "field-ops-app-vite/package.json"
      - "field-ops-app-vite/package-lock.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "scripts/sandboxHostingOnlyMode.test.mjs"
      - "scripts/resolveEnvironment.mjs"
      - "scripts/environmentArchitecture.test.mjs"
      - "scripts/indexDriftGuard.mjs"
      - "scripts/listIndexCoverage.mjs"
      - "field-ops-app-vite/src/metadata/**"
      - "scripts/listIndexCoverage.test.mjs"
      - "scripts/indexDriftGuard.test.mjs"
      - "firestore.indexes.json"
      - "field-ops-app-vite/src/firebase/firebase.js"
      - "field-ops-app-vite/src/config/**"
      - "scripts/deploymentDrift.test.mjs"
      - "scripts/powershellEncoding.test.mjs"
      - "**/*.ps1"
      - "field-ops-app-vite/src/index.css"
      - "field-ops-app-vite/test/cssClassCoverage.test.mjs"
      - "field-ops-app-vite/test/createdRecordIsReachable.test.mjs"
      - "field-ops-app-vite/test/technicianNameIsNotAnId.test.mjs"
      - "field-ops-app-vite/src/domain/actorDisplayName.js"
      - "field-ops-app-vite/src/firebase/collectionStore.js"
      - "field-ops-app-vite/src/metadata/definitions/**"
      - "scripts/deployHosting.mjs"
      - "scripts/deployHosting.test.mjs"
      - "scripts/checkDeployedVersions.mjs"
      - "config/environments.json"
      - ".github/workflows/deployment-drift-core-tests.yml"

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Batch 1 proved the mechanism:
# two superseded PR runs cancelled, the newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drift-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deployment drift pure-core tests
        run: node --test scripts/deploymentDrift.test.mjs
      - name: Sandbox refresh operator wrapper
        run: node --test scripts/sandboxRefreshWrapper.test.mjs
      # Hosting-only release mode. Runs the REAL runbook against stubbed node/npm/firebase/git on
      # PATH and asserts on the command log: Hosting deploys, no Functions batch runs, Rules and
      # indexes are never deployed, the sandbox project stays pinned, every guard still executes,
      # and an unrecognised flag refuses before anything happens. Nothing is deployed by this suite.
      - name: Hosting-only sandbox release mode
        run: node --test scripts/sandboxHostingOnlyMode.test.mjs
      # A release must build from the dependency tree it DECLARES. CI installs with `npm ci` before
      # every build, so CI's tree is never stale and could not have caught the 2026-09-03 operator
      # failure -- a missing `jsbarcode` reported as a Rolldown binding stack. The axis is not
      # Linux-vs-Windows (a Windows checkout with a current install passes fine); it is
      # CI-installs-from-the-lockfile vs operator-builds-from-whatever-is-on-disk.
      #
      # Hermetic: no npm, no network, no builds, no platform assumptions. The real-build invariants
      # stay in verify:build-base, which vite-build-check.yml runs on every pull request.
      - name: Release builds from the declared dependency tree
        run: node --test scripts/verifyInstalledDeps.test.mjs
      # O-3 — locks the environment-configuration invariants: no production
      # hard-coding, no wildcard project acceptance, no role/deployment
      # conflation, no weakened production guard.
      - name: Environment architecture invariants (O-3)
        run: node --test scripts/environmentArchitecture.test.mjs
      # O-4 — a repo-driven index deploy must never silently delete a live index.
      - name: Index drift guard (O-4)
        run: node --test scripts/indexDriftGuard.test.mjs

      - name: List index coverage (metadata filters vs declared indexes)
        run: node --test scripts/listIndexCoverage.test.mjs
      # Running the tool's own tests proves the TOOL works. It does not ask the
      # question the tool exists to answer -- whether THIS repository's list
      # definitions demand a composite index nobody declared. Those are different
      # checks, and only the second one fails when someone adds a filter and
      # forgets the index.
      #
      # Today it prints "idle, not passing" because no definition is registered
      # yet. That wording is deliberate and the step is worth adding anyway: it
      # becomes load-bearing the moment the first definition lands, which is
      # precisely the moment a missing gate would stop being noticed.
      - name: List index coverage gate (this repository's own definitions)
        run: node scripts/listIndexCoverage.mjs --check
      # Gate 1 D1 finding -- a deploy must never resolve its target implicitly,
      # and an artifact that misidentifies its environment must be refused
      # BEFORE it ships, not discovered afterwards in the live manifest.
      - name: Deploy target identity is fail-closed
        run: node --test scripts/deployHosting.test.mjs

      # A .ps1 that will not parse on the operator's machine is a deploy runbook that
      # cannot be run. Windows PowerShell 5.1 reads .ps1 as CP1252 unless the file has a
      # UTF-8 BOM, so a single em dash in a COMMENT breaks string parsing seventy lines
      # later and reports a line that is perfectly correct. This has already happened
      # here once, to this repository's own sandbox refresh launcher.
      - name: PowerShell scripts are ASCII (or declare a BOM)
        run: node --test scripts/powershellEncoding.test.mjs

      # A component naming a class is asserting that rule exists. 887a0a50 replaced index.css
      # wholesale and deleted 811 net lines that live components still referenced -- nothing threw,
      # no test failed, and two accepted surfaces rendered unstyled for two weeks.
      - name: Every rendered CSS class is actually styled
        run: node --test test/cssClassCoverage.test.mjs
        working-directory: field-ops-app-vite

      # Firestore's orderBy silently drops documents missing the sorted field, so a list that sorts
      # on a field not set at creation omits newly created records with NO error. That is how a
      # newly created Prospect became invisible while still being findable by search.
      - name: A created record is reachable from its list
        run: node --test test/createdRecordIsReachable.test.mjs
        working-directory: field-ops-app-vite

      # Ten surfaces each hand-rolled the same technician lookup and nine of them fell back to
      # rendering the raw document id where a person's name belongs.
      - name: A technician is shown by name, never by id
        run: node --test test/technicianNameIsNotAnId.test.mjs
        working-directory: field-ops-app-vite
