name: Bounded Picker Tests

# CI coverage for bounded picker reads (DECISIONS #102 §9).
#
# A NEW subsystem needs its own path-filtered workflow or it is CI-uncovered: this repo
# runs per-subsystem workflows on PRs rather than one global suite.
#
# What is protected is not the limit but the DISCLOSURE. Bounding a picker without
# telling the user it was bounded turns a performance defect into a correctness one: a
# dropdown silently showing the first N of 250k is indistinguishable from one showing
# everything, so someone searching for a customer that exists concludes it does not.
# Offline: pure domain tests plus the wizard component, no emulator, no secrets.

on:
  pull_request:
    paths:
      - "field-ops-app-vite/src/domain/pickerSource.js"
      - "field-ops-app-vite/src/hooks/useAccountPicker.js"
      - "field-ops-app-vite/src/modules/workOrders/WorkOrderWizard.jsx"
      - "field-ops-app-vite/src/modules/sales/NewOpportunityForm.jsx"
      - "field-ops-app-vite/src/modules/equipment/EquipmentRegister.jsx"
      - "field-ops-app-vite/test/pickerSource.test.mjs"
      - ".github/workflows/bounded-picker-tests.yml"
  push:
    branches: [main]
    paths:
      - "field-ops-app-vite/src/domain/pickerSource.js"
      - "field-ops-app-vite/src/hooks/useAccountPicker.js"
      - "field-ops-app-vite/src/modules/workOrders/WorkOrderWizard.jsx"
      - "field-ops-app-vite/src/modules/sales/NewOpportunityForm.jsx"
      - "field-ops-app-vite/src/modules/equipment/EquipmentRegister.jsx"
      - "field-ops-app-vite/test/pickerSource.test.mjs"
      - ".github/workflows/bounded-picker-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bounded-picker-tests:
    name: Bounded picker reads (node:test + wizard + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: field-ops-app-vite
      - name: Picker source tests (node:test)
        run: node --test test/pickerSource.test.mjs
        working-directory: field-ops-app-vite
      - name: Work Order wizard tests
        run: node test/workOrderWizard.test.mjs
        working-directory: field-ops-app-vite
      - name: Equipment workspace + opportunity form component tests (vitest)
        run: npx vitest run test/equipmentWorkspace.test.jsx test/newOpportunityForm.test.jsx
        working-directory: field-ops-app-vite

      - name: Lint the touched surfaces (oxlint)
        run: npx oxlint src/domain/pickerSource.js src/hooks/useAccountPicker.js src/modules/workOrders/WorkOrderWizard.jsx src/modules/sales/NewOpportunityForm.jsx src/modules/equipment/EquipmentRegister.jsx
        working-directory: field-ops-app-vite
