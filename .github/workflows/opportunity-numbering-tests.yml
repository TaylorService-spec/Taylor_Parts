name: Opportunity Numbering Tests

# CI coverage for Opportunity reference allocation (OPP-YYYY-######).
#
# A NEW subsystem needs its own path-filtered workflow or it is CI-uncovered: this
# repo runs per-subsystem workflows on PRs rather than one global suite.
#
# What is being protected is a correctness property, not a formatting preference. A
# reference that can be reused would put two Opportunities behind one identifier in
# another record's lineage, and the failure would surface as a confusing duplicate
# long after the transaction that caused it. Offline: compiled output plus a
# transaction stub, no emulator, no secrets.

on:
  pull_request:
    paths:
      - "functions/src/opportunity/opportunityNumbering.ts"
      - "functions/test/opportunityNumbering.test.mjs"
      - ".github/workflows/opportunity-numbering-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/opportunity/opportunityNumbering.ts"
      - "functions/test/opportunityNumbering.test.mjs"
      - ".github/workflows/opportunity-numbering-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  opportunity-numbering-tests:
    name: Opportunity reference allocation (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: functions
      - name: Build
        run: npm run build
        working-directory: functions
      - name: Opportunity numbering tests
        run: node test/opportunityNumbering.test.mjs
        working-directory: functions
