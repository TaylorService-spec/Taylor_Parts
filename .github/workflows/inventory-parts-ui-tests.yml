name: Inventory Parts UI Tests

# Issue #100 / INV-CONVERGENCE-E — enforcement for the Inventory Parts UI cutover work in
# field-ops-app-vite (starting with the WarehouseManagerHome canonical Parts Catalog cutover). Runs the
# offline unit chain (incl. the new pure warehouseManagerCatalogView view-model test), the component
# render/lifecycle gate (vitest + jsdom — proves canonical-first rendering + fail-closed blocked/loading),
# lint, typecheck, and build. Pure/offline: no emulator, no Firebase, no deployment, no production access,
# no repository secrets. This UI reads the ALREADY-DEPLOYED canonical `parts` read Rules; it activates,
# grants, and deploys nothing.

on:
  pull_request:
    paths:
      - "field-ops-app-vite/src/modules/inventoryRole/WarehouseManagerHome.jsx"
      - "field-ops-app-vite/src/domain/warehouseManagerCatalogView.js"
      - "field-ops-app-vite/src/domain/partsCatalogView.js"
      - "field-ops-app-vite/src/domain/partsCompatibilityAdapter.js"
      - "field-ops-app-vite/src/services/partMasterQueries.js"
      - "field-ops-app-vite/test/warehouseManagerCatalogView.test.mjs"
      - "field-ops-app-vite/test/warehouseManagerHome.test.jsx"
      - "field-ops-app-vite/src/modules/inventory/PartsList.jsx"
      - "field-ops-app-vite/src/modules/inventory/PartDetail.jsx"
      - "field-ops-app-vite/src/domain/partDetailView.js"
      - "field-ops-app-vite/test/partsListInvalid.test.jsx"
      - "field-ops-app-vite/test/partDetailInvalid.test.jsx"
      - "field-ops-app-vite/test/partDetailView.test.mjs"
      - "field-ops-app-vite/test/partsCatalogView.test.mjs"
      - "field-ops-app-vite/package.json"
      - "field-ops-app-vite/package-lock.json"
      - "field-ops-app-vite/vitest.config.js"
      - ".github/workflows/inventory-parts-ui-tests.yml"
  push:
    branches: [main]
    paths:
      - "field-ops-app-vite/src/modules/inventoryRole/WarehouseManagerHome.jsx"
      - "field-ops-app-vite/src/domain/warehouseManagerCatalogView.js"
      - "field-ops-app-vite/src/domain/partsCatalogView.js"
      - "field-ops-app-vite/src/domain/partsCompatibilityAdapter.js"
      - "field-ops-app-vite/src/services/partMasterQueries.js"
      - "field-ops-app-vite/test/warehouseManagerCatalogView.test.mjs"
      - "field-ops-app-vite/test/warehouseManagerHome.test.jsx"
      - "field-ops-app-vite/src/modules/inventory/PartsList.jsx"
      - "field-ops-app-vite/src/modules/inventory/PartDetail.jsx"
      - "field-ops-app-vite/src/domain/partDetailView.js"
      - "field-ops-app-vite/test/partsListInvalid.test.jsx"
      - "field-ops-app-vite/test/partDetailInvalid.test.jsx"
      - "field-ops-app-vite/test/partDetailView.test.mjs"
      - "field-ops-app-vite/test/partsCatalogView.test.mjs"
      - "field-ops-app-vite/package.json"
      - "field-ops-app-vite/package-lock.json"
      - "field-ops-app-vite/vitest.config.js"
      - ".github/workflows/inventory-parts-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-parts-ui:
    name: Inventory Parts UI (unit + components + lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: field-ops-app-vite
      - name: Unit tests (offline view-model chain)
        run: npm test
        working-directory: field-ops-app-vite
      - name: Component render / lifecycle gate (vitest + jsdom)
        run: npm run test:components
        working-directory: field-ops-app-vite
      - name: Lint
        run: npm run lint
        working-directory: field-ops-app-vite
      - name: Typecheck
        run: npm run typecheck
        working-directory: field-ops-app-vite
      - name: Build
        run: npm run build
        working-directory: field-ops-app-vite
