permissions:
  contents: read

jobs:
  inventory-parts-ui:
    name: Inventory Parts UI (unit + components + lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: field-ops-app-vite
      - name: Unit tests (offline view-model chain)
        run: npm test
        working-directory: field-ops-app-vite
      - name: Component render / lifecycle gate (vitest + jsdom)
        run: npm run test:components
        working-directory: field-ops-app-vite
      - name: Lint
        run: npm run lint
        working-directory: field-ops-app-vite
      - name: Typecheck
        run: npm run typecheck
        working-directory: field-ops-app-vite
      - name: Build
        run: npm run build
        working-directory: field-ops-app-vite
