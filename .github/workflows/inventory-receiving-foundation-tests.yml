name: Inventory Receiving Foundation Tests

# Enterprise Inventory -- EI Phase-2 Receiving, Phase A: INERT receiving foundation
# (functions/src/inventoryReceiving/*). Pure/OFFLINE unit tests: NO emulator, NO credentials, NO
# gcloud/firebase, NO production. The foundation is INERT (no callable, no client writer, no ledger-append
# orchestration, not invoked by any behavior) and is never run against production.

on:
  pull_request:
    paths:
      - "functions/src/inventoryReceiving/**"
      - "functions/src/inventoryLedger/**"
      - "functions/test/inventoryReceivingFoundation.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-receiving-foundation-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/inventoryReceiving/**"
      - "functions/src/inventoryLedger/**"
      - "functions/test/inventoryReceivingFoundation.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-receiving-foundation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-receiving-foundation-tests:
    name: Inventory receiving foundation unit tests (offline, inert)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Inventory receiving foundation unit tests (offline, no emulator)
        run: npm run test:inventoryReceiving
        working-directory: functions
