name: Truck Registry Smoke Verifier Unit Tests

# EI Truck Registry — Gate C governed smoke-verifier unit tests
# (functions/scripts/truckRegistryVerificationMatrix.js + verifyTruckRegistryDeployment.js).
# These are PURE unit tests with injected fakes — NO emulator, NO credentials, NO gcloud/firebase,
# NO deployment, NO production access or execution. The verifier itself does NOT self-execute and
# is never run against production in CI. (No existing PR workflow covered the governed-verifier
# unit tests, so this dedicated workflow is limited to `node --test` only.)

on:
  pull_request:
    paths:
      - "functions/scripts/truckRegistryVerificationMatrix.js"
      - "functions/scripts/verifyTruckRegistryDeployment.js"
      - "functions/scripts/truckRegistryVerifierCli.js"
      - "functions/test/verifyTruckRegistryDeployment.test.js"
      - "config/truck-registry-deployment-verification.example.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/truck-registry-verifier-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/scripts/truckRegistryVerificationMatrix.js"
      - "functions/scripts/verifyTruckRegistryDeployment.js"
      - "functions/scripts/truckRegistryVerifierCli.js"
      - "functions/test/verifyTruckRegistryDeployment.test.js"
      - "config/truck-registry-deployment-verification.example.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/truck-registry-verifier-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truck-registry-verifier-tests:
    name: Truck Registry verifier unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Truck Registry verifier unit tests (injected fakes only)
        run: npm run test:truckRegistryVerifier
        working-directory: functions
