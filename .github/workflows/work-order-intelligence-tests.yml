name: Work Order Intelligence Tests

on:
  pull_request:
    paths:
      - "config/environments.json"
      - "scripts/resolveEnvironment.mjs"
      - "field-ops-app-vite/src/config/workOrderReadinessContextReadiness.js"
      - "field-ops-app-vite/src/services/workOrderReadinessContextClient.js"
      - "field-ops-app-vite/src/hooks/useWorkOrderReadinessContext.js"
      - "field-ops-app-vite/src/domain/workOrderIntelligence.js"
      - "field-ops-app-vite/src/domain/workOrderGovernedRecommendation.js"
      - "field-ops-app-vite/src/domain/workOrderNorthStar.js"
      - "field-ops-app-vite/src/domain/workOrderPartsReadiness.js"
      - "field-ops-app-vite/src/modules/workOrders/WorkOrderDetailPage.jsx"
      - "field-ops-app-vite/test/workOrderIntelligence.test.mjs"
      - "field-ops-app-vite/test/workOrderGovernedRecommendation.test.mjs"
      - "functions/src/index.ts"
      - "functions/src/ai/workOrderContext.ts"
      - "functions/src/ai/workOrderReadinessContext.ts"
      - "functions/src/ai/workOrderReadinessSources.ts"
      - "functions/src/ai/workOrderModelInterpretation.ts"
      - "functions/src/inventory/partBalanceReadService.ts"
      - "functions/src/inventory/partBalanceBatchReadService.ts"
      - "functions/src/fulfillment/fulfillmentAvailability.ts"
      - "functions/test/aiWorkOrderContext.test.mjs"
      - "functions/test/aiWorkOrderReadinessContext.test.mjs"
      - "functions/test/aiWorkOrderReadinessSources.test.mjs"
      - "functions/test/aiWorkOrderModelInterpretation.test.mjs"
      - ".github/workflows/work-order-intelligence-tests.yml"
  push:
    branches: [main]
    paths:
      - "config/environments.json"
      - "scripts/resolveEnvironment.mjs"
      - "field-ops-app-vite/src/config/workOrderReadinessContextReadiness.js"
      - "field-ops-app-vite/src/services/workOrderReadinessContextClient.js"
      - "field-ops-app-vite/src/hooks/useWorkOrderReadinessContext.js"
      - "field-ops-app-vite/src/domain/workOrderIntelligence.js"
      - "field-ops-app-vite/src/domain/workOrderGovernedRecommendation.js"
      - "field-ops-app-vite/src/domain/workOrderNorthStar.js"
      - "field-ops-app-vite/src/domain/workOrderPartsReadiness.js"
      - "field-ops-app-vite/src/modules/workOrders/WorkOrderDetailPage.jsx"
      - "field-ops-app-vite/test/workOrderIntelligence.test.mjs"
      - "field-ops-app-vite/test/workOrderGovernedRecommendation.test.mjs"
      - "functions/src/index.ts"
      - "functions/src/ai/workOrderContext.ts"
      - "functions/src/ai/workOrderReadinessContext.ts"
      - "functions/src/ai/workOrderReadinessSources.ts"
      - "functions/src/ai/workOrderModelInterpretation.ts"
      - "functions/src/inventory/partBalanceReadService.ts"
      - "functions/src/inventory/partBalanceBatchReadService.ts"
      - "functions/src/fulfillment/fulfillmentAvailability.ts"
      - "functions/test/aiWorkOrderContext.test.mjs"
      - "functions/test/aiWorkOrderReadinessContext.test.mjs"
      - "functions/test/aiWorkOrderReadinessSources.test.mjs"
      - "functions/test/aiWorkOrderModelInterpretation.test.mjs"
      - ".github/workflows/work-order-intelligence-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  work-order-intelligence:
    name: North Star Work Order intelligence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client dependencies
        run: npm ci
        working-directory: field-ops-app-vite
      - name: Governed client intelligence, recommendation and activation contract
        run: node --test test/workOrderIntelligence.test.mjs test/workOrderGovernedRecommendation.test.mjs
        working-directory: field-ops-app-vite

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions
      - name: Build Functions
        run: npm run build
        working-directory: functions
      - name: Governed server context, readiness assembly and model-output verification
        run: node --test test/aiWorkOrderContext.test.mjs test/aiWorkOrderReadinessSources.test.mjs test/aiWorkOrderReadinessContext.test.mjs test/aiWorkOrderModelInterpretation.test.mjs
        working-directory: functions
