name: EOS autonomy controls

# Guards the controls that make unattended EOS safe to leave running: the Owner capacity reserve
# (§4.1), no-progress/stagnation detection (§5.1-5.2), and their wiring into hardStopReason.
# A regression here means a run can consume the Owner's subscription, or spin indefinitely while
# every existing ceiling reads it as healthy.
on:
  pull_request:
    paths:
      - "docs/orchestration/lib/ownerCapacityReserve*.mjs"
      - "docs/orchestration/lib/progressDetection*.mjs"
      - "docs/orchestration/lib/autonomyPolicy*.mjs"
      - "docs/orchestration/lib/writerLanes*.mjs"
      - ".github/workflows/eos-autonomy-controls-tests.yml"
  push:
    branches: [main]
    paths:
      - "docs/orchestration/lib/ownerCapacityReserve*.mjs"
      - "docs/orchestration/lib/progressDetection*.mjs"
      - "docs/orchestration/lib/autonomyPolicy*.mjs"
      - "docs/orchestration/lib/writerLanes*.mjs"

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test docs/orchestration/lib/ownerCapacityReserve.test.mjs docs/orchestration/lib/progressDetection.test.mjs docs/orchestration/lib/autonomyPolicy.test.mjs docs/orchestration/lib/writerLanes.test.mjs
