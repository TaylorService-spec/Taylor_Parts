name: Reorder Domain Client Tests

# The client reorder domain modules (field-ops-app-vite/src/domain/inventoryReorderRequests.js,
# reorderPurchaseOrders.js, reorderRequestCancelGuard.js, reorderRequestPayload.js) had NO workflow
# path-filtering them: a change here ran no test in CI at all. inventoryReorderRequests.js and
# reorderPurchaseOrders.js import firebase/firebase.js (build-time-injected config) and cannot run
# under this project's plain `node test/*.test.mjs` runner, so their pure decision logic is factored
# out into reorderRequestCancelGuard.js and reorderRequestPayload.js -- this workflow covers exactly
# that logic, offline.
#
# ===================== WORKSTREAM 2B -- WHAT THIS LANE NOW ALSO OWNS =====================
#
# The reorder create and Record-PO writes moved to trusted callables, and firestore.rules retired
# the direct client writes. Three properties are now worth more than the transaction bodies this
# lane used to apologise for not covering, and all three are asserted here:
#
#   1. NO SECOND WRITE AUTHORITY. reorderTrustedWritePathContract.test.mjs is a static contract:
#      no application code creates a reorder_requests or reorder_purchase_orders document directly,
#      no code performs the Record-PO transition client-side, and no catch-path falls back into the
#      retired writes. It runs under node:test and needs no browser.
#   2. THE GOVERNED WAREHOUSE IS STATED, NEVER INVENTED. The request now carries a warehouseId from
#      which the SERVER derives the operating company, so a client-side default would author an
#      ownership fact nobody chose. The two vitest suites pin the selector's honest empty state,
#      the submit gate, and the absence of any fallback.
#   3. THE GATING WAREHOUSE IS THE WRITTEN WAREHOUSE. RequestReorderControl hands its own
#      warehouseId back on submit rather than each caller re-reading page state.
#
# The vitest suites are named here because this repository has no glob lane for `.test.jsx` -- an
# unnamed suite never runs in CI (field-ops-app-vite/test/ciSuiteCoverage.test.mjs is the guard that
# makes forgetting that a test failure rather than a silent gap).

on:
  pull_request:
    paths:
      - "field-ops-app-vite/src/domain/inventoryReorderRequests.js"
      - "field-ops-app-vite/src/domain/reorderPurchaseOrders.js"
      - "field-ops-app-vite/src/domain/reorderRequestCancelGuard.js"
      - "field-ops-app-vite/src/domain/reorderRequestPayload.js"
      - "field-ops-app-vite/src/services/reorderCallableClient.js"
      - "field-ops-app-vite/src/shared/inventory/**"
      - "field-ops-app-vite/src/modules/inventory/PartsList.jsx"
      - "field-ops-app-vite/src/modules/inventory/PartDetail.jsx"
      - "field-ops-app-vite/src/modules/inventoryRole/WarehouseManagerHome.jsx"
      - "field-ops-app-vite/src/modules/operations/panels/InventoryHealthPanel.jsx"
      - "field-ops-app-vite/src/hooks/useWarehouseOptions.js"
      - "field-ops-app-vite/test/inventoryReorderRequestsCancelGuard.test.mjs"
      - "field-ops-app-vite/test/reorderRequestPayload.test.mjs"
      - "field-ops-app-vite/test/reorderTrustedWritePathContract.test.mjs"
      - "field-ops-app-vite/test/reorderWarehouseSelector.test.jsx"
      - "field-ops-app-vite/test/reorderWarehouseOptionsSource.test.jsx"
      - "field-ops-app-vite/src/hooks/useReorderWarehouseOptions.js"
      - "field-ops-app-vite/test/reorderCreateWarehouseRequired.test.jsx"
      - "field-ops-app-vite/test/inventoryHealthPanelNames.test.jsx"
      - "field-ops-app-vite/package.json"
      - "field-ops-app-vite/package-lock.json"
      - ".github/workflows/reorder-domain-client-tests.yml"
  push:
    branches: [main]
    paths:
      - "field-ops-app-vite/src/domain/inventoryReorderRequests.js"
      - "field-ops-app-vite/src/domain/reorderPurchaseOrders.js"
      - "field-ops-app-vite/src/domain/reorderRequestCancelGuard.js"
      - "field-ops-app-vite/src/domain/reorderRequestPayload.js"
      - "field-ops-app-vite/src/services/reorderCallableClient.js"
      - "field-ops-app-vite/src/shared/inventory/**"
      - "field-ops-app-vite/src/modules/inventory/PartsList.jsx"
      - "field-ops-app-vite/src/modules/inventory/PartDetail.jsx"
      - "field-ops-app-vite/src/modules/inventoryRole/WarehouseManagerHome.jsx"
      - "field-ops-app-vite/src/modules/operations/panels/InventoryHealthPanel.jsx"
      - "field-ops-app-vite/src/hooks/useWarehouseOptions.js"
      - "field-ops-app-vite/test/inventoryReorderRequestsCancelGuard.test.mjs"
      - "field-ops-app-vite/test/reorderRequestPayload.test.mjs"
      - "field-ops-app-vite/test/reorderTrustedWritePathContract.test.mjs"
      - "field-ops-app-vite/test/reorderWarehouseSelector.test.jsx"
      - "field-ops-app-vite/test/reorderWarehouseOptionsSource.test.jsx"
      - "field-ops-app-vite/src/hooks/useReorderWarehouseOptions.js"
      - "field-ops-app-vite/test/reorderCreateWarehouseRequired.test.jsx"
      - "field-ops-app-vite/test/inventoryHealthPanelNames.test.jsx"
      - "field-ops-app-vite/package.json"
      - "field-ops-app-vite/package-lock.json"
      - ".github/workflows/reorder-domain-client-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reorder-domain-client-tests:
    name: Reorder domain client -- pure decision logic + trusted write-path contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: field-ops-app-vite

      - name: Reorder cancel-guard + create-payload builder tests
        run: |
          node test/inventoryReorderRequestsCancelGuard.test.mjs
          node test/reorderRequestPayload.test.mjs
        working-directory: field-ops-app-vite

      # The static contract. If this fails, a second write authority has reappeared -- which the
      # Rules retirement would then reject at runtime, in a user's face, rather than at review.
      - name: Trusted reorder write-path contract (static)
        run: node --test test/reorderTrustedWritePathContract.test.mjs
        working-directory: field-ops-app-vite

      - name: Reorder warehouse selector + required-warehouse gate (jsdom)
        run: npx vitest run test/reorderWarehouseSelector.test.jsx test/reorderWarehouseOptionsSource.test.jsx test/reorderCreateWarehouseRequired.test.jsx test/inventoryHealthPanelNames.test.jsx
        working-directory: field-ops-app-vite
