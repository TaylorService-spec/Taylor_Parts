name: Access Admin Credential Reset Tests

# AUTH-PR-3 (Authentication Modernization, extends Issue #226) tests for
# functions/src/access/adminCredentialCommands.ts -- runs the full
# adminCredentialCommands emulator suite (npm run test:adminCredential) against a
# freshly started Firestore-only emulator (no Auth needed: the command uses
# injected Admin-SDK deps, matching the audit/trusted-writer suites). Emulator-
# only, project "taylor-parts", loopback host -- no production access, no
# credentials, no repository secrets.

on:
  pull_request:
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/auditEventWriter.ts"
      - "functions/src/access/adminCredentialCommands.ts"
      - "functions/src/access/adminCredentialCallables.ts"
      - "functions/test/adminCredentialCommands.test.mjs"
      - "functions/test/adminCredentialResetLinkValidity.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/access-admin-credential-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/auditEventWriter.ts"
      - "functions/src/access/adminCredentialCommands.ts"
      - "functions/src/access/adminCredentialCallables.ts"
      - "functions/test/adminCredentialCommands.test.mjs"
      - "functions/test/adminCredentialResetLinkValidity.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/access-admin-credential-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-admin-credential-tests:
    name: Admin credential reset command tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a Java process.
      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore,auth --project taylor-parts --config ../firebase.json > /tmp/firestore-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/firestore-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Firestore emulator did not become ready in time"
          cat /tmp/firestore-emulator.log
          exit 1
        working-directory: functions

      - name: Admin credential reset command tests (build + run)
        run: npm run test:adminCredential
        working-directory: functions

      - name: Reset-link OOB validity test (Auth emulator)
        run: npm run test:adminCredentialLinkValidity
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-admin-credential-emulator-logs
          path: |
            /tmp/firestore-emulator.log
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7
