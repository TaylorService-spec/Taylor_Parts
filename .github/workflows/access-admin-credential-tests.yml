name: Access Admin Credential Reset Tests

# AUTH-PR-3 / PRE-2 (Authentication Modernization, extends Issue #226) tests for
# functions/src/access/adminCredential*.ts. Runs THREE layers against freshly
# started Firestore + Auth emulators (loopback, project "taylor-parts"; no
# production access, no credentials, no repository secrets):
#   1. adminCredentialCommands suite -- command policy GIVEN injected Admin-SDK
#      deps (Firestore-backed op records; injected facts).
#   2. adminCredentialActorFacts suite -- the PRODUCTION actor-fact adapter
#      (resolveActorFacts) against REAL Auth + users/{uid} + employees/{employeeId}
#      records: exact employees.userId reciprocity, employmentStatus === "ACTIVE",
#      and Auth disabled/missing handling. Requires the Auth emulator.
#   3. adminCredentialTargetFacts suite -- the PRODUCTION target-fact adapter
#      (resolveTargetFacts) against REAL Auth + Firestore: exact employees.userId
#      reciprocity, employmentStatus === "ACTIVE", Auth disabled/missing/email,
#      break-glass, and final-recoverable-admin. Requires the Auth emulator.
#   4. adminCredentialSendDedupe suite (PRE-1) -- the concrete NativeResetSender's
#      durable idempotency-key deduplication (Firestore emulator), outbound send
#      replaced by a controlled FAKE (no real send): at-most-one call per key,
#      replay, the claimed->uncertain crash gap, binding-mismatch/malformed
#      fail-closed, and concurrency.
#   5. adminCredentialResetLinkValidity -- Auth-emulator OOB link observation.

on:
  pull_request:
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/auditEventWriter.ts"
      - "functions/src/access/adminCredentialCommands.ts"
      - "functions/src/access/adminCredentialCallables.ts"
      - "functions/src/access/nativeResetSender.ts"
      - "functions/src/access/oobCodeOutbound.ts"
      - "functions/test/adminCredentialCommands.test.mjs"
      - "functions/test/adminCredentialActorFacts.test.mjs"
      - "functions/test/adminCredentialTargetFacts.test.mjs"
      - "functions/test/adminCredentialSendDedupe.test.mjs"
      - "functions/test/oobCodeOutbound.test.mjs"
      - "functions/test/auditEventWriter.test.mjs"
      - "functions/test/adminCredentialResetLinkValidity.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/access-admin-credential-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/auditEventWriter.ts"
      - "functions/src/access/adminCredentialCommands.ts"
      - "functions/src/access/adminCredentialCallables.ts"
      - "functions/src/access/nativeResetSender.ts"
      - "functions/src/access/oobCodeOutbound.ts"
      - "functions/test/adminCredentialCommands.test.mjs"
      - "functions/test/adminCredentialActorFacts.test.mjs"
      - "functions/test/adminCredentialTargetFacts.test.mjs"
      - "functions/test/adminCredentialSendDedupe.test.mjs"
      - "functions/test/oobCodeOutbound.test.mjs"
      - "functions/test/auditEventWriter.test.mjs"
      - "functions/test/adminCredentialResetLinkValidity.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/access-admin-credential-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-admin-credential-tests:
    name: Admin credential reset command tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a Java process.
      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore,auth --project taylor-parts --config ../firebase.json > /tmp/firestore-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/firestore-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Firestore emulator did not become ready in time"
          cat /tmp/firestore-emulator.log
          exit 1
        working-directory: functions

      - name: Admin credential reset command tests (build + run)
        run: npm run test:adminCredential
        working-directory: functions

      - name: Actor-fact adapter tests (Auth + Firestore emulator)
        run: npm run test:adminCredentialActorFacts
        working-directory: functions

      - name: Target-fact adapter tests (Auth + Firestore emulator)
        run: npm run test:adminCredentialTargetFacts
        working-directory: functions

      - name: Native-sender dedupe tests (Firestore emulator; PRE-1)
        run: npm run test:adminCredentialSendDedupe
        working-directory: functions

      - name: Native-sender outbound adapter tests (pure; fake transport, no real send)
        run: npm run test:oobCodeOutbound
        working-directory: functions

      - name: Reset-link OOB validity test (Auth emulator)
        run: npm run test:adminCredentialLinkValidity
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-admin-credential-emulator-logs
          path: |
            /tmp/firestore-emulator.log
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7
