name: Work Order Field Context Tests

# F1 -- authorization + minimal-projection contract for
# getWorkOrderFieldContext, the trusted display projection that answers
# "who is the customer / which site am I going to?" for a technician's OWN
# assigned Work Order.
#
# Hermetic: source-contract assertions only. No emulator, no network, no
# credentials, no repository secrets, no production access.
#
# These tests exist to keep three properties true as the code evolves:
#   1. every denial path is evaluated BEFORE any canonical record is read;
#   2. the surface cannot become a customer-lookup API (workOrderId only, ids
#      taken from the governed Work Order, no queries/listing);
#   3. no Firestore Rule was widened and no broad customer-read capability was
#      granted to make it work.

on:
  pull_request:
    paths:
      - "functions/src/getWorkOrderFieldContext.ts"
      - "functions/src/callerContext.ts"
      - "functions/src/constants/collections.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/index.ts"
      - "functions/test/workOrderFieldContext.test.mjs"
      - "firestore.rules"
      - "functions/package.json"
      - ".github/workflows/work-order-field-context-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/getWorkOrderFieldContext.ts"
      - "functions/src/callerContext.ts"
      - "functions/src/constants/collections.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/index.ts"
      - "functions/test/workOrderFieldContext.test.mjs"
      - "firestore.rules"
      - "functions/package.json"
      - ".github/workflows/work-order-field-context-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work-order-field-context-tests:
    name: getWorkOrderFieldContext authorization + projection contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions
      - name: Field context authorization + projection tests
        run: node --test test/workOrderFieldContext.test.mjs
        working-directory: functions
