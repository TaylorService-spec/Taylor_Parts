name: Inventory Ledger Foundation Tests

# Enterprise Inventory -- EI-P1 INERT location-aware operational ledger foundation
# (functions/src/inventoryLedger/*). Pure/OFFLINE unit tests: NO emulator, NO credentials, NO
# gcloud/firebase, NO production. The foundation is INERT (no callable, no client writer, not invoked
# by existing behavior) and is never run against production. Includes a parity assertion against the
# merged frontend pure contract (field-ops-app-vite/src/domain/inventoryLedgerEvent.js).

on:
  pull_request:
    paths:
      - "functions/src/inventoryLedger/**"
      - "functions/test/operationalMovementLedger.test.mjs"
      - "field-ops-app-vite/src/domain/inventoryLedgerEvent.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-ledger-foundation-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/inventoryLedger/**"
      - "functions/test/operationalMovementLedger.test.mjs"
      - "field-ops-app-vite/src/domain/inventoryLedgerEvent.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-ledger-foundation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-ledger-foundation-tests:
    name: Inventory ledger foundation unit tests (offline, inert)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Inventory ledger foundation unit tests (offline, no emulator)
        run: npm run test:inventoryLedger
        working-directory: functions
