name: Failure classification

# Guards the rule that a deterministic failure fails ONCE. A regression here restores the
# 2026-08-13 defect: a workflows-permission denial retried five times, wasting capacity and
# burying the root cause for three days.
on:
  pull_request:
    paths:
      - "docs/orchestration/lib/failureClassification*.mjs"
      - "docs/orchestration/lib/autonomyPolicy*.mjs"
      - ".github/workflows/failure-classification-tests.yml"
  push:
    branches: [main]
    paths:
      - "docs/orchestration/lib/failureClassification*.mjs"
      - "docs/orchestration/lib/autonomyPolicy*.mjs"

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test docs/orchestration/lib/failureClassification.test.mjs docs/orchestration/lib/autonomyPolicy.test.mjs
