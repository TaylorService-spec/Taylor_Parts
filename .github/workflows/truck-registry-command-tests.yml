name: Truck Registry Command Tests

# EI Truck Registry trusted write service (ADR-010 / Decision #60) -- tests for
# functions/src/truckRegistry/truckRegistryCommands.ts against freshly started
# Firestore + Auth emulators (Firestore for trucks/mobile_locations/
# location_truck_claims/employees/warehouses/auditEvents; Auth for the actor
# custom tokens the harness mints). Emulator-only, project "taylor-parts",
# loopback host -- no production access, no credentials, no repository secrets.
# NOT a production activation workflow -- these commands are now EXPORTED from
# functions/src/index.ts (Gate B) but remain UNDEPLOYED and inert until deployment
# is separately authorized (Issue #15). "Export is not deployment."

on:
  pull_request:
    paths:
      - "functions/src/truckRegistry/**"
      - "functions/src/index.ts"
      - "functions/src/types/access.ts"
      - "functions/src/access/auditEventWriter.ts"
      - "functions/test/truckRegistryCommands.test.mjs"
      - "functions/test/truckRegistryCallables.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/truck-registry-command-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/truckRegistry/**"
      - "functions/src/index.ts"
      - "functions/src/types/access.ts"
      - "functions/src/access/auditEventWriter.ts"
      - "functions/test/truckRegistryCommands.test.mjs"
      - "functions/test/truckRegistryCallables.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/truck-registry-command-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truck-registry-command-tests:
    name: Truck Registry command tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Start Firestore + Auth emulators (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore,auth --project taylor-parts --config ../firebase.json > /tmp/truck-registry-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/truck-registry-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulators did not become ready in time"
          cat /tmp/truck-registry-emulator.log
          exit 1
        working-directory: functions

      - name: Truck Registry command tests (build + run)
        run: npm run test:truckRegistryCommands
        working-directory: functions

      - name: Truck Registry callable tests (build + run)
        run: npm run test:truckRegistryCallables
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truck-registry-emulator-logs
          path: /tmp/truck-registry-emulator.log
          if-no-files-found: ignore
          retention-days: 7
