permissions:
  contents: read

jobs:
  scan-workspace-tests:
    name: Shared Scan workspace + lookup + multi-scan receiving (node:test + vitest + jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: field-ops-app-vite

      # Pure derivation first. It needs no DOM, and if eligibility is wrong nothing downstream matters.
      - name: Scan workflow availability (pure)
        run: node --test test/scanWorkflows.test.mjs test/technicianInventory.test.mjs test/personaOperability.test.mjs
        working-directory: field-ops-app-vite

      - name: Lookup-only scanning contract (pure)
        run: node --test test/partLookup.test.mjs test/partLookupAlias.test.mjs test/partLookupInventoryRows.test.mjs
        working-directory: field-ops-app-vite

      # The TRUSTED side of barcode resolution. Pure over an injected per-type resolver, so it needs
      # no emulator: what it proves is the aggregation (ambiguity, inactive, malformed) and that the
      # service adds no second matcher.
      - name: Install Functions dependencies
        run: npm install
        working-directory: functions

      - name: Build Functions
        run: npm run build
        working-directory: functions

      - name: Scanned identifier resolver (pure)
        run: node --test test/partAliasScanResolver.test.mjs
        working-directory: functions

      - name: Shared inventory balance read (pure)
        run: node --test test/partBalanceReadService.test.mjs
        working-directory: functions

      # Whether a part is serial-tracked is the SERVER's fact. Caller-supplied, it let a shelf with
      # two serialized units report a confident zero -- found in sandbox validation 2026-08-21.
      - name: Part balance tracking-mode authority (the caller does not choose the answer)
        run: node --test test/partBalanceTrackingModeAuthority.test.mjs
        working-directory: functions

      - name: Descriptive bin registry (pure)
        run: node --test test/binRegistry.test.mjs test/putAwayCommand.test.mjs test/returnIntakeCommand.test.mjs
        working-directory: functions

      - name: Scanner release readiness matrix
        run: node --test test/scannerReleaseReadiness.test.mjs
        working-directory: functions

      - name: Transfer scan verification + truck handoff (pure)
        run: node --test test/transferScanVerification.test.mjs test/truckHandoff.test.mjs
        working-directory: field-ops-app-vite

      - name: Cycle count scan session (pure)
        run: node --test test/cycleCountScanSession.test.mjs
        working-directory: field-ops-app-vite

      - name: Shared scan input policy (pure)
        run: node --test test/scanInputPolicy.test.mjs test/offlineSubmissionQueue.test.mjs
        working-directory: field-ops-app-vite

      - name: Put-away and pick sessions (pure)
        run: node --test test/putAwaySession.test.mjs test/pickSession.test.mjs
        working-directory: field-ops-app-vite

      - name: Receiving scan queue (pure)
        run: node --test test/receivingScanQueue.test.mjs
        working-directory: field-ops-app-vite

      - name: Service navigation groups tripwire
        run: node test/serviceNavGroups.test.mjs
        working-directory: field-ops-app-vite

      # Named explicitly: an unnamed vitest suite does not run in this repository's CI at all.
      - name: Scan workspace + lookup + multi-scan receiving journey + transport (vitest + jsdom)
        run: npx vitest run test/scanWorkspace.test.jsx test/lookupScan.test.jsx test/lookupScanAlias.test.jsx test/transferScan.test.jsx test/cycleCountScan.test.jsx test/scanInput.test.jsx test/dictatableNote.test.jsx test/submissionQueue.test.jsx test/scanMobileRegression.test.jsx test/putAwayOfflineAdoption.test.jsx test/partsScannerQtyReset.test.jsx test/receivingLocationOptionAdapter.test.jsx test/cycleCountsBlindReview.test.jsx test/operationsTransferOrders.test.jsx test/useTransferOrders.test.jsx test/operationsQueriesTransferOrdersPage.test.jsx test/putAwayScan.test.jsx test/pickScan.test.jsx test/multiScanReceiving.test.jsx test/receivingTransport.test.jsx
        working-directory: field-ops-app-vite
