name: Scan Workspace Tests

# THE SCANNING SURFACES — the shared Scan workspace (Phase E), the lookup-only scan it offers
# (Phase F), barcode/alias resolution behind that lookup (Phase G), and the multi-scan supplier
# receiving journey it composes (Phase D).
#
# WHY THIS WORKFLOW EXISTS. The client's vitest suites run in CI ONLY when a workflow names the file;
# there is no glob lane. Phase D's two vitest suites (multiScanReceiving.test.jsx, receivingTransport.test.jsx)
# were added without one, so from the day they merged until this workflow landed they had never run in
# CI even once — they passed locally and were CI-invisible. Registering them here closes that gap, and
# the path list below is deliberately wide enough that a change to the queue, the transport, the
# readiness constant, the nav config or the workspace itself brings this lane with it.
#
# WHAT IS PROVEN HERE.
#   partLookup             — lookup-only scanning: a refusal is never an absence, a failed read is
#                            never an empty catalog, UNKNOWN survives, and the module imports no
#                            command or writer at all.
#   lookupScan             — the same properties on the mounted surface, plus that it offers exactly
#                            one control and no way to move stock.
#   partAliasScanResolver  — the trusted multi-type resolver: ambiguity is never a pick, INACTIVE is
#                            never NOT_FOUND, and it adds no matcher or normalizer of its own.
#   partLookupAlias        — how the identifier answer composes with the part-code answer, including
#                            that an identifier failure never falls back to an unrelated part and
#                            that a code meaning two different things resolves to neither.
#   lookupScanAlias        — those outcomes on the mounted surface, each with its own words.
#   scanWorkflows          — eligibility derives from the EXISTING capability model, never from a role
#                            name, and no scanner-specific capability was invented. Also asserts, at
#                            file level, that ROLE_NAV_ACCESS gained no governed business role.
#   scanWorkspace          — the shared entry composes all three journeys rather than reimplementing
#                            any of them;
#                            Phase D's queue, blocked-submission and UNKNOWN-tracking properties still
#                            hold when launched from it; readiness-false calls no protected callable.
#   multiScanReceiving     — the Phase D journey itself.
#   receivingTransport     — the pinned callable names and the client transport export allowlist.
#   serviceNavGroups       — the nav tripwire, which the Scan item extends.
#
# Offline: no emulator, no deployment, no secrets, no production access. The emulator-backed receiving
# command suites live in inventory-receiving-command-tests.yml, each in its own isolated emulator.

on:
  pull_request:
    paths:
      - "field-ops-app-vite/src/access/scanWorkflows.js"
      - "field-ops-app-vite/src/services/partAliasCallableClient.js"
      - "field-ops-app-vite/src/config/partIdentifierReadiness.js"
      - "functions/src/partMaster/partAliasScanResolver.ts"
      - "functions/src/partMaster/partAliasCallables.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "field-ops-app-vite/src/domain/partLookup.js"
      - "field-ops-app-vite/src/domain/scannedIdentity.js"
      - "field-ops-app-vite/src/domain/scanCandidates.js"
      - "field-ops-app-vite/src/services/partMasterQueries.js"
      - "field-ops-app-vite/src/access/governedSurfaceCapabilities.js"
      - "field-ops-app-vite/src/modules/scan/**"
      - "field-ops-app-vite/src/modules/receiving/**"
      - "field-ops-app-vite/src/modules/mobile/PartsScanner.jsx"
      - "field-ops-app-vite/src/domain/receivingScanQueue.js"
      - "field-ops-app-vite/src/domain/receivingTransport.js"
      - "field-ops-app-vite/src/services/receivingCallableClient.js"
      - "field-ops-app-vite/src/config/receivingReadiness.js"
      - "field-ops-app-vite/src/navigation/navConfig.js"
      - "field-ops-app-vite/src/App.jsx"
      - "field-ops-app-vite/test/scanWorkflows.test.mjs"
      - "field-ops-app-vite/test/partLookup.test.mjs"
      - "field-ops-app-vite/test/partLookupAlias.test.mjs"
      - "field-ops-app-vite/test/lookupScanAlias.test.jsx"
      - "functions/test/partAliasScanResolver.test.mjs"
      - "field-ops-app-vite/test/lookupScan.test.jsx"
      - "field-ops-app-vite/test/scanWorkspace.test.jsx"
      - "field-ops-app-vite/test/multiScanReceiving.test.jsx"
      - "field-ops-app-vite/test/receivingTransport.test.jsx"
      - "field-ops-app-vite/test/receivingScanQueue.test.mjs"
      - "field-ops-app-vite/test/serviceNavGroups.test.mjs"
      - ".github/workflows/scan-workspace-tests.yml"
  push:
    branches: [main]
    paths:
      - "field-ops-app-vite/src/access/scanWorkflows.js"
      - "field-ops-app-vite/src/services/partAliasCallableClient.js"
      - "field-ops-app-vite/src/config/partIdentifierReadiness.js"
      - "functions/src/partMaster/partAliasScanResolver.ts"
      - "functions/src/partMaster/partAliasCallables.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "field-ops-app-vite/src/domain/partLookup.js"
      - "field-ops-app-vite/src/domain/scannedIdentity.js"
      - "field-ops-app-vite/src/domain/scanCandidates.js"
      - "field-ops-app-vite/src/services/partMasterQueries.js"
      - "field-ops-app-vite/src/access/governedSurfaceCapabilities.js"
      - "field-ops-app-vite/src/modules/scan/**"
      - "field-ops-app-vite/src/modules/receiving/**"
      - "field-ops-app-vite/src/modules/mobile/PartsScanner.jsx"
      - "field-ops-app-vite/src/domain/receivingScanQueue.js"
      - "field-ops-app-vite/src/domain/receivingTransport.js"
      - "field-ops-app-vite/src/services/receivingCallableClient.js"
      - "field-ops-app-vite/src/config/receivingReadiness.js"
      - "field-ops-app-vite/src/navigation/navConfig.js"
      - "field-ops-app-vite/src/App.jsx"
      - "field-ops-app-vite/test/scanWorkflows.test.mjs"
      - "field-ops-app-vite/test/partLookup.test.mjs"
      - "field-ops-app-vite/test/partLookupAlias.test.mjs"
      - "field-ops-app-vite/test/lookupScanAlias.test.jsx"
      - "functions/test/partAliasScanResolver.test.mjs"
      - "field-ops-app-vite/test/lookupScan.test.jsx"
      - "field-ops-app-vite/test/scanWorkspace.test.jsx"
      - "field-ops-app-vite/test/multiScanReceiving.test.jsx"
      - "field-ops-app-vite/test/receivingTransport.test.jsx"
      - "field-ops-app-vite/test/receivingScanQueue.test.mjs"
      - "field-ops-app-vite/test/serviceNavGroups.test.mjs"
      - ".github/workflows/scan-workspace-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-workspace-tests:
    name: Shared Scan workspace + lookup + multi-scan receiving (node:test + vitest + jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: field-ops-app-vite

      # Pure derivation first. It needs no DOM, and if eligibility is wrong nothing downstream matters.
      - name: Scan workflow availability (pure)
        run: node --test test/scanWorkflows.test.mjs
        working-directory: field-ops-app-vite

      - name: Lookup-only scanning contract (pure)
        run: node --test test/partLookup.test.mjs test/partLookupAlias.test.mjs
        working-directory: field-ops-app-vite

      # The TRUSTED side of barcode resolution. Pure over an injected per-type resolver, so it needs
      # no emulator: what it proves is the aggregation (ambiguity, inactive, malformed) and that the
      # service adds no second matcher.
      - name: Install Functions dependencies
        run: npm install
        working-directory: functions

      - name: Build Functions
        run: npm run build
        working-directory: functions

      - name: Scanned identifier resolver (pure)
        run: node --test test/partAliasScanResolver.test.mjs
        working-directory: functions

      - name: Receiving scan queue (pure)
        run: node --test test/receivingScanQueue.test.mjs
        working-directory: field-ops-app-vite

      - name: Service navigation groups tripwire
        run: node test/serviceNavGroups.test.mjs
        working-directory: field-ops-app-vite

      # Named explicitly: an unnamed vitest suite does not run in this repository's CI at all.
      - name: Scan workspace + lookup + multi-scan receiving journey + transport (vitest + jsdom)
        run: npx vitest run test/scanWorkspace.test.jsx test/lookupScan.test.jsx test/lookupScanAlias.test.jsx test/multiScanReceiving.test.jsx test/receivingTransport.test.jsx
        working-directory: field-ops-app-vite
