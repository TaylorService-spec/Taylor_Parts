name: Scan Workspace Tests

# THE SCANNING SURFACES — the shared Scan workspace (Phase E), the lookup-only scan it offers
# (Phase F), barcode/alias resolution behind that lookup (Phase G), transfers by scan (Phase J1),
# and the multi-scan supplier receiving journey it composes (Phase D).
#
# WHY THIS WORKFLOW EXISTS. The client's vitest suites run in CI ONLY when a workflow names the file;
# there is no glob lane. Phase D's two vitest suites (multiScanReceiving.test.jsx, receivingTransport.test.jsx)
# were added without one, so from the day they merged until this workflow landed they had never run in
# CI even once — they passed locally and were CI-invisible. Registering them here closes that gap, and
# the path list below is deliberately wide enough that a change to the queue, the transport, the
# readiness constant, the nav config or the workspace itself brings this lane with it.
#
# WHAT IS PROVEN HERE.
#   partLookup             — lookup-only scanning: a refusal is never an absence, a failed read is
#                            never an empty catalog, UNKNOWN survives, and the module imports no
#                            command or writer at all.
#   lookupScan             — the same properties on the mounted surface, plus that it offers exactly
#                            one control and no way to move stock.
#   returnIntakeCommand    — the DECISIONS #118 invariant, asserted on the code: a return writes no
#                            ledger event and never restores stock, every return awaits disposition,
#                            and CONDITION never branches behaviour — an observation must not
#                            quietly become a routing decision.
#   putAwayCommand         — the DECISIONS #116 invariant, asserted on the code: put-away writes no
#                            ledger event, touches no balance, emits no location reference and cannot
#                            name quarantine. A comment promising it would not be enough.
#   pickSession            — picking RESERVES NOTHING: the module cannot name a reservation, a
#                            ledger or a balance, because reservation is a Work Order lifecycle
#                            effect and inventing an operator one would decide a policy nobody has.
#                            SHORT is a real, stageable outcome.
#   putAwaySession         — the same boundary on the client, plus the bin vocabulary preserved.
#   binRegistry            — a bin DESCRIBES where stock sits; the warehouse still owns it. Asserts
#                            structurally that no BIN location reference and no quantity can be
#                            emitted, which is the shape that would let a bin leak into custody math.
#   partBalanceReadService — the shared balance read: UNKNOWN is never zero, a serialized part never
#                            claims a quantity, the per-location breakdown sums to its own total, and
#                            no fourth on-hand implementation exists.
#   partLookupInventoryRows — what those reads turn into rows: a refused read is never an empty
#                            shelf, a loading read never says it failed.
#   scanInputPolicy        — the ONE input policy: a wedge stutter and a camera re-emitting every
#                            frame are one scan, but counting ten identical boxes is ten. The two
#                            sources get different repeat windows for exactly that reason.
#   offlineSubmissionQueue — UNVERIFIED is a first-class state, not a spinner: a sent-but-unanswered
#                            submission is never silently re-sent, never assumed done, and a
#                            confirmed group is never replayed. The queue cannot read a payload.
#   submissionQueue        — the durable half: it survives the tab, revives in-flight work as
#                            UNVERIFIED rather than confirmed, and reconnection is a READ.
#   dictatableNote         — dictation is an INPUT METHOD, not an assistant: speech becomes text in
#                            an editable field and stops. No transport, no intent, no decision — the
#                            conversational assistant is a separate future add-on, and this asserts
#                            the boundary structurally.
#   scanInput              — the shared input: wedge, camera and typing; focus returns after every
#                            scan; the camera degrades honestly and never stays on.
#   cycleCountScanSession  — the count is BLIND (no expected figure is accepted, stored, derived or
#                            displayed) and observation is not adjustment (no reconcile path at all).
#   cycleCountScan         — those two properties on the mounted surface.
#   truckHandoff           — warehouse<->truck handoff is a TRANSFER, proved end to end on the same
#                            surface: the warehouse releases at the origin, the technician accepts at
#                            the truck, and no parallel handoff state machine exists.
#   transferScanVerification — scanning VERIFIES a transfer, it never authors one: no payload is
#                            derived from scans, wrong part / wrong location / excess / stale status
#                            each block, and the module imports no command or ledger.
#   transferScan           — those rules on the mounted surface, plus that submission sends only the
#                            transfer id and a refusal renders as a refusal.
#   partAliasScanResolver  — the trusted multi-type resolver: ambiguity is never a pick, INACTIVE is
#                            never NOT_FOUND, and it adds no matcher or normalizer of its own.
#   partLookupAlias        — how the identifier answer composes with the part-code answer, including
#                            that an identifier failure never falls back to an unrelated part and
#                            that a code meaning two different things resolves to neither.
#   lookupScanAlias        — those outcomes on the mounted surface, each with its own words.
#   ALSO RUN HERE, adopted from the legacy orphan allowlist (item 2): partsScannerQtyReset,
#   receivingLocationOptionAdapter, cycleCountsBlindReview, operationsTransferOrders,
#   useTransferOrders and operationsQueriesTransferOrdersPage. They cover the scanner's own
#   subsystems -- the technician scanner, receiving location options, blind-count review and the
#   transfer read model -- so this is the lane that owns them, and registering them was free.
#
#   scannerReleaseReadiness — the release matrix, executable: which capabilities are active, who
#                            holds them, which readiness gates are set, and that the three new
#                            collections need no Rules block. A grant or activation change fails it.
#   personaOperability     — the same facts from the persona side: what each role can actually reach.
#                            Its headline is that no warehouse or parts persona reaches anything but
#                            lookup, because none holds a scanner capability.
#   scanWorkflows          — eligibility derives from the EXISTING capability model, never from a role
#                            name, and no scanner-specific capability was invented. Also asserts, at
#                            file level, that ROLE_NAV_ACCESS gained no governed business role.
#   scanWorkspace          — the shared entry composes all three journeys rather than reimplementing
#                            any of them;
#                            Phase D's queue, blocked-submission and UNKNOWN-tracking properties still
#                            hold when launched from it; readiness-false calls no protected callable.
#   multiScanReceiving     — the Phase D journey itself.
#   receivingTransport     — the pinned callable names and the client transport export allowlist.
#   serviceNavGroups       — the nav tripwire, which the Scan item extends.
#
# Offline: no emulator, no deployment, no secrets, no production access. The emulator-backed receiving
# command suites live in inventory-receiving-command-tests.yml, each in its own isolated emulator.

