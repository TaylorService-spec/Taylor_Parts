name: EOS Intake — persistent execution runtime (Owner-gated)

# Persistent EXECUTION runtime trigger. On a merged EXECUTION_AUTHORIZED *.work.json intake, a Windows
# self-hosted runner under the Owner's Windows user runs intake-runtime.mjs execute per changed artifact:
# it wakes the worker through the EXISTING Wake Supervisor, resolves the OPENAI_REVIEW credential INTERNALLY
# via the merged Secret Broker (DPAPI CurrentUser — decryptable only under the Owner's Windows profile),
# runs the review, and commits the status + content-addressed result. No Owner PowerShell, no Claude GUI.
#
# DORMANT BY DESIGN. It runs ONLY when BOTH are true, which is the Owner's protected runtime activation:
#   1. a self-hosted runner labeled [self-hosted, windows, eos-runtime] is online under the Owner's user, and
#   2. the repo variable EOS_RUNTIME_ENABLED == 'true'.
# Until then no job runs — paid execution cannot start. DPAPI binds the secret to the Owner's Windows user,
# so a GitHub-hosted (Linux) runner can never decrypt it: live paid execution is physically confined to the
# Owner's machine. See docs/orchestration/eos-runtime-activation.md.

on:
  # PRIMARY handoff: fire when the Issue-intake workflow finishes. Its work.json write-back is pushed by
  # github-actions[bot] using GITHUB_TOKEN, and GitHub deliberately does NOT trigger `on: push` workflows from
  # GITHUB_TOKEN pushes (recursion prevention). workflow_run is exempt from that rule, so it is the reliable
  # wake trigger. The push trigger below is kept for direct/human pushes of a work.json.
  workflow_run:
    workflows: ["EOS Issue Intake — adapt, govern, and dispatch"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "docs/orchestration/work-intake/**/*.work.json"
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: run ONLY this requestId (fast targeted run / landing smoke test). Blank = drain all eligible."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: eos-intake-execute
  cancel-in-progress: false

jobs:
  execute:
    name: Execute eligible EXECUTION_AUTHORIZED intakes (self-hosted Windows, Owner-gated)
    # On a workflow_run wake, only proceed if the upstream intake actually succeeded; other events are unaffected.
    if: ${{ vars.EOS_RUNTIME_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: [self-hosted, windows, eos-runtime]
    # The execute step drains ALL eligible EXECUTION_AUTHORIZED items sequentially. Each item's result is now
    # landed PER ITEM (see the step below), so a timeout/interruption no longer strands a whole pass — everything
    # already finished has been pushed. This budget just needs to cover a full multi-child fan-out (a governed
    # parent can decompose into many children at ~5–8 min each); 180 leaves comfortable margin.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Execute eligible intakes and land each result per item (durable, isolated)
        shell: pwsh
        env:
          ONLY: ${{ inputs.only }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node docs/orchestration/context/intake-ingest-ci.mjs --write
          if ($LASTEXITCODE -ne 0) { throw "intake status refresh failed with exit code $LASTEXITCODE" }
          if ($env:ONLY) { Write-Host "Targeted run: only $($env:ONLY)" }

          # Per EXECUTION_AUTHORIZED artifact: run the guarded execution runtime, then IMMEDIATELY land that one
          # item's result via the unit-tested intake-landing module (docs/orchestration/context/intake-landing.mjs,
          # verified in intake-landing.test.mjs). Per-item landing is the durability fix: each finished item is
          # pushed the moment it completes, so a later timeout/interruption can never strand a whole multi-child
          # pass again. intake-landing stages ONLY that requestId's work-intake paths and lands them on a freshly
          # reset origin/main (cherry-pick + push HEAD:main) — contamination-proof (a PATCH item's code can never
          # enter) and branch-robust (works from whatever branch a prior PATCH item left the runner on).
          $failed = @()
          Get-ChildItem "docs/orchestration/work-intake/*.work.json" | ForEach-Object {
            $artifact = Get-Content $_.FullName -Raw | ConvertFrom-Json
            # Targeted-run filter: when `only` is set, skip every item except that requestId — so a landing smoke
            # test (or a single re-run) completes in minutes instead of draining the whole eligible backlog.
            if ($env:ONLY -and $artifact.requestId -ne $env:ONLY) { return }
            if ($artifact.status -eq "EXECUTION_AUTHORIZED") {
              node docs/orchestration/context/intake-runtime.mjs execute --id $artifact.requestId --location $_.FullName --sha256 $artifact.sha256
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Intake $($artifact.requestId) returned exit code $LASTEXITCODE; landing its truthful status anyway."
              }
              node docs/orchestration/context/intake-landing.mjs --id $artifact.requestId
              if ($LASTEXITCODE -ne 0) { $failed += $artifact.requestId; Write-Warning "landing failed for $($artifact.requestId)" }
            }
          }
          # Final sweep: land any remaining work-intake changes (e.g. status refreshes for non-executed items).
          node docs/orchestration/context/intake-landing.mjs --sweep
          if ($LASTEXITCODE -ne 0) { $failed += "sweep"; Write-Warning "final sweep landing failed" }
          if ($failed.Count -gt 0) { throw "write-back failed to land for: $($failed -join ', ')" }
