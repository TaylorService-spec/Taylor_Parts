name: EOS Intake — persistent execution runtime (Owner-gated)

# Persistent EXECUTION runtime trigger. On a merged EXECUTION_AUTHORIZED *.work.json intake, a Windows
# self-hosted runner under the Owner's Windows user runs intake-runtime.mjs execute per changed artifact:
# it wakes the worker through the EXISTING Wake Supervisor, resolves the OPENAI_REVIEW credential INTERNALLY
# via the merged Secret Broker (DPAPI CurrentUser — decryptable only under the Owner's Windows profile),
# runs the review, and commits the status + content-addressed result. No Owner PowerShell, no Claude GUI.
#
# DORMANT BY DESIGN. It runs ONLY when BOTH are true, which is the Owner's protected runtime activation:
#   1. a self-hosted runner labeled [self-hosted, windows, eos-runtime] is online under the Owner's user, and
#   2. the repo variable EOS_RUNTIME_ENABLED == 'true'.
# Until then no job runs — paid execution cannot start. DPAPI binds the secret to the Owner's Windows user,
# so a GitHub-hosted (Linux) runner can never decrypt it: live paid execution is physically confined to the
# Owner's machine. See docs/orchestration/eos-runtime-activation.md.

on:
  # PRIMARY handoff: fire when the Issue-intake workflow finishes. Its work.json write-back is pushed by
  # github-actions[bot] using GITHUB_TOKEN, and GitHub deliberately does NOT trigger `on: push` workflows from
  # GITHUB_TOKEN pushes (recursion prevention). workflow_run is exempt from that rule, so it is the reliable
  # wake trigger. The push trigger below is kept for direct/human pushes of a work.json.
  workflow_run:
    workflows: ["EOS Issue Intake — adapt, govern, and dispatch"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "docs/orchestration/work-intake/**/*.work.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eos-intake-execute
  cancel-in-progress: false

jobs:
  execute:
    name: Execute eligible EXECUTION_AUTHORIZED intakes (self-hosted Windows, Owner-gated)
    # On a workflow_run wake, only proceed if the upstream intake actually succeeded; other events are unaffected.
    if: ${{ vars.EOS_RUNTIME_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: [self-hosted, windows, eos-runtime]
    # The execute step drains ALL eligible EXECUTION_AUTHORIZED items sequentially, and the write-back is
    # committed once AFTER the loop — so a timeout mid-loop cancels the job and strands every result computed
    # in that pass (observed: a 10-child governed decomposition ran C01–C05 then hit the 30-min cap and lost
    # them all). A governed parent can fan out into many children, so the budget must cover a full multi-child
    # pass. (Robustness follow-up: commit the write-back per item so partial progress survives an interruption.)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Execute eligible intakes + commit status/result
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node docs/orchestration/context/intake-ingest-ci.mjs --write
          if ($LASTEXITCODE -ne 0) { throw "intake status refresh failed with exit code $LASTEXITCODE" }

          # Per EXECUTION_AUTHORIZED artifact, run the guarded execution runtime. It spawns zero unless the
          # intake-state gate + capability seam + Wake readiness all pass. A refused/failed intake is allowed
          # to return nonzero here so its truthful status can still be committed for inspection.
          Get-ChildItem "docs/orchestration/work-intake/*.work.json" | ForEach-Object {
            $artifact = Get-Content $_.FullName -Raw | ConvertFrom-Json
            if ($artifact.status -eq "EXECUTION_AUTHORIZED") {
              node docs/orchestration/context/intake-runtime.mjs execute --id $artifact.requestId --location $_.FullName --sha256 $artifact.sha256
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Intake $($artifact.requestId) returned exit code $LASTEXITCODE; continuing so status/result can be written back."
              }
            }
          }
          exit 0
      - name: Commit status/result back to main (isolated, branch-robust)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage ONLY the work-intake artifacts. This is the whole safety guarantee: nothing outside
          # work-intake/{status,results,review-ready} can EVER enter the write-back, so a PATCH_PRODUCER item
          # that left the shared working tree on a stray branch (e.g. eos/issue-842-...) or with uncommitted
          # code changes can never leak into main. Only truthful status/results/review-ready ever land.
          git add docs/orchestration/work-intake/status docs/orchestration/work-intake/results docs/orchestration/work-intake/review-ready
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "no changes"; exit 0 }
          # Capture the staged artifacts as a single commit. Because only those paths were staged, this commit's
          # DIFF is exactly the artifacts — even if the current branch carries unrelated PATCH commits in history.
          git commit -m "eos: intake execution result write-back [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed with exit code $LASTEXITCODE" }
          $wb = (git rev-parse HEAD).Trim()
          # Land that artifact-only commit on CLEAN main, independent of which branch the runner was left on and
          # resilient to main moving: reset hard to a fresh origin/main, replay ONLY the artifact diff via
          # cherry-pick, and push HEAD:main (branch-robust; a bare 'git push' fails on a stray upstream-less branch).
          $pushed = $false
          for ($i = 1; $i -le 5; $i++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { Write-Warning "fetch failed (attempt $i); retrying."; Start-Sleep -Seconds 3; continue }
            git checkout -f -B eos-writeback FETCH_HEAD
            git reset --hard FETCH_HEAD
            git cherry-pick $wb
            if ($LASTEXITCODE -ne 0) { git cherry-pick --abort; Write-Warning "cherry-pick conflict (attempt $i); re-syncing with latest main."; Start-Sleep -Seconds 3; continue }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Warning "push rejected (attempt $i); re-syncing with main and retrying."
            Start-Sleep -Seconds 3
          }
          if (-not $pushed) { throw "write-back failed to land on main after 5 attempts" }
