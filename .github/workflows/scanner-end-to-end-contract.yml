name: Scanner End-to-End Contract

# THE CHAIN, not the links. Every scanner stage already has a passing unit suite; this lane exists
# for the failure those suites cannot see -- a stage that is correct about its OWN vocabulary and
# wrong about the next stage's.
#
# One part is carried through identify -> lookup -> receive -> put away -> pick/stage -> transfer ->
# truck handoff against the real Firestore emulator, and after every stage the SAME question the
# operator's screen asks is re-asked through readPartBalance. Cycle count and return intake run
# separately, because neither is a step in the custody journey.
#
# It is deliberately broad in its path filter: the whole point is that a change to ONE subsystem is
# exactly what breaks a seam in another. A narrow filter here would reintroduce the gap.
#
# Emulator only. NO production, NO deployment. Twelve of the thirteen capabilities involved are
# registered `active: false` and granted to no Role.

on:
  pull_request:
    paths:
      - "functions/src/inventory/**"
      - "functions/src/inventoryLocation/**"
      - "functions/src/inventoryReceiving/**"
      - "functions/src/inventoryReturns/**"
      - "functions/src/inventoryTransfer/**"
      - "functions/src/inventoryLedger/**"
      - "functions/src/cycleCount/**"
      - "functions/src/partMaster/**"
      - "functions/test/scannerEndToEndContract.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/scanner-end-to-end-contract.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/inventory/**"
      - "functions/src/inventoryLocation/**"
      - "functions/src/inventoryReceiving/**"
      - "functions/src/inventoryReturns/**"
      - "functions/src/inventoryTransfer/**"
      - "functions/src/inventoryLedger/**"
      - "functions/src/cycleCount/**"
      - "functions/src/partMaster/**"
      - "functions/test/scannerEndToEndContract.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/scanner-end-to-end-contract.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scanner-end-to-end-contract:
    name: Scanner end-to-end contract (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Build (TypeScript)
        run: npm run build
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/scanner-e2e-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/scanner-e2e-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulator did not become ready in time"
          cat /tmp/scanner-e2e-emulator.log
          exit 1
        working-directory: functions

      - name: The chain + cycle count + return intake + ten negative cases
        run: node test/scannerEndToEndContract.test.mjs
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-e2e-emulator-logs
          path: |
            /tmp/scanner-e2e-emulator.log
            functions/firestore-debug.log
          if-no-files-found: ignore
