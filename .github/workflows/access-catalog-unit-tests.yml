name: Access Catalog & Resolver Unit Tests

# Enterprise Access & Administration Platform (Issue #226) pure-logic unit
# tests -- no emulator, no deployment, no production access, no repository
# secrets. Runs functions/test/permissionCatalog.test.mjs (Spec sec21
# acceptance criteria A2), functions/test/resolveEffectivePermission.test.mjs
# (Spec sec21 A1/A3, S1/S2), functions/test/shadowParityHarness.test.mjs
# (Spec sec21 P1/P2), and functions/test/compactClaims.test.mjs (Spec sec11/
# sec13) against the compiled functions/lib output.

on:
  pull_request:
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/**"
      # The GENERATED client half. Without this the sync check does not run on a
      # change that touches only the generated copy -- which is exactly the edit
      # the generator exists to prevent, and the one case the guard could not see.
      - "field-ops-app-vite/src/access/**"
      - "scripts/syncAccessContracts.mjs"
      - "functions/test/compactClaimsMirrorIntegrity.test.mjs"
      - "functions/test/permissionCatalog.test.mjs"
      - "functions/test/roleHierarchy.test.mjs"
      - "functions/test/hierarchicalVisibility.test.mjs"
      - "functions/test/resolveEffectivePermission.test.mjs"
      - "functions/test/shadowParityHarness.test.mjs"
      - "functions/test/compactClaims.test.mjs"
      - "functions/src/purchasing/**"
      - "functions/test/purchaseOrderNormalization.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/access-catalog-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/**"
      # The GENERATED client half. Without this the sync check does not run on a
      # change that touches only the generated copy -- which is exactly the edit
      # the generator exists to prevent, and the one case the guard could not see.
      - "field-ops-app-vite/src/access/**"
      - "scripts/syncAccessContracts.mjs"
      - "functions/test/compactClaimsMirrorIntegrity.test.mjs"
      - "functions/test/permissionCatalog.test.mjs"
      - "functions/test/roleHierarchy.test.mjs"
      - "functions/test/hierarchicalVisibility.test.mjs"
      - "functions/test/resolveEffectivePermission.test.mjs"
      - "functions/test/shadowParityHarness.test.mjs"
      - "functions/test/compactClaims.test.mjs"
      - "functions/src/purchasing/**"
      - "functions/test/purchaseOrderNormalization.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/access-catalog-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-catalog-unit-tests:
    name: Permission catalog + resolver unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Runs BEFORE the suite and from the repo root: it needs no dependencies, and a
      # drift failure should be reported as drift rather than surfacing later as a
      # confusing assertion inside the access tests.
      - name: Access contract sync (generated copies match canonical)
        run: node scripts/syncAccessContracts.mjs --check

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Permission catalog + resolver unit tests (build + run)
        run: npm run test:access
        working-directory: functions
