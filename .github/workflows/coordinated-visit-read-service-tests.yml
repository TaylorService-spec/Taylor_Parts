name: Coordinated Visit Read Service Tests

# Coordinated Operations fidelity fix (2026-08-15): `Coordinated Visits` (Service/Dispatch) and
# `Coordinated Mission` (Technician) were shipping SYNTHETIC data as the default on normal, visible product
# surfaces. This is the governed BACKEND half of the fix -- the trusted `listCoordinatedOperations` read
# (functions/src/fulfillment/coordinatedVisitReadService.ts) that serves the two ALREADY-EXISTING pure
# projections (coordinatedVisit.ts / coordinatedFieldMission.ts, covered by the separate
# coordinated-operations-tests.yml workflow's frontend mirrors) from real fieldops_wos data. Pure-logic unit
# tests for the read projection core (no emulator, no deployment, no production access, no secrets) plus
# Firestore-emulator coverage for the bounded query (active-status filter, non-coordinated Work Orders
# dropped, truncation honestly reported) and the trusted callable's authorization boundary (unauthenticated /
# ungranted-in-every-project, since `fulfillment.coordinatedVisit.read` is registered active:false and
# granted to NO Role in this phase). The callable is undeployed; this workflow builds and runs tests against
# the compiled functions/lib output only.

on:
  pull_request:
    paths:
      - "functions/src/fulfillment/coordinatedVisitReadService.ts"
      - "functions/src/fulfillment/coordinatedVisit.ts"
      - "functions/src/fulfillment/coordinatedFieldMission.ts"
      - "functions/src/constants/collections.ts"
      - "functions/src/types/workOrder.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/environmentCapabilityOverrides.ts"
      - "functions/src/index.ts"
      - "field-ops-app-vite/src/access/permissionCatalog.ts"
      - "field-ops-app-vite/test/permissionCatalogRoleParity.test.mjs"
      - "functions/test/coordinatedVisitReadService.test.mjs"
      - "functions/test/coordinatedVisitReadCallable.test.mjs"
      - "functions/test/permissionCatalog.test.mjs"
      - "functions/test/resolveEffectivePermission.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/coordinated-visit-read-service-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/fulfillment/coordinatedVisitReadService.ts"
      - "functions/src/fulfillment/coordinatedVisit.ts"
      - "functions/src/fulfillment/coordinatedFieldMission.ts"
      - "functions/src/constants/collections.ts"
      - "functions/src/types/workOrder.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/environmentCapabilityOverrides.ts"
      - "functions/src/index.ts"
      - "field-ops-app-vite/src/access/permissionCatalog.ts"
      - "field-ops-app-vite/test/permissionCatalogRoleParity.test.mjs"
      - "functions/test/coordinatedVisitReadService.test.mjs"
      - "functions/test/coordinatedVisitReadCallable.test.mjs"
      - "functions/test/permissionCatalog.test.mjs"
      - "functions/test/resolveEffectivePermission.test.mjs"
      - ".github/workflows/coordinated-visit-read-service-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinated-visit-catalog-parity:
    name: Frontend/backend permission catalog parity (Node 22 -- imports .ts directly)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # permissionCatalogRoleParity.test.mjs imports field-ops-app-vite/src/access/permissionCatalog.ts
          # and compatibilityRoles.ts DIRECTLY (no build step) -- needs Node's native TypeScript support,
          # same reason sales-opportunity-tests.yml pins 22 for this exact test.
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      - name: Install field-ops-app-vite dependencies
        run: npm install
        working-directory: field-ops-app-vite
      - name: Permission catalog frontend/backend parity (node:test)
        run: node --test test/permissionCatalogRoleParity.test.mjs
        working-directory: field-ops-app-vite

  coordinated-visit-read-unit-tests:
    name: Coordinated Visit read -- pure projection (build + run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions
      - name: Coordinated Visit read projection tests (build + run)
        run: npm run test:coordinatedVisitRead
        working-directory: functions
      - name: Capability catalog registration tests (build + run)
        run: node test/permissionCatalog.test.mjs && node test/resolveEffectivePermission.test.mjs
        working-directory: functions

  coordinated-visit-read-emulator:
    name: Coordinated Visit read callable -- bounded query + authorization boundary (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/coordinated-visit-read-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/coordinated-visit-read-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Firestore emulator did not become ready in time"
          cat /tmp/coordinated-visit-read-emulator.log
          exit 1
        working-directory: functions

      - name: Coordinated Visit read callable tests (build + run)
        run: npm run test:coordinatedVisitReadEmulator
        working-directory: functions
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinated-visit-read-emulator-logs
          path: /tmp/coordinated-visit-read-emulator.log
          if-no-files-found: ignore
          retention-days: 7
