name: Truck Registry Functions Verifier Unit Tests

# EI Truck Registry — Gate D governed FUNCTIONS-verifier unit tests
# (functions/scripts/truckFunctionsVerificationMatrix.js + verifyTruckFunctionsDeployment.js +
# truckFunctionsVerifierCli.js). These are PURE unit tests with injected fakes — NO emulator, NO
# credentials, NO gcloud/firebase, NO deployment, NO production access or execution. The verifier
# itself does NOT self-execute and is never run against production in CI.

on:
  pull_request:
    paths:
      - "functions/scripts/truckFunctionsVerificationMatrix.js"
      - "functions/scripts/verifyTruckFunctionsDeployment.js"
      - "functions/scripts/truckFunctionsVerifierCli.js"
      - "functions/test/verifyTruckFunctionsDeployment.test.js"
      - "config/truck-functions-deployment-verification.example.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/truck-registry-functions-verifier-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/scripts/truckFunctionsVerificationMatrix.js"
      - "functions/scripts/verifyTruckFunctionsDeployment.js"
      - "functions/scripts/truckFunctionsVerifierCli.js"
      - "functions/test/verifyTruckFunctionsDeployment.test.js"
      - "config/truck-functions-deployment-verification.example.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/truck-registry-functions-verifier-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truck-functions-verifier-tests:
    name: Truck Registry functions verifier unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Truck Registry functions verifier unit tests (injected fakes only)
        run: npm run test:truckFunctionsVerifier
        working-directory: functions
