name: Report Execution Service Tests

# Issue #325 / ADR-007 D-FN: the trusted, field-projecting report
# execution service (functions/src/reporting/). Independent-review round
# 1 finding: this PR originally shipped no CI wiring at all for its own
# tests -- the most security-sensitive code in the #325/#226 chain had
# zero enforced regression coverage. Closes that gap, matching every
# other access-related test file's own dedicated workflow (e.g.
# access-audit-service-tests.yml).
#
# Runs the parity test (no emulator needed -- imports the client's actual
# reportCatalog.js/reportQueryModel.js/reportQueryValidation.js via a
# relative path from field-ops-app-vite/, present in this same checkout),
# the execution-service emulator test, and (Issue #325 D-RULES,
# corrected before W-SAVE activation) the trusted saved-definition
# command emulator test -- both Firestore only, no Auth needed, since
# neither service takes an ID token, only a server-resolved uid.
# Emulator-only, project "taylor-parts", loopback host -- no production
# access, no credentials, no repository secrets.

on:
  pull_request:
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/**"
      - "functions/src/reporting/**"
      # ENG-E: reportRowScope.ts reads the operating-company authority and the
      # ownership matrix's companyScope column as the authority for the row bound,
      # so a change there can silently change what a report may read.
      - "functions/src/ownership/operatingCompanyAuthority.ts"
      - "functions/src/ownership/ownershipMatrix.ts"
      - "config/environments.json"
      - "functions/test/reportCatalogParity.test.mjs"
      - "functions/test/reportExecutionService.test.mjs"
      - "functions/test/reportRowScopeBound.test.mjs"
      - "functions/test/reportTruncationHonesty.test.mjs"
      # RPT-FIX. The false-empty invariant, the audit-context census, and the
      # production-activation boundary guard -- all three run without an emulator.
      - "functions/test/reportFalseEmptyHonesty.test.mjs"
      - "functions/test/reportAuditContextInjection.test.mjs"
      - "functions/test/reportingActivationBoundary.test.mjs"
      - "functions/test/support/reportEngineHarness.mjs"
      # RPT-FIX. reportingActivationBoundary.test.mjs resolves the PRODUCTION
      # activation authority, so a change to either resolver changes what it proves.
      - "functions/src/access/environmentCapabilityOverrides.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/test/savedDefinitionCommands.test.mjs"
      - "field-ops-app-vite/src/domain/reporting/reportCatalog.js"
      - "field-ops-app-vite/src/domain/reporting/reportQueryModel.js"
      - "field-ops-app-vite/src/domain/reporting/reportQueryValidation.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/report-execution-service-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/**"
      - "functions/src/reporting/**"
      # ENG-E: reportRowScope.ts reads the operating-company authority and the
      # ownership matrix's companyScope column as the authority for the row bound,
      # so a change there can silently change what a report may read.
      - "functions/src/ownership/operatingCompanyAuthority.ts"
      - "functions/src/ownership/ownershipMatrix.ts"
      - "config/environments.json"
      - "functions/test/reportCatalogParity.test.mjs"
      - "functions/test/reportExecutionService.test.mjs"
      - "functions/test/reportRowScopeBound.test.mjs"
      - "functions/test/reportTruncationHonesty.test.mjs"
      # RPT-FIX. The false-empty invariant, the audit-context census, and the
      # production-activation boundary guard -- all three run without an emulator.
      - "functions/test/reportFalseEmptyHonesty.test.mjs"
      - "functions/test/reportAuditContextInjection.test.mjs"
      - "functions/test/reportingActivationBoundary.test.mjs"
      - "functions/test/support/reportEngineHarness.mjs"
      # RPT-FIX. reportingActivationBoundary.test.mjs resolves the PRODUCTION
      # activation authority, so a change to either resolver changes what it proves.
      - "functions/src/access/environmentCapabilityOverrides.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/test/savedDefinitionCommands.test.mjs"
      - "field-ops-app-vite/src/domain/reporting/reportCatalog.js"
      - "field-ops-app-vite/src/domain/reporting/reportQueryModel.js"
      - "field-ops-app-vite/src/domain/reporting/reportQueryValidation.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/report-execution-service-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  report-execution-service-tests:
    name: D-FN report execution + catalog parity tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a Java process.
      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Catalog/query-model/validator parity vs. the client (no emulator)
        run: npm run build && node test/reportCatalogParity.test.mjs
        working-directory: functions

      # ENG-E. Deliberately placed BEFORE the emulator starts: the row-scope bound
      # needs no emulator, so it must still be enforced when the emulator step
      # fails. It asserts on the QUERY PREDICATE ISSUED, not on rows returned --
      # Firestore applies the scan cap before any in-memory pass, so a row-count
      # assertion would go green on an in-memory post-filter that fixes nothing.
      - name: Report row-scope / operating-company bound (no emulator)
        run: node --test test/reportRowScopeBound.test.mjs
        working-directory: functions

      - name: Truncation honesty (no emulator)
        run: node --test test/reportTruncationHonesty.test.mjs
        working-directory: functions

      # RPT-FIX. Also deliberately BEFORE the emulator starts: none of these three
      # needs one, so they must still be enforced when the emulator step fails.
      #
      # Each file gets its OWN `node --test` invocation on purpose. `node --test`
      # silently DROPS a non-matching path argument when the other arguments
      # resolve, so a typo inside a multi-path invocation reduces coverage without
      # failing the step. One path per call turns that into a hard error.
      - name: False-empty honesty -- EOS must not return "empty" unless the query was proven complete (no emulator)
        run: node --test test/reportFalseEmptyHonesty.test.mjs
        working-directory: functions

      - name: Audit data-context injection -- no reporting audit write may reach the ambient Firestore (no emulator)
        run: node --test test/reportAuditContextInjection.test.mjs
        working-directory: functions

      # This guard was UNREGISTERED at 92db1d19 -- present in functions/test/ but
      # named by no npm script and no workflow, so its (false) fail-closed claim
      # was never even enforced. Registered here.
      - name: Reporting activation boundary -- the TRUE production posture, 25 live / 14 not (no emulator)
        run: node --test test/reportingActivationBoundary.test.mjs
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/firestore-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/firestore-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Firestore emulator did not become ready in time"
          cat /tmp/firestore-emulator.log
          exit 1
        working-directory: functions

      - name: Report execution service tests
        run: node test/reportExecutionService.test.mjs
        working-directory: functions

      - name: Saved-definition trusted command tests (Issue #325 D-RULES corrected)
        run: node test/savedDefinitionCommands.test.mjs
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-execution-service-emulator-logs
          path: |
            /tmp/firestore-emulator.log
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7
