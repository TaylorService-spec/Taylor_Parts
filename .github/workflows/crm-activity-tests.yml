name: CRM Activity / Notes Tests

# Taylor EOS Wave 7 extension PART 1.4 -- CRM Activity/Notes authority + UX. Covers BOTH halves:
#   1. Backend: PURE write/read-projection tests (no emulator) + Firestore-emulator tests for the trusted
#      createCrmActivity command (write + idempotency-replay + audit-atomicity) and the trusted
#      getCrmActivities read callable (capability gate + bounded-read honesty). crm.activity.create /
#      crm.activity.read are both registered active:false and granted to NO Role -- no production access,
#      no secrets, nothing deployed.
#   2. Client: domain view-model + component (honest loading/denied/unavailable/empty/populated states, no
#      raw UID rendered) + hook (idempotency-key retry discipline) tests, plus a lint pass.

on:
  pull_request:
    paths:
      - "functions/src/crmActivity/**"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/auditEventWriter.ts"
      - "functions/src/types/access.ts"
      - "functions/src/constants/collections.ts"
      - "functions/src/index.ts"
      - "functions/test/crmActivityCommands.test.mjs"
      - "functions/test/crmActivityReadService.test.mjs"
      - "functions/test/crmActivityCommandsEmulator.test.mjs"
      - "functions/test/crmActivityReadCallable.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - "field-ops-app-vite/src/access/permissionCatalog.ts"
      - "field-ops-app-vite/src/domain/crmActivityTypes.js"
      - "field-ops-app-vite/src/domain/crmActivityView.js"
      - "field-ops-app-vite/src/services/crmActivityCallableClient.js"
      - "field-ops-app-vite/src/hooks/useCrmActivities.js"
      - "field-ops-app-vite/src/hooks/useCrmActivityActions.js"
      - "field-ops-app-vite/src/modules/accounts/ActivityAndNotesSection.jsx"
      - "field-ops-app-vite/test/crmActivityView.test.mjs"
      - "field-ops-app-vite/test/activityAndNotesSection.test.jsx"
      - "field-ops-app-vite/test/useCrmActivityActions.test.jsx"
      - ".github/workflows/crm-activity-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/crmActivity/**"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/auditEventWriter.ts"
      - "functions/src/types/access.ts"
      - "functions/src/constants/collections.ts"
      - "functions/src/index.ts"
      - "functions/test/crmActivityCommands.test.mjs"
      - "functions/test/crmActivityReadService.test.mjs"
      - "functions/test/crmActivityCommandsEmulator.test.mjs"
      - "functions/test/crmActivityReadCallable.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - "field-ops-app-vite/src/access/permissionCatalog.ts"
      - "field-ops-app-vite/src/domain/crmActivityTypes.js"
      - "field-ops-app-vite/src/domain/crmActivityView.js"
      - "field-ops-app-vite/src/services/crmActivityCallableClient.js"
      - "field-ops-app-vite/src/hooks/useCrmActivities.js"
      - "field-ops-app-vite/src/hooks/useCrmActivityActions.js"
      - "field-ops-app-vite/src/modules/accounts/ActivityAndNotesSection.jsx"
      - "field-ops-app-vite/test/crmActivityView.test.mjs"
      - "field-ops-app-vite/test/activityAndNotesSection.test.jsx"
      - "field-ops-app-vite/test/useCrmActivityActions.test.jsx"
      - ".github/workflows/crm-activity-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Batch 1 proved the mechanism:
# two superseded PR runs cancelled, the newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  crm-activity-backend-pure-tests:
    name: CRM Activity backend -- pure write/read-projection tests (no emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: CRM Activity pure tests (build + run)
        run: npm run test:crmActivity
        working-directory: functions

  crm-activity-backend-emulator-tests:
    name: CRM Activity backend -- Firestore-emulator command + read callable tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Start Firestore + Auth emulators (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore,auth --project taylor-parts --config ../firebase.json > /tmp/crm-activity-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/crm-activity-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulators did not become ready in time"
          cat /tmp/crm-activity-emulator.log
          exit 1
        working-directory: functions

      - name: CRM Activity command + read callable emulator tests (build + run)
        run: npm run test:crmActivityEmulator
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-activity-emulator-logs
          path: /tmp/crm-activity-emulator.log
          if-no-files-found: ignore
          retention-days: 7

  crm-activity-client-tests:
    name: CRM Activity client -- domain + component + hook tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: the catalog parity test reads src/access/permissionCatalog.ts, and only
          # Node 22 strips TypeScript. sales-opportunity-tests.yml pins 22 for the same reason.
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json

      - name: Install app dependencies
        run: npm install
        working-directory: field-ops-app-vite

      - name: CRM Activity domain view-model tests
        run: node test/crmActivityView.test.mjs
        working-directory: field-ops-app-vite

      - name: Permission catalog frontend/backend parity (crm.activity.* ids included)
        # `node --test`, matching how sales-opportunity-tests.yml already runs this exact file.
        # Plain `node test/...` fails with ERR_UNKNOWN_FILE_EXTENSION on the .ts catalog it reads.
        run: node --test test/permissionCatalogRoleParity.test.mjs
        working-directory: field-ops-app-vite

      - name: CRM Activity component + hook tests
        run: npx vitest run test/activityAndNotesSection.test.jsx test/useCrmActivityActions.test.jsx
        working-directory: field-ops-app-vite

      - name: Lint
        run: npx oxlint src/domain/crmActivityTypes.js src/domain/crmActivityView.js src/services/crmActivityCallableClient.js src/hooks/useCrmActivities.js src/hooks/useCrmActivityActions.js src/modules/accounts/ActivityAndNotesSection.jsx
        working-directory: field-ops-app-vite
