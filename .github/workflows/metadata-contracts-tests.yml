name: Metadata Contracts Tests

# EOS Metadata-to-Platform program, Gate A -- CI coverage for the Entity/Field/
# Relationship definition contracts (field-ops-app-vite/src/metadata/).
#
# A NEW subsystem needs its own path-filtered workflow or it is CI-uncovered: this
# repo runs per-subsystem workflows on PRs rather than one global suite, so a test
# that exists but is named in no workflow simply never runs on a pull request.
#
# What these contracts guard is governance, not convenience -- metadata never
# grants authority (boundary section 6), definitions are data and never code
# (section 8), declared filter operators are a claim about a real backend query
# (section 9), and a machine value is never a display label. Those properties have
# to fail the build, not merely be documented, which is the whole reason this job
# exists this early.
#
# Offline: no emulator, no deploy, no secrets.

