      - name: Field Architecture v2 compatibility with existing definitions (node:test)
        run: node --test test/fieldArchitectureV2Compatibility.test.mjs
        working-directory: field-ops-app-vite
      - name: Record provenance invariant tests (node:test)
        run: node --test test/recordProvenance.test.mjs
        working-directory: field-ops-app-vite
      - name: EOS query model tests (node:test)
        run: node --test test/queryModel.test.mjs
        working-directory: field-ops-app-vite
      - name: Lint the metadata surface (oxlint)
        run: npx oxlint src/metadata
        working-directory: field-ops-app-vite
