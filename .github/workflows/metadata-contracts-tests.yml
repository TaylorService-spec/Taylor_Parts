  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  metadata-contracts-tests:
    name: Metadata definition contracts (node:test + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: field-ops-app-vite
      - name: Entity/Field/Relationship contract tests (node:test)
        run: node --test test/metadataEntityDefinition.test.mjs
        working-directory: field-ops-app-vite

      - name: List presentation model tests (node:test)
        run: node --test test/metadataListPresentation.test.mjs
        working-directory: field-ops-app-vite

      - name: List runtime query core tests (node:test)
        run: node --test test/metadataListRuntime.test.mjs
        working-directory: field-ops-app-vite
      - name: Page composition runtime tests (node:test)
        run: node --test test/metadataPageRuntime.test.mjs
        working-directory: field-ops-app-vite

      - name: ListViewDefinition contract tests (node:test)
        run: node --test test/metadataListViewDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Component/action registry tests (node:test)
        run: node --test test/metadataRegistry.test.mjs
        working-directory: field-ops-app-vite
      - name: Registry references — REAL page definition against the REAL registry (vitest)
        run: npx vitest run test/metadataRegistryRealPageDefinition.test.jsx
        working-directory: field-ops-app-vite
      - name: List sources — readVia dispatch and the callable source (vitest)
        run: npx vitest run test/metadataUseMetadataListReadVia.test.jsx test/metadataCallableListSource.test.jsx
        working-directory: field-ops-app-vite
      - name: Manufacturers surface on the metadata list runtime (vitest)
        run: npx vitest run test/manufacturersMetadataList.test.jsx
        working-directory: field-ops-app-vite
      - name: Warehouses surface on the metadata list runtime (vitest)
        run: npx vitest run test/warehousesSurface.test.jsx
        working-directory: field-ops-app-vite
      - name: Suppliers surface on the metadata list runtime (vitest)
        run: npx vitest run test/suppliersSurface.test.jsx
        working-directory: field-ops-app-vite
      - name: Technicians surface is NOT the Employees entity (vitest)
        run: npx vitest run test/techniciansSurfaceEmployeeDivergence.test.jsx
        working-directory: field-ops-app-vite
      - name: Transfers surface is a lifecycle composite, not a list (vitest)
        run: npx vitest run test/transfersSurface.test.jsx
        working-directory: field-ops-app-vite
      - name: Purchase Orders surface is a request-driven join, not a list (vitest)
        run: npx vitest run test/purchaseOrdersSurface.test.jsx
        working-directory: field-ops-app-vite
      - name: Roles surface has no entity and no read (vitest)
        run: npx vitest run test/adminRolesPermissionsDeclined.test.jsx
        working-directory: field-ops-app-vite
      - name: PageDefinition contract tests (node:test)
        run: node --test test/metadataPageDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Operational board scope contract tests (node:test)
        run: node --test test/boardScope.test.mjs
        working-directory: field-ops-app-vite
      - name: Work Order definition tests (node:test)
        run: node --test test/metadataWorkOrderDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: CRM definition tests — Contact + Opportunity (node:test)
        run: node --test test/metadataCrmDefinitions.test.mjs
        working-directory: field-ops-app-vite
      - name: Part definition tests (node:test)
        run: node --test test/metadataPartDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Equipment definition tests (node:test)
        run: node --test test/metadataEquipmentDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Employee definition tests (node:test)
        run: node --test test/metadataEmployeeDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Purchase Order definition tests (node:test)
        run: node --test test/metadataPurchaseOrderDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Location definition tests (node:test)
        run: node --test test/metadataLocationDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Warehouse definition tests (node:test)
        run: node --test test/metadataWarehouseDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Supplier definition tests (node:test)
        run: node --test test/metadataSupplierDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Fleet + catalog definition tests (node:test)
        run: node --test test/metadataFleetCatalogDefinitions.test.mjs
        working-directory: field-ops-app-vite
      - name: Billing definition tests (node:test)
        run: node --test test/metadataBillingDefinitions.test.mjs
        working-directory: field-ops-app-vite
      # Stock Location's definition and its suite are DELETED. The collection had no live writer
      # and no reachable reader, and the read-migration ruling was explicit: an unreachable
      # definition is deleted rather than given governed authority. The step goes with them --
      # a workflow naming a file that does not exist fails on the missing file, which reads
      # identically to a real regression.
      - name: Territory + mobile location definition tests (node:test)
        run: node --test test/metadataTerritoryMobileDefinitions.test.mjs
        working-directory: field-ops-app-vite
      - name: Held-definition identity modes (node:test)
        run: node --test test/metadataTransferOrderDefinition.test.mjs test/metadataInventoryMovementDefinitions.test.mjs test/metadataProcurementDefinitions.test.mjs
        working-directory: field-ops-app-vite
      - name: Catalog definition tests (node:test)
        run: node --test test/metadataCatalogDefinitions.test.mjs
        working-directory: field-ops-app-vite
      - name: Inventory action + PO void definition tests (node:test)
        run: node --test test/metadataInventoryActionDefinitions.test.mjs
        working-directory: field-ops-app-vite
      - name: Manufacturer definition tests (node:test)
        run: node --test test/metadataManufacturerDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Account record page definition tests (node:test)
        run: node --test test/metadataAccountPageDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Sales Order definition tests (node:test)
        run: node --test test/metadataSalesOrderDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: Account definition tests (node:test)
        run: node --test test/metadataAccountDefinition.test.mjs
        working-directory: field-ops-app-vite
      - name: List grid renderer tests (vitest, jsdom)
        run: npx vitest run test/metadataListGrid.test.jsx
        working-directory: field-ops-app-vite
      - name: Record page renderer tests (vitest, jsdom)
        run: npx vitest run test/metadataRecordPage.test.jsx
        working-directory: field-ops-app-vite
      # The client no longer translates a list descriptor into a Firestore query -- it names an EOS
      # source id and the SERVER owns the collection, the filters, the ordering and the cursor. The
      # translation contract therefore moved to where the translation happens -- which means this
      # job needs the functions dependency tree as well as the client one. It compiles TypeScript;
      # a job that only installed the client would fail on the import, not on the contract.
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Governed list source translation tests (build + node:test)
        run: npm run build && node --test test/governedListRead.test.mjs
        working-directory: functions

      # THE CENSUS. Three numbers reduce the whole Firebase-removal claim to something runnable:
      # zero direct governed client reads, zero writes, zero Firestore authorization decisions --
      # each surviving reader enumerated WITH the reason it survives, so a new one fails by name.
      #
      # It also resolves every relative import under src/. That catches a module left pointing at
      # deleted code, a break neither tsc nor vitest sees: these are untyped .js modules, and the
      # importing module is mocked wherever a test reaches it. Only the production build noticed,
      # and only after the branch had been green for several commits.
      - name: The client Firestore census (reads, writes, authorization, dangling imports)
        run: npx vitest run test/clientFirestoreCensus.test.jsx
        working-directory: field-ops-app-vite
      - name: Customers surface tests (vitest, jsdom)
        run: npx vitest run test/customersSurface.test.jsx
        working-directory: field-ops-app-vite
      - name: Account search contract tests (node:test)
        run: node --test test/accountSearch.test.mjs
        working-directory: field-ops-app-vite
      - name: Field Architecture v2 contract tests (node:test)
        run: node --test test/fieldArchitectureV2.test.mjs
        working-directory: field-ops-app-vite
      - name: Field Architecture v2 compatibility with existing definitions (node:test)
        run: node --test test/fieldArchitectureV2Compatibility.test.mjs
        working-directory: field-ops-app-vite
      - name: Record provenance invariant tests (node:test)
        run: node --test test/recordProvenance.test.mjs
        working-directory: field-ops-app-vite
      - name: EOS query model tests (node:test)
        run: node --test test/queryModel.test.mjs
        working-directory: field-ops-app-vite
      - name: Lint the metadata surface (oxlint)
        run: npx oxlint src/metadata
        working-directory: field-ops-app-vite
