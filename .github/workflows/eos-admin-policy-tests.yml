      # WAVE 14 / LANE BA: same registration on the PUSH block as on the pull_request block --
      # adding it to pull_request alone would let a direct push to main leave these two suites
      # untriggered. Both run in test:adminPolicy (offline).
      - "functions/test/personaAuthorityDimensions.test.mjs"
      - "functions/test/personaE2EHarness.test.mjs"
      - "functions/test/personaSuiteRegistration.test.mjs"
      # WAVE 14 / LANE BH -- the persona business ACCESS REGRESSION. Unlike the three above it
      # resolves through a real PostgreSQL (capabilitiesForRoleKeys), so it runs in
      # test:adminPolicyPostgres, where POLICY_TEST_DATABASE_URL is set and it cannot skip.
      - "functions/test/personaBusinessAccessRegression.test.mjs"
      # REGISTRATION GAP CLOSED (lane BS, canonical Job Role vocabulary). This suite pins the persona
      # provisioning plan's step count and its command mix, so it is a subject of every Job Role vocabulary
      # change. It was named in the pull_request filter above and NOT here, so a commit landing on main that
      # touched only this suite could not trigger the job that runs it.
      - "functions/test/reorderPersonaAcceptancePostgres.test.mjs"
      - "functions/scripts/fixtures/personaAuthorityDimensions.v1.json"
      - "functions/scripts/fixtures/personaE2EScenarios.v1.json"
      - "functions/test/technicianIdentityTrap.test.mjs"
      - "functions/src/workOrderConsumption/consumptionSourceService.ts"
      - "functions/src/cycleCount/cycleCountSheetCallables.ts"
      - "functions/src/inventoryTransfer/transferReceivableRead.ts"
      - "field-ops-app-vite/src/services/adminPolicyApiClient.js"
      - "field-ops-app-vite/src/domain/adminPolicyView.js"
      - "field-ops-app-vite/src/metadata/entityRegistry.js"
      - "field-ops-app-vite/src/modules/administration/**"
      # WAVE 15 / LANE BC: the migration LEDGER guard. `functions/package.json`'s `migrate:up` --
      # the whole of render.yaml's preDeployCommand -- now runs with `--no-check-order`, because a
      # legitimately applied migration sits out of id order in nonprod and the ordering check was
      # failing every pre-deploy over it. That flag switches off the only thing that was watching
      # the migration INVENTORY on deploy, so this suite watches it instead: the accepted anomaly
      # is enumerated exhaustively, an unknown or duplicated applied name fails, and a pending
      # migration back-dated into applied history fails. It runs in test:adminPolicyPostgres.
      - "functions/test/migrationLedgerOrderGuard.test.mjs"
      # LANE BG: the GENERIC governed identity re-bind operator. rebindPrincipalIdentity is absent from
      # ADMIN_MUTATION_OPERATIONS, so an operator script is its only entry point -- and the only
      # committed one was Owner-only. This is the general one, with its fences and its preservation
      # measurements. It runs in test:adminPolicyPostgres.
      - "functions/scripts/rebindPrincipalIdentity.js"
      - "functions/test/principalIdentityRebindPostgres.test.mjs"
      # LANE BU: the GENERIC governed Principal PROVISIONING operator. The write is
      # `ensureTenantPrincipal` in src/adminPolicy/tenantBootstrap.ts (already covered by
      # "functions/src/adminPolicy/**" above); the operator is the only place its missing guards
      # live -- PostgreSQL-derived administering capability over role_capabilities UNION
      # principal_capabilities, argv-supplied authority refused, duplicate external subject and
      # duplicate canonical Principal refused. Both the operator AND its subject command are named,
      # because a path filter omitting either yields a guard that is green because it never ran.
      - "functions/scripts/provisionGovernedPrincipal.js"
      - "functions/src/adminPolicy/tenantBootstrap.ts"
      - "functions/src/eosOps/capabilityAuthority.ts"
      - "functions/test/governedPrincipalProvisioningPostgres.test.mjs"
      # functions/package.json was named by the pull_request filter and NOT by this one, so an edit
      # to the deploy command itself could reach main without ever triggering the suite that proves
      # it. Named here too.
      - "functions/package.json"
      # WAVE 15 / LANE BL: the EXPERIENCE projection's own files, for the identical reason as
      # functions/package.json directly above. `functions/src/eosOps/**` already covers
      # experienceAuthority.ts here, but the four files that PROVE it -- its two suites and the two
      # client modules they import across the package boundary -- were named by the pull_request
      # filter and NOT by this one. So a change landing on main that touched only a suite or only
      # navConfig.js ran neither, and the surface catalog's invariants (0 catalog violations, 0
      # unmapped surfaces, the 62-row placeholder ceiling) went unchecked on the branch that
      # deploys. Named here too.
      - "functions/test/experienceAuthority.test.mjs"
      - "functions/test/experienceAuthorityPostgres.test.mjs"
      - "field-ops-app-vite/src/navigation/navConfig.js"
      - "field-ops-app-vite/src/access/experienceContext.js"
      - ".github/workflows/eos-admin-policy-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: Admin policy engine -- authorization, workflow, tenancy, schema, seed
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A REAL POSTGRESQL, not an emulator. The migration, the unique indexes, the foreign keys, the
    # CHECK constraints and transactional rollback are properties of the database itself; something
    # that approximates them proves nothing about the one that will actually hold the policy.
    #
    # Ephemeral, empty, and local to the job -- it holds no data anybody owns.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: eos
          POSTGRES_DB: eos_policy
        ports:
          - 5432:5432
        # Without the health check the job races the container's startup and fails intermittently,
        # which is worse than failing consistently.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --no-audit --no-fund
        working-directory: functions

      # Build first: the proofs import the compiled lib/, so a type error must fail the lane rather
      # than leave the tests running against a stale build that still passes.
      - name: Typecheck and build
        run: npm run build
        working-directory: functions

      # Offline first: if the pure engine is broken, a database failure underneath it is noise.
      - name: Admin policy proofs -- offline (build + run)
        run: npm run test:adminPolicy
        working-directory: functions
        env:
          # Deliberately UNSET here, so this step also proves the suites skip cleanly without a
          # database rather than silently depending on one.
          POLICY_TEST_DATABASE_URL: ""

      # The ACTIVATION proofs run inside this command, not beside it: test:adminPolicyPostgres is
      # the registered authority for "everything that needs a real database", and a second
      # invocation here would be a second list to keep in step with the first.
      - name: Migration, schema, tenancy, bootstrap and activation -- real PostgreSQL
        run: npm run test:adminPolicyPostgres
        working-directory: functions
        env:
          POLICY_TEST_DATABASE_URL: postgres://eos:eos@localhost:5432/eos_policy

      # The snapshot is GENERATED from the client metadata registry. A definition change that was
      # not re-snapshotted would seed a stale model, and this is what says so.
      - name: Seed snapshot is not stale
        run: node scripts/buildAdminPolicySeedSnapshot.mjs --check

  surfaces:
    name: Admin policy surfaces -- view model, entity registry, rendered grid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json

      - name: Install client dependencies
        run: npm ci --no-audit --no-fund
        working-directory: field-ops-app-vite

      # The view model draws what the server decided and must never become a second implementation
      # of the resolution rules -- one of these assertions is exactly that boundary.
      - name: Pure view model and entity registry (node:test)
        run: node --test test/adminPolicyView.test.mjs test/entityRegistry.test.mjs test/adminWorkflowView.test.mjs test/administrationPortalNav.test.mjs test/policyObjectRegistry.test.mjs test/reorderAuthoritySeparation.test.mjs test/adminPolicyApiClient.test.mjs
        working-directory: field-ops-app-vite

      - name: Rendered Roles & Permissions grid (vitest + jsdom)
        run: npx vitest run test/adminRolesPermissions.test.jsx
        working-directory: field-ops-app-vite

      # THE BROWSER'S ROUTE TO THE OBJECT-OWNED SECURITY READ MODEL. Proved through an injected
      # transport -- no network, no database. The authority itself is proved against real
      # PostgreSQL in the objectSecurityAuthorityPostgres job; what these two suites prove is that
      # the client names the server's operations, sends the input key its dispatcher requires,
      # returns the projection untouched, and reports a refusal AS a refusal rather than as an
      # empty security grid -- which on this screen would read as "nobody holds anything".
      - name: Object security read client and hooks (vitest + jsdom)
        run: npx vitest run test/adminPolicySecurityReads.test.jsx test/useObjectSecurity.test.jsx
        working-directory: field-ops-app-vite

      # THE READ MODEL THE LATER SCREEN IS ASSEMBLED FROM. The server's Role and Principal
      # projections send action KEYS and no labels; joining the Object/action inventory onto them
      # is the one place that is allowed to happen, and these assertions pin what it may not do --
      # invent a label, drop a grant the catalog cannot explain, re-sort the authority's answer, or
      # turn a refused read into an empty security grid. The last describe is the guard that this
      # tranche switched no source of truth: no Administration screen imports any of it.
      - name: Canonical security read model and friendly labels (vitest + jsdom)
        run: npx vitest run test/adminSecurityReadModel.test.jsx
        working-directory: field-ops-app-vite

      # WAVE 6 / LANE V -- THE BROWSER'S ROUTE TO THE EOS PRINCIPAL EXPERIENCE CONTEXT, and the hook
      # that owns its lifecycle. It runs under vitest rather than the node manifest because
      # services/operationsApiClient.js reaches firebase/firebase.js for the ID token, which
      # initializes Firebase at import time.
      #
      # What it pins: the client states an operation NAME and nothing else (no tenant, principal,
      # role or capability), an unknown name never leaves the browser, and -- the property this
      # whole lane exists for -- a refused, unreachable or malformed read grants NOTHING and never
      # degrades to users/{uid}.role. The pure projection half runs in the node manifest as
      # test/navigationExperienceProjection.test.mjs.
      - name: EOS navigation source -- transport and experience hook (vitest + jsdom)
        run: npx vitest run test/operationsExperienceTransport.test.jsx
        working-directory: field-ops-app-vite
