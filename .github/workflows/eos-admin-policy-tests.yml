name: EOS Admin Policy & Workflow Tests

# THE ADMINISTRATION POLICY FOUNDATION -- Objects, Roles & Permissions, Users, Workflows.
#
# The target architecture is: the authentication provider supplies IDENTITY; EOS decides
# AUTHORIZATION; and everything a customer configures lives in the EOS database behind the DAL.
# This lane proves the engine half of that -- the part that must be right before any storage
# decision is made.
#
# THREE THINGS IT PROVES, all offline. No emulator, no Firebase runtime, no database, no secrets:
#
#   1. AUTHORIZATION. Object CRED, field inheritance, explicit overrides, and the DOORWAY INVARIANT
#      -- that a field grant can never open an object the Role cannot read. Plus multi-role union
#      being additive, malformed policy failing closed, and cross-tenant isolation.
#
#   2. WORKFLOW. That workflow authority and data authority are independent in BOTH directions, that
#      a published version is immutable, that an in-flight instance stays pinned to the version it
#      began under, and that the current state comes from the store rather than from the request.
#      Plus the three seeded lifecycles being faithful to the code that runs today.
#
#   3. NO FIREBASE. A static guard over every module in src/adminPolicy: no Firestore import, no
#      Firestore-shaped write, no reference to the collections this subsystem replaces, and no way
#      to reach storage except the injected repository port. The Postgres adapter and the pool
#      factory are the only two files permitted to know what a database is, and the guard names
#      them individually.
#
#   4. REAL POSTGRESQL. The migration is EXECUTED against an ephemeral postgres:16 service
#      container -- clean database, migrate, assert the schema; migrate again, assert nothing moved;
#      down and up again. Constraints, transactional rollback, tenant isolation and the seed are
#      proved there rather than approximated.
#
#   5. ACTIVATION. That a tenant can be CREATED and seeded idempotently, that an administrator can
#      be bootstrapped exactly once, that one tenant can neither read nor mutate another's policy,
#      that a spoofed tenant id is refused rather than narrowed, that every Admin mutation writes an
#      audit event and a rolled-back one writes none, and -- the proof this turns on -- that state
#      SURVIVES A RESTART. If the in-memory adapter were still the operational source, every other
#      test here would pass and nothing would persist.
#
#   6. THE API'S SHAPE. That the operation list is CLOSED: no runSQL, no generic patch, no route
#      that takes a table name. And that the tenant is never taken from the request.
#
# INERT ALL THE SAME. Nothing here is wired into a running surface, no capability is granted, no
# callable is exported, no Firestore collection is created, no Rules change, and no environment has
# a policy database. The migration runs only against the throwaway container in this job. The EOS
# API process is built and proved, and nothing deploys it.
#
# Linux runner, matching every other lane in this repository.

