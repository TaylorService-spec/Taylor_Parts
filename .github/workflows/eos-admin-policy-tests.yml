name: EOS Admin Policy & Workflow Tests

# THE ADMINISTRATION POLICY FOUNDATION -- Objects, Roles & Permissions, Users, Workflows.
#
# The target architecture is: the authentication provider supplies IDENTITY; EOS decides
# AUTHORIZATION; and everything a customer configures lives in the EOS database behind the DAL.
# This lane proves the engine half of that -- the part that must be right before any storage
# decision is made.
#
# THREE THINGS IT PROVES, all offline. No emulator, no Firebase runtime, no database, no secrets:
#
#   1. AUTHORIZATION. Object CRED, field inheritance, explicit overrides, and the DOORWAY INVARIANT
#      -- that a field grant can never open an object the Role cannot read. Plus multi-role union
#      being additive, malformed policy failing closed, and cross-tenant isolation.
#
#   2. WORKFLOW. That workflow authority and data authority are independent in BOTH directions, that
#      a published version is immutable, that an in-flight instance stays pinned to the version it
#      began under, and that the current state comes from the store rather than from the request.
#      Plus the three seeded lifecycles being faithful to the code that runs today.
#
#   3. NO FIREBASE. A static guard over every module in src/adminPolicy: no Firestore import, no
#      Firestore-shaped write, no reference to the collections this subsystem replaces, and no way
#      to reach storage except the injected repository port. The Postgres adapter and the pool
#      factory are the only two files permitted to know what a database is, and the guard names
#      them individually.
#
#   4. REAL POSTGRESQL. The migration is EXECUTED against an ephemeral postgres:16 service
#      container -- clean database, migrate, assert the schema; migrate again, assert nothing moved;
#      down and up again. Constraints, transactional rollback, tenant isolation and the seed are
#      proved there rather than approximated.
#
# INERT ALL THE SAME. Nothing here is wired into a running surface, no capability is granted, no
# callable is exported, no Firestore collection is created, no Rules change, and no environment has
# a policy database. The migration runs only against the throwaway container in this job.
#
# Linux runner, matching every other lane in this repository.

on:
  pull_request:
    paths:
      - "functions/src/adminPolicy/**"
      - "functions/test/adminPolicyAuthorization.test.mjs"
      - "functions/test/adminPolicyWorkflow.test.mjs"
      - "functions/test/adminPolicyNoFirebase.test.mjs"
      - "functions/test/adminPolicyPostgres.test.mjs"
      - "functions/test/adminPolicySeed.test.mjs"
      - "functions/test/adminPolicySeedCoverage.test.mjs"
      - "functions/migrations/**"
      - "scripts/buildAdminPolicySeedSnapshot.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "docs/architecture/eos-admin-policy-workflow-reconciliation.md"
      - "field-ops-app-vite/src/domain/adminPolicyView.js"
      - "field-ops-app-vite/src/metadata/entityRegistry.js"
      - "field-ops-app-vite/src/modules/administration/RolePolicyGrid.jsx"
      - "field-ops-app-vite/src/modules/administration/AdminRolesPermissions.jsx"
      - "field-ops-app-vite/src/modules/administration/AdminObjects.jsx"
      - "field-ops-app-vite/src/domain/adminWorkflowView.js"
      - "field-ops-app-vite/src/modules/administration/AdminWorkflows.jsx"
      - "field-ops-app-vite/src/access/policyObjectRegistry.js"
      - "field-ops-app-vite/test/adminPolicyView.test.mjs"
      - "field-ops-app-vite/test/adminWorkflowView.test.mjs"
      - "field-ops-app-vite/test/policyObjectRegistry.test.mjs"
      - "field-ops-app-vite/test/administrationPortalNav.test.mjs"
      - "field-ops-app-vite/test/entityRegistry.test.mjs"
      - "field-ops-app-vite/test/adminRolesPermissions.test.jsx"
      - ".github/workflows/eos-admin-policy-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/adminPolicy/**"
      - "functions/test/adminPolicyAuthorization.test.mjs"
      - "functions/test/adminPolicyWorkflow.test.mjs"
      - "functions/test/adminPolicyNoFirebase.test.mjs"
      - "functions/test/adminPolicyPostgres.test.mjs"
      - "functions/test/adminPolicySeed.test.mjs"
      - "functions/migrations/**"
      - "field-ops-app-vite/src/domain/adminPolicyView.js"
      - "field-ops-app-vite/src/metadata/entityRegistry.js"
      - "field-ops-app-vite/src/modules/administration/**"
      - ".github/workflows/eos-admin-policy-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: Admin policy engine -- authorization, workflow, tenancy, schema, seed
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A REAL POSTGRESQL, not an emulator. The migration, the unique indexes, the foreign keys, the
    # CHECK constraints and transactional rollback are properties of the database itself; something
    # that approximates them proves nothing about the one that will actually hold the policy.
    #
    # Ephemeral, empty, and local to the job -- it holds no data anybody owns.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: eos
          POSTGRES_DB: eos_policy
        ports:
          - 5432:5432
        # Without the health check the job races the container's startup and fails intermittently,
        # which is worse than failing consistently.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --no-audit --no-fund
        working-directory: functions

      # Build first: the proofs import the compiled lib/, so a type error must fail the lane rather
      # than leave the tests running against a stale build that still passes.
      - name: Typecheck and build
        run: npm run build
        working-directory: functions

      # Offline first: if the pure engine is broken, a database failure underneath it is noise.
      - name: Admin policy proofs -- offline (build + run)
        run: npm run test:adminPolicy
        working-directory: functions
        env:
          # Deliberately UNSET here, so this step also proves the suites skip cleanly without a
          # database rather than silently depending on one.
          POLICY_TEST_DATABASE_URL: ""

      - name: Migration, schema, constraints and seed -- real PostgreSQL
        run: npm run test:adminPolicyPostgres
        working-directory: functions
        env:
          POLICY_TEST_DATABASE_URL: postgres://eos:eos@localhost:5432/eos_policy

      # The snapshot is GENERATED from the client metadata registry. A definition change that was
      # not re-snapshotted would seed a stale model, and this is what says so.
      - name: Seed snapshot is not stale
        run: node scripts/buildAdminPolicySeedSnapshot.mjs --check

  surfaces:
    name: Admin policy surfaces -- view model, entity registry, rendered grid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json

      - name: Install client dependencies
        run: npm ci --no-audit --no-fund
        working-directory: field-ops-app-vite

      # The view model draws what the server decided and must never become a second implementation
      # of the resolution rules -- one of these assertions is exactly that boundary.
      - name: Pure view model and entity registry (node:test)
        run: node --test test/adminPolicyView.test.mjs test/entityRegistry.test.mjs test/adminWorkflowView.test.mjs test/administrationPortalNav.test.mjs test/policyObjectRegistry.test.mjs
        working-directory: field-ops-app-vite

      - name: Rendered Roles & Permissions grid (vitest + jsdom)
        run: npx vitest run test/adminRolesPermissions.test.jsx
        working-directory: field-ops-app-vite
