name: EOS Admin Policy & Workflow Tests

# THE ADMINISTRATION POLICY FOUNDATION -- Objects, Roles & Permissions, Users, Workflows.
#
# The target architecture is: the authentication provider supplies IDENTITY; EOS decides
# AUTHORIZATION; and everything a customer configures lives in the EOS database behind the DAL.
# This lane proves the engine half of that -- the part that must be right before any storage
# decision is made.
#
# THREE THINGS IT PROVES, all offline. No emulator, no Firebase runtime, no database, no secrets:
#
#   1. AUTHORIZATION. Object CRED, field inheritance, explicit overrides, and the DOORWAY INVARIANT
#      -- that a field grant can never open an object the Role cannot read. Plus multi-role union
#      being additive, malformed policy failing closed, and cross-tenant isolation.
#
#   2. WORKFLOW. That workflow authority and data authority are independent in BOTH directions, that
#      a published version is immutable, that an in-flight instance stays pinned to the version it
#      began under, and that the current state comes from the store rather than from the request.
#      Plus the three seeded lifecycles being faithful to the code that runs today.
#
#   3. NO FIREBASE. A static guard over every module in src/adminPolicy: no Firestore import, no
#      Firestore-shaped write, no reference to the collections this subsystem replaces, and no way
#      to reach storage except the injected repository port. The Postgres adapter and the pool
#      factory are the only two files permitted to know what a database is, and the guard names
#      them individually.
#
#   4. REAL POSTGRESQL. The migration is EXECUTED against an ephemeral postgres:16 service
#      container -- clean database, migrate, assert the schema; migrate again, assert nothing moved;
#      down and up again. Constraints, transactional rollback, tenant isolation and the seed are
#      proved there rather than approximated.
#
#   5. ACTIVATION. That a tenant can be CREATED and seeded idempotently, that an administrator can
#      be bootstrapped exactly once, that one tenant can neither read nor mutate another's policy,
#      that a spoofed tenant id is refused rather than narrowed, that every Admin mutation writes an
#      audit event and a rolled-back one writes none, and -- the proof this turns on -- that state
#      SURVIVES A RESTART. If the in-memory adapter were still the operational source, every other
#      test here would pass and nothing would persist.
#
#   6. THE API'S SHAPE. That the operation list is CLOSED: no runSQL, no generic patch, no route
#      that takes a table name. And that the tenant is never taken from the request.
#
# INERT ALL THE SAME. Nothing here is wired into a running surface, no capability is granted, no
# callable is exported, no Firestore collection is created, no Rules change, and no environment has
# a policy database. The migration runs only against the throwaway container in this job. The EOS
# API process is built and proved, and nothing deploys it.
#
# Linux runner, matching every other lane in this repository.

# ============================ WHY THERE IS NO `paths:` FILTER (Owner ruling M3, 2026-10-12) ============================
#
# The `policy` job's check is a REQUIRED status check on main. A required check whose workflow never
# starts never reports, so a `paths:` trigger filter would leave every unrelated pull request waiting on
# it forever. The workflow therefore starts on EVERY pull request (and every push to main), and the cheap
# `changes` job decides relevance from ONE committed list -- .github/ci/eos-admin-policy-paths.txt, which
# is the union of the two `paths:` filters this workflow used to carry. When nothing relevant changed,
# `policy` and `surfaces` are skipped by a JOB-LEVEL `if:`; GitHub reports that as a skipped check run
# under the unchanged job name, which satisfies a required check. Register new subjects in that file.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Cheap and always-on: no install, no service container. Answers relevant=true|false for the two jobs
  # below. Fail-closed throughout -- an unresolvable base sha fails this job, and the jobs below run
  # unless this job positively answered 'false' -- so a broken `changes` can never skip the required
  # check green.
  changes:
    name: Admin policy relevance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      # Full history: the three-dot diff needs the merge base of the PR base and head (pull_request) or
      # the pre-push commit (push to main) to be present locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The list and its reader prove themselves before they decide anything.
      - name: Relevance list and matcher contract tests
        run: node --test scripts/adminPolicyCiRelevance.test.mjs

      # Same fail-closed sha resolution as governance-guard-enforcement.yml. An empty base means "no
      # previous commit is expected" (workflow_dispatch, branch-creation push) and the lane runs.
      - name: Decide relevance
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          ZERO_SHA="0000000000000000000000000000000000000000"
          BASE=""
          HEAD="HEAD"
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ "$PUSH_BEFORE" != "$ZERO_SHA" ]; then
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          fi
          for SHA in "$BASE" "$HEAD"; do
            if [ -n "$SHA" ] && ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              echo "::error::Admin policy relevance: sha '$SHA' could not be resolved. Failing closed." >&2
              exit 1
            fi
          done
          node scripts/adminPolicyCiRelevance.mjs --base "$BASE" --head "$HEAD" | tee -a "$GITHUB_OUTPUT"

  # ============================ THE ENGINE LANE, SPLIT (CI performance Phase 1, lane CIP) ============================
  #
  # The `policy` job used to run everything in ONE job, serially: build, offline proofs, then ~190 PostgreSQL suites one after the
  # other against one database (17-26 minutes, median about 26, most of it the PostgreSQL step). It is now THREE kinds of job:
  #
  #   policy-offline    build + the offline proofs + the seed-snapshot check. No database.
  #   policy-postgres   a matrix of 5 partitions, each with its OWN postgres service container, each running the files that the
  #                     committed map (.github/ci/eos-admin-policy-postgres-partitions.json) assigns it, serialized within the
  #                     partition exactly as before (several suites reset the schema of the database they own).
  #   policy            the GATE. It keeps the job id AND the check name the branch-protection rule requires, so no setting
  #                     changes: the required check "Admin policy engine -- ..." is now the aggregate verdict. It fails unless
  #                     every upstream job succeeded AND the manifests each partition wrote prove that every registered suite ran
  #                     exactly once, none ran empty, none failed, and the only skips are the ones the map names.
  #
  # Nothing is weakened: the same suites, the same assertions, the same migration up/down and zero-trace proofs, in the same order
  # within a partition. What changed is only how many databases run them at once. docs/engineering/ci-performance.md has the
  # measurements; functions/scripts/adminPolicyPartitions.mjs is the guard.

  # KNOWN WINDOW (M3 review, finding 3 -- documented, not engineered away): `!cancelled()` is false for
  # every job once a run is cancelled, so a MANUAL cancel issued while `changes` is still running leaves
  # `policy` without a real verdict for that sha (skipped/cancelled rather than run). Treat a cancelled
  # run as no evidence: re-run the workflow before merging; never merge on the strength of it.
  policy-offline:
    name: Admin policy offline proofs and seed snapshot
    needs: changes
    # The same JOB-LEVEL, fail-closed gate as `policy` and `surfaces` (see the header): an irrelevant change skips it.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --no-audit --no-fund
        working-directory: functions

      # Build first: the proofs import the compiled lib/, so a type error must fail the lane rather
      # than leave the tests running against a stale build that still passes.
      - name: Typecheck and build
        run: npm run build
        working-directory: functions

      # Offline first: if the pure engine is broken, a database failure underneath it is noise.
      - name: Admin policy proofs -- offline (build + run)
        run: npm run test:adminPolicy
        working-directory: functions
        env:
          # Deliberately UNSET here, so this step also proves the suites skip cleanly without a
          # database rather than silently depending on one.
          POLICY_TEST_DATABASE_URL: ""
          # The run also writes what it executed, per file; the runner checks it (nothing missing, empty, failed or unexpectedly
          # skipped) and the gate job re-checks it together with every partition.
          ADMIN_POLICY_MANIFEST_OUT: manifest-offline.json

      # The snapshot is GENERATED from the client metadata registry. A definition change that was
      # not re-snapshotted would seed a stale model, and this is what says so.
      - name: Seed snapshot is not stale
        run: node scripts/buildAdminPolicySeedSnapshot.mjs --check

      - name: Keep the offline manifest for the gate
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manifest-offline
          path: functions/manifest-offline.json
          if-no-files-found: warn
          retention-days: 7

  policy-postgres:
    name: Admin policy PostgreSQL partition ${{ matrix.partition }} of 5
    needs: changes
    # The same JOB-LEVEL, fail-closed gate as `policy` and `surfaces` (see the header): an irrelevant change skips it.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    # Measured, not padded: each partition runs about 5-6 minutes. A cap is a hang detector; 20 still catches one with room for a
    # re-balance that has not happened yet (the whole serialized gate was 25 minutes).
    timeout-minutes: 20
    strategy:
      # One failing partition must not hide the verdicts of the others: the gate reports every partition's result.
      fail-fast: false
      matrix:
        # Must equal "partitions" in .github/ci/eos-admin-policy-postgres-partitions.json (functions/test/adminPolicyPartitions.test.mjs
        # fails otherwise), and the "of 5" in the job name.
        partition: [1, 2, 3, 4, 5]

    # A REAL POSTGRESQL, not an emulator. The migration, the unique indexes, the foreign keys, the
    # CHECK constraints and transactional rollback are properties of the database itself; something
    # that approximates them proves nothing about the one that will actually hold the policy.
    #
    # Ephemeral, empty, and local to the job -- it holds no data anybody owns. EACH PARTITION HAS ITS OWN: no database state is
    # shared between partitions, so the isolation and zero-trace assertions of every suite run exactly as they did serially.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eos
          POSTGRES_PASSWORD: eos
          POSTGRES_DB: eos_policy
        ports:
          - 5432:5432
        # Without the health check the job races the container's startup and fails intermittently,
        # which is worse than failing consistently.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci --no-audit --no-fund
        working-directory: functions

      # The ACTIVATION proofs run inside this command, not beside it: test:adminPolicyPostgres is the registered authority for
      # "everything that needs a real database". `--partition N` runs the files the map assigns to this partition (the runner
      # refuses to start if the map does not cover the registry exactly once), after the one-lane-one-database isolation
      # pretest and a fresh build, serialized within the partition.
      - name: Migration, schema, tenancy, bootstrap and activation -- real PostgreSQL (partition ${{ matrix.partition }})
        run: npm run test:adminPolicyPostgres -- --partition ${{ matrix.partition }}
        working-directory: functions
        env:
          POLICY_TEST_DATABASE_URL: postgres://eos:eos@localhost:5432/eos_policy
          ADMIN_POLICY_MANIFEST_OUT: manifest-postgres-${{ matrix.partition }}.json

      - name: Keep this partition's manifest for the gate
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manifest-postgres-${{ matrix.partition }}
          path: functions/manifest-postgres-${{ matrix.partition }}.json
          if-no-files-found: warn
          retention-days: 7

  # THE GATE. Job id and check name are UNCHANGED, because the required status check on main is this name; branch protection is
  # not touched. A required check treats a SKIPPED job as passing, so the job-level `if` below is the same one the old single
  # `policy` job carried: skipped exactly when `changes` positively answered 'false', run (and able to fail) otherwise.
  policy:
    name: Admin policy engine -- authorization, workflow, tenancy, schema, seed
    needs: [changes, policy-offline, policy-postgres]
    # JOB-LEVEL, so an irrelevant change yields a SKIPPED check run under this exact name (a required
    # check treats skipped as passing). `!= 'false'` rather than `== 'true'`: if `changes` failed or
    # produced nothing, this runs -- it never skips itself green. !cancelled() lets it run past a failed
    # `changes` while still honouring a superseded-run cancellation.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every upstream job must have SUCCEEDED. 'skipped' is a failure here: when this job runs at all, the lane was relevant, so a
      # skipped partition is a missing partition, and a missing partition must never read as green.
      - name: Every offline and PostgreSQL job succeeded
        shell: bash
        env:
          OFFLINE: ${{ needs.policy-offline.result }}
          POSTGRES: ${{ needs.policy-postgres.result }}
        run: |
          set -eu
          bad=0
          for pair in "policy-offline=$OFFLINE" "policy-postgres (all 5 partitions)=$POSTGRES"; do
            if [ "${pair##*=}" != "success" ]; then
              echo "::error::${pair%%=*} finished '${pair##*=}', not 'success'. The required check fails."
              bad=1
            fi
          done
          exit "$bad"

      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect the manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests
          merge-multiple: true

      # The manifests are what each run EXECUTED, per file. This proves the split lost nothing: every registered suite ran in
      # exactly one place, none ran zero tests, none failed or was cancelled, and every skip is one the partition map names.
      # Plain node, no install: the guard imports only node built-ins.
      - name: Every registered suite ran exactly once -- none missing, duplicated, empty or unexpectedly skipped
        shell: bash
        run: |
          set -eu
          node functions/scripts/adminPolicyPartitions.mjs check-map
          node functions/scripts/adminPolicyPartitions.mjs aggregate manifests | tee -a "$GITHUB_STEP_SUMMARY"

  surfaces:
    name: Admin policy surfaces -- view model, entity registry, rendered grid
    needs: changes
    # JOB-LEVEL, so an irrelevant change yields a SKIPPED check run under this exact name (a required
    # check treats skipped as passing). `!= 'false'` rather than `== 'true'`: if `changes` failed or
    # produced nothing, this runs -- it never skips itself green. !cancelled() lets it run past a failed
    # `changes` while still honouring a superseded-run cancellation.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json

      - name: Install client dependencies
        run: npm ci --no-audit --no-fund
        working-directory: field-ops-app-vite

      # The view model draws what the server decided and must never become a second implementation
      # of the resolution rules -- one of these assertions is exactly that boundary.
      - name: Pure view model and entity registry (node:test)
        run: node --test test/adminPolicyView.test.mjs test/entityRegistry.test.mjs test/adminWorkflowView.test.mjs test/administrationPortalNav.test.mjs test/policyObjectRegistry.test.mjs test/reorderAuthoritySeparation.test.mjs test/adminPolicyApiClient.test.mjs
        working-directory: field-ops-app-vite

      - name: Rendered Roles & Permissions grid (vitest + jsdom)
        run: npx vitest run test/adminRolesPermissions.test.jsx
        working-directory: field-ops-app-vite

      # OD-T7 (Truck Inventory activation, 2026-10-01): the Administration truck registry section sends every change with its
      # reason to /admin/policy and renders a refusal as the server's answer.
      - name: Truck registry Administration section (vitest + jsdom)
        run: npx vitest run test/truckRegistryAdministration.test.jsx
        working-directory: field-ops-app-vite

      # DECISIONS #203 (2026-10-02): the Administration finance configuration section -- accounting destinations, payment terms,
      # business time zones -- sends every change with its reason to /admin/policy and renders a refusal as the server's answer.
      - name: Finance configuration Administration section (vitest + jsdom)
        run: npx vitest run test/financeConfigurationAdministration.test.jsx
        working-directory: field-ops-app-vite

      # Owner rulings #204 (2026-10-03): System Configuration (company time zone, language) and Sales Configuration (Employee
      # Sales Authority) -- every change with its reason to /admin/policy; a refusal rendered as the server's answer.
      - name: System and Sales Configuration Administration sections (vitest + jsdom)
        run: npx vitest run test/systemSalesConfigurationAdministration.test.jsx
        working-directory: field-ops-app-vite

      # Finance Closure (#206): the Finance workspace -- the server's figures and refusals; Consolidated records nothing.
      # + Settlement Corrections (2026-10-14): reverse / void through the governed commands, offered only where `correct` is held.
      - name: Finance workspace + settlement corrections (vitest + jsdom)
        run: npx vitest run test/financeWorkspace.test.jsx test/settlementCorrections.test.jsx
        working-directory: field-ops-app-vite

      # Financial Policy Administration UI (#232 Phase 2): companies and actions are the server's answer; each command's input;
      # refusals verbatim; Finance Configuration intact; Financials summary; a prohibited direct grant is never effective.
      - name: Financial Policy Administration (vitest + jsdom)
        run: npx vitest run test/financialPolicyAdministration.test.jsx
        working-directory: field-ops-app-vite

      # Rental (#207): the Rental workspace -- the server's fleet, agreements and refusals; tax is never assumed.
      - name: Rental workspace (vitest + jsdom)
        run: npx vitest run test/rentalWorkspace.test.jsx
        working-directory: field-ops-app-vite

      # Analysis & Reporting (#208): the Analysis workspace -- the server's figures, basis, refusals, exceptions and actions.
      - name: Analysis workspace (vitest + jsdom)
        run: npx vitest run test/analysisWorkspace.test.jsx
        working-directory: field-ops-app-vite

      # Application Assembly (#209): the persona workspace and site-wide search -- the server's sections, refusals, people and
      # results; OWNER / ACCOUNTABLE / ASSIGNEE stay three answers; search exists only under EOS authority.
      - name: Persona workspace and site search (vitest + jsdom)
        run: npx vitest run test/myWorkspace.test.jsx
        working-directory: field-ops-app-vite

      # Administration control plane (#210): the workforce roster, the Object authority matrix (a checkbox is the server's
      # grant; the grid re-reads), the View As preview (marked PREVIEW, one read per open) and workflow work.
      - name: Administration control plane (vitest + jsdom)
        run: npx vitest run test/adminControlPlaneWorkforce.test.jsx
        working-directory: field-ops-app-vite

      # THE BROWSER'S ROUTE TO THE OBJECT-OWNED SECURITY READ MODEL. Proved through an injected
      # transport -- no network, no database. The authority itself is proved against real
      # PostgreSQL in the objectSecurityAuthorityPostgres job; what these two suites prove is that
      # the client names the server's operations, sends the input key its dispatcher requires,
      # returns the projection untouched, and reports a refusal AS a refusal rather than as an
      # empty security grid -- which on this screen would read as "nobody holds anything".
      - name: Object security read client and hooks (vitest + jsdom)
        run: npx vitest run test/adminPolicySecurityReads.test.jsx test/useObjectSecurity.test.jsx
        working-directory: field-ops-app-vite

      # THE READ MODEL THE LATER SCREEN IS ASSEMBLED FROM. The server's Role and Principal
      # projections send action KEYS and no labels; joining the Object/action inventory onto them
      # is the one place that is allowed to happen, and these assertions pin what it may not do --
      # invent a label, drop a grant the catalog cannot explain, re-sort the authority's answer, or
      # turn a refused read into an empty security grid. The last describe is the guard that this
      # tranche switched no source of truth: no Administration screen imports any of it.
      - name: Canonical security read model and friendly labels (vitest + jsdom)
        run: npx vitest run test/adminSecurityReadModel.test.jsx
        working-directory: field-ops-app-vite

      # THE CONTROL PLANE, CLIENT SIDE (lane CP-C). Each Object's real action vocabulary with grant
      # source / condition / DIRECT EXCEPTION, grant / revoke / condition mutations sent with a reason,
      # the 409 retire refusal shown verbatim, and Effective Access rendered from the server evaluator
      # (UNAVAILABLE until explainEffectiveAccess is served).
      - name: Administration control plane -- client (vitest + jsdom)
        run: npx vitest run test/adminControlPlane.test.jsx
        working-directory: field-ops-app-vite

      # LANE DX: Employee > Direct Exceptions -- each direct exception labelled DIRECT EXCEPTION with its source,
      # reason, actor, creation, expiry, condition and evaluator result; grant / revoke / condition sent with a
      # reason, re-read on success, refusals verbatim.
      - name: Administration direct exceptions -- client (vitest + jsdom)
        run: npx vitest run test/employeeDirectExceptions.test.jsx
        working-directory: field-ops-app-vite

      # PR 4: THE GRANT-IMPACT PREVIEW STEP -- Confirm disabled until a fresh WOULD_APPLY preview of exactly the inputs on
      # screen; NO_OP / WOULD_REFUSE never commit; the commit carries previewDigest; STALE_PREVIEW requires a new preview;
      # counts-only names nobody; the matrix single-click toggle no longer commits on one click.
      - name: Administration grant-impact preview step -- client (vitest + jsdom)
        run: npx vitest run test/authorityImpactPreview.test.jsx
        working-directory: field-ops-app-vite

      # LANE SC: Employee > Security Roles assignment SCOPE -- the picker offers only what the server's
      # listSupportedAssignmentScopes says the runtime decides, sends scope only when chosen, degrades to global-only
      # without the vocabulary; Effective Access renders each scope-qualified source.
      - name: Security Role assignment scope -- client (vitest + jsdom)
        run: npx vitest run test/employeeSecurityRolesScope.test.jsx
        working-directory: field-ops-app-vite

      # EOS IDENTITY BOUNDARY (Controller ruling 2026-09-29): the client treats a valid EOS session as signed in and sends
      # its token, falls back to Firebase otherwise, and ignores an EOS session in a production-role build.
      - name: EOS session identity source -- client (vitest + jsdom)
        run: npx vitest run test/eosSessionAuthContext.test.jsx
        working-directory: field-ops-app-vite

      # FIREBASE EXIT B2: in an EOS-only sign-in build AuthContext never subscribes to, signs in to, signs out of or asks Firebase
      # for a token. The seam is mocked true; every Firebase entry point is a spy that must not be reached.
      - name: EOS-only sign-in AuthContext -- client (vitest + jsdom)
        run: npx vitest run --maxWorkers=2 test/b2AuthContextEosOnly.test.jsx test/b2LazyScreensWithoutFirebase.test.jsx
        working-directory: field-ops-app-vite

      # LANE GA: governed scope pickers -- Operational Scope targets and Sales Channel values come ONLY from the server;
      # no typed scope id; a type with no governed value is shown unavailable with the server's reason.
      - name: Governed scope pickers -- client (vitest + jsdom)
        run: npx vitest run test/governedScopePickers.test.jsx
        working-directory: field-ops-app-vite

      # LANE WF: Administration > Workflows reads every definition from the server (no client copy),
      # sends lifecycle / draft mutations with a reason, shows validation codes and refusals verbatim,
      # and the Employee page draws the server-derived workflow responsibilities.
      - name: Administration workflows -- client (vitest + jsdom)
        run: npx vitest run test/adminWorkflows.test.jsx test/workflowAssignments.test.jsx
        working-directory: field-ops-app-vite

      # UI CORRECTIONS PACKAGE (2026-10-08): the shared display labels, tri-state column sort, tabs and typeahead, and the
      # Users roster (default Last/First/id order on the server, column sort, pages, suggestions, stale responses dropped).
      - name: UI corrections shared patterns -- client (vitest + jsdom)
        run: npx vitest run test/uiCorrectionsShared.test.jsx test/governedOwnerNames.test.jsx
        working-directory: field-ops-app-vite

      # LANE WR: Employee > Workflow responsibilities names each entry's admin location (Security Role / Functional Role
      # assignment, workflow binding, Role grant) as links to the governing screen; Workflows honours the deep link.
      - name: Workflow responsibility provenance -- client (vitest + jsdom)
        run: npx vitest run test/employeeWorkflowResponsibilityLinks.test.jsx
        working-directory: field-ops-app-vite

      # LANE FR -- Functional Roles: the catalog screen, the Employee section, FUNCTIONAL_ROLE workflow bindings,
      # and Effective Access drawing Functional Roles as Employee FACTS (never a permission source).
      - name: Administration Functional Roles -- client (vitest + jsdom)
        run: npx vitest run test/adminFunctionalRoles.test.jsx
        working-directory: field-ops-app-vite

      # WAVE 6 / LANE V -- THE BROWSER'S ROUTE TO THE EOS PRINCIPAL EXPERIENCE CONTEXT, and the hook
      # that owns its lifecycle. It runs under vitest rather than the node manifest because
      # services/operationsApiClient.js reaches firebase/firebase.js for the ID token, which
      # initializes Firebase at import time.
      #
      # What it pins: the client states an operation NAME and nothing else (no tenant, principal,
      # role or capability), an unknown name never leaves the browser, and -- the property this
      # whole lane exists for -- a refused, unreachable or malformed read grants NOTHING and never
      # degrades to users/{uid}.role. The pure projection half runs in the node manifest as
      # test/navigationExperienceProjection.test.mjs.
      - name: EOS navigation source -- transport and experience hook (vitest + jsdom)
        run: npx vitest run test/operationsExperienceTransport.test.jsx
        working-directory: field-ops-app-vite
