name: Effective Access Feed Tests

# Enterprise Access & Administration Platform (Issue #226) test for
# functions/src/access/effectiveAccessFeed.ts -- the trusted, read-only
# feed a client uses to resolve governed capability decisions without
# interpreting users/{uid}.role as a governed role. Runs against a
# freshly started Firestore-only emulator (no Auth needed: this module
# is exercised via the Admin SDK directly, taking principalUid as a
# plain parameter, matching how the callable wrapper supplies
# request.auth.uid). Emulator-only, project "taylor-parts", loopback
# host -- no production access, no credentials, no repository secrets.

on:
  pull_request:
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/**"
      - "functions/test/effectiveAccessFeed.test.mjs"
      - "functions/test/operationalRoleContext.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/effective-access-feed-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/**"
      - "functions/test/effectiveAccessFeed.test.mjs"
      - "functions/test/operationalRoleContext.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/effective-access-feed-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  effective-access-feed-tests:
    name: Effective access feed tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a Java process.
      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/firestore-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/firestore-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Firestore emulator did not become ready in time"
          cat /tmp/firestore-emulator.log
          exit 1
        working-directory: functions

      - name: Effective access feed tests (build + run)
        run: npm run test:effectiveAccess
        working-directory: functions

      # Wave 7 extension PART 4 -- functions/src/access/operationalRoleContext.ts,
      # the shared operationalRoleActive Condition resolver this workflow's own
      # effectiveAccessFeed.ts now wires in. Runs against the SAME emulator
      # instance (already started above); npm run build is a no-op re-run here
      # (tsc is incremental-safe, matches this repo's other multi-step jobs).
      - name: Operational-role condition resolver tests (build + run)
        run: npm run test:operationalRoleContext
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-access-feed-emulator-logs
          path: |
            /tmp/firestore-emulator.log
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7
