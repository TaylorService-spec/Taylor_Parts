name: Inventory Cycle Count Command Tests

# Enterprise Inventory -- Cycle Count operating authority (functions/src/cycleCount/**).
# Firestore-emulator tests only: NO production, NO deployment. Every inventory.cycleCount.* capability
# is still registered `active: false` in permissionCatalog -- that fail-closed posture is unchanged.
# What HAS changed since this note was written (Owner ruling CERT-CYCLE-11): the governed
# Counter/Reconciler Roles carry these capabilities, and eos-platform-certification activates
# create/submit/reconcile (never cancel) through the per-environment override seam. So a real
# principal CAN now be authorized there, which is precisely why the bounded operator that drives it
# is exercised here. Reuses the SAME
# location-aware operational ledger (inventoryLedger) and Serialized Asset registry Transfer's own
# workflow depends on, so this workflow's path filter mirrors inventory-transfer-command-tests.yml's.

on:
  pull_request:
    paths:
      - "functions/src/cycleCount/**"
      - "functions/src/inventoryLedger/**"
      - "functions/src/serializedAsset/**"
      - "functions/src/inventoryTransfer/transferLocationResolver.ts"
      - "functions/src/truckRegistry/**"
      - "functions/src/warehouseGovernance/**"
      - "functions/scripts/certificationWorld/applyCycleVariance.mjs"
      - "functions/scripts/certificationWorld/executeCycleCount.mjs"
      - "functions/scripts/certificationWorld/actorAuthority.mjs"
      - "functions/scripts/certificationWorld/executionTarget.mjs"
      - "functions/test/certificationCycleVariance.test.mjs"
      - "functions/test/cycleCountCommand.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-cycle-count-command-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/cycleCount/**"
      - "functions/src/inventoryLedger/**"
      - "functions/src/serializedAsset/**"
      - "functions/src/inventoryTransfer/transferLocationResolver.ts"
      - "functions/src/truckRegistry/**"
      - "functions/src/warehouseGovernance/**"
      - "functions/scripts/certificationWorld/applyCycleVariance.mjs"
      - "functions/scripts/certificationWorld/executeCycleCount.mjs"
      - "functions/scripts/certificationWorld/actorAuthority.mjs"
      - "functions/scripts/certificationWorld/executionTarget.mjs"
      - "functions/test/certificationCycleVariance.test.mjs"
      - "functions/test/cycleCountCommand.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-cycle-count-command-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  inventory-cycle-count-command-tests:
    name: Inventory cycle count command tests (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Build (TypeScript)
        run: npm run build
        working-directory: functions

      # The bounded Certification OPERATOR, deliberately separate from the domain suite below.
      # One tests whether a cycle count is correct; this tests whether the tool that drives a LIVE
      # one is safe -- argument binding, protected-part refusal, materiality, the no-movement
      # baseline diff (CERT-CYCLE-12) and the resume path. Needs no emulator, so it runs first and
      # fails fast.
      - name: Certification cycle-count operator safety tests
        run: node --test test/certificationCycleVariance.test.mjs
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/cycle-count-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/cycle-count-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulator did not become ready in time"
          cat /tmp/cycle-count-emulator.log
          exit 1
        working-directory: functions

      - name: Cycle count command tests (create/submit/reconcile/cancel; NONE + SERIAL; WAREHOUSE + MOBILE)
        run: npm run test:cycleCountCommand
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-count-emulator-logs
          path: |
            /tmp/cycle-count-emulator.log
            functions/firestore-debug.log
          if-no-files-found: ignore
