# Secret-scanning gate (gitleaks). Fails a PR if a genuinely sensitive credential is committed.
# Firebase Web API keys in the client config are allowlisted by policy (.gitleaks.toml). Findings are
# REDACTED in logs — the scanner never prints a secret value.
name: Secret scan (gitleaks)

on:
  pull_request:
  push:
    branches: [main]

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Batch 1 proved the mechanism:
# two superseded PR runs cancelled, the newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks (pinned)
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree (redacted; policy = .gitleaks.toml)
        # --no-git scans the resulting tree (what actually merges), so historical exposures that were
        # removed from HEAD are not re-flagged. --redact guarantees no secret value reaches the logs.
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --exit-code 1 --verbose
