name: Governance Guard Enforcement

# THE NON-SKIPPABLE BACKSTOP for the protected governance surfaces.
#
# ============================ WHY THIS WORKFLOW HAS NO `paths:` FILTER ============================
#
# Every governance guard in this repository is `paths:`-filtered, and a `paths:`-filtered workflow
# can never be a REQUIRED status check: on a PR that does not touch its filter it produces no check
# run at all, so branch protection would sit pending forever. The guards are therefore advisory by
# construction, and a head commit that produced zero runs merges clean.
#
# That is exactly what happened to #1929. 7861c580 added a one-shot workflow that rewrote both
# firestore.rules copies and pushed the result back to the PR branch as github-actions[bot].
# GitHub does not create workflow runs for events generated by the default GITHUB_TOKEN, so the
# `pull_request: synchronize` event for c9399b52 never fired and NOTHING ran on that head sha --
# including legacy-authorization-surface-gate.yml, whose `paths:` filter names firestore.rules and
# was entirely correct. a2f4e457 merged it and the recorded legacy authorization corpus drifted
# 43 -> 37 call sites with no gate having observed it.
#
# So this workflow fires on EVERY pull request and EVERY push to main, with no `paths:` filter at
# all. It always produces a check run, which means it can be -- and must be -- a required status
# check; and a required check that never ran on the head sha BLOCKS the merge instead of being
# silently absent. That is the property the path-filtered guards cannot have.
#
# ============================ AND IT IS STILL CHEAP ============================
#
# The filtering did not disappear, it MOVED INSIDE THE JOB, where it is computed from the real
# base..head diff rather than from GitHub's event matcher -- a more reliable filter, not a weaker
# one. The unconditional cost is a checkout, a Node setup and two instant static fences: well
# under a minute on ubuntu-latest, no emulator, no Java, no npm install. Everything that costs
# real time is gated on the diff, and the only step that installs dependencies runs solely when
# the legacy authorization surface itself changed.
#
# ============================ WHAT RUNS HERE ============================
#
#   * the workflow self-push fence (always) -- refuses a new workflow that authors commits the
#     way the #1929 one did. See scripts/workflowSelfPushFence.mjs.
#
#   * functions/test/d2HandoffStatic.test.js -- the F-RULES-1 D2 production-deploy runbook guard
#     (docs/operations/f-rules-1-d2-deployment-handoff.md, whose Step 3 deploys firestore:rules to
#     the taylor-parts production project) and its archived evidence under
#     docs/audits/f-rules-1/d2-rules-deployment/. It was referenced by NO workflow before this
#     file, which is the second half of the same #1929 story: the handoff pins the sha256 of the
#     governed firestore.rules blob, c9399b52 changed that blob, and nothing noticed the runbook
#     had gone stale.
#
#   * functions/test/capabilityGraphDrift.test.mjs -- the generated capability graph. It IS named
#     by role-governance-tests.yml, but that workflow's filter covers only the access trees, so a
#     commit adding a capability-id reference ANYWHERE ELSE under functions/src or
#     field-ops-app-vite/src merges with the generated artifact left stale, and the next PR that
#     does touch the access filter goes red for a change it did not make. The generator records
#     which source files NAME each capability (scripts/buildCapabilityGraph.mjs scans
#     `git ls-files functions/src field-ops-app-vite/src`), so the reference set is the trigger
#     set. Deliberately duplicated with role-governance-tests.yml, in the same spirit as that
#     workflow's own duplicated environment-registry guards.
#
#   * functions/test/legacyAuthorizationSurface.test.mjs -- the corpus that drifted. Deliberately
#     duplicated with legacy-authorization-surface-gate.yml, which is left exactly as it is.
#
# Pure logic: no emulator, no deployment, no production access, no secrets.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  governance-guard-enforcement:
    name: Protected governance surfaces cannot merge ungated
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the diff below needs the PR base sha (pull_request), the pre-push commit
      # (push to main) or HEAD^ (workflow_dispatch) to be present locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # =================== THE TWO ALWAYS-ON STATIC FENCES ===================
      #
      # These are the ones that must never be diff-gated: the self-push fence is the only thing
      # standing between this repository and another commit that no workflow can observe, and a
      # diff gate on it would be gated by the very mechanism it fences.

      - name: Workflow self-push fence contract tests
        run: node --test scripts/workflowSelfPushFence.test.mjs

      - name: Workflow self-push fence
        run: node scripts/workflowSelfPushFence.mjs

      # =================== THE DIFF, COMPUTED FAIL-CLOSED ===================
      #
      # Same three-case resolution, and the same fail-closed rule, as firebase-exit-guard.yml: an
      # empty result means "no previous commit is expected" (branch-creation push, or dispatch on
      # a root commit), and those are the ONLY cases where an unresolvable sha is tolerated. Any
      # sha we DO expect to resolve must resolve, or the job fails. A diff that cannot be computed
      # must never degrade to "nothing changed" -- that would reinstate the bypass.
      - name: Determine previous accepted commit
        id: previous-commit
        shell: bash
        run: |
          set -eu
          ZERO_SHA="0000000000000000000000000000000000000000"
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.base.sha }}"
            if [ -z "$SHA" ] || ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              echo "::error::Governance guard enforcement: pull_request base sha '$SHA' could not be resolved. Failing closed." >&2
              exit 1
            fi
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          elif [ "$EVENT" = "push" ]; then
            SHA="${{ github.event.before }}"
            if [ "$SHA" = "$ZERO_SHA" ]; then
              echo "sha=" >> "$GITHUB_OUTPUT"
            elif [ -z "$SHA" ] || ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              echo "::error::Governance guard enforcement: push 'before' sha '$SHA' could not be resolved. Failing closed." >&2
              exit 1
            else
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            fi

          else
            if PARENT_SHA="$(git rev-parse --verify -q HEAD^)"; then
              echo "sha=$PARENT_SHA" >> "$GITHUB_OUTPUT"
            elif git rev-list --max-parents=0 HEAD | grep -qx "$(git rev-parse HEAD)"; then
              echo "sha=" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Governance guard enforcement: workflow_dispatch expected parent of HEAD could not be resolved. Failing closed." >&2
              exit 1
            fi
          fi

      # The three protected surfaces, each as an anchored regex over the changed-path set. When no
      # previous commit exists (branch creation / root commit) every gate opens: with nothing to
      # diff against, the only safe reading is "everything changed".
      - name: Classify the protected surfaces this change touches
        id: surfaces
        shell: bash
        run: |
          set -eu
          SHA="${{ steps.previous-commit.outputs.sha }}"
          if [ -z "$SHA" ]; then
            echo "No previous commit to diff against -- opening every gate."
            {
              echo "legacy_surface=true"
              echo "d2_handoff=true"
              echo "capability_graph=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$SHA" HEAD > /tmp/changed-paths.txt
          echo "Changed paths ($(wc -l < /tmp/changed-paths.txt)):"
          cat /tmp/changed-paths.txt

          # A change to this workflow, or to the fence it runs, opens every gate: the wiring itself
          # is under guard, and a wiring change that ran none of the guards proves nothing.
          SELF='^\.github/workflows/governance-guard-enforcement\.yml$|^scripts/workflowSelfPushFence(\.test)?\.mjs$'

          # The recorded legacy authorization corpus and the Rules it is parsed from.
          LEGACY='^firestore\.rules$|^field-ops-app-vite/firestore\.rules$|^functions/src/access/legacyAuthorizationSurface\.ts$|^field-ops-app-vite/src/access/legacyAuthorizationSurface\.ts$|^functions/test/legacyAuthorizationSurface\.test\.mjs$'

          # The D2 production-deploy runbook, the Rules blob whose sha256 it pins, and the archived
          # deployment evidence the runbook is the index for.
          D2='^firestore\.rules$|^field-ops-app-vite/firestore\.rules$|^docs/operations/f-rules-1-d2-deployment-handoff\.md$|^docs/audits/f-rules-1/d2-rules-deployment/|^functions/scripts/d2SmokeRulesVerification\.js$|^functions/test/d2HandoffStatic\.test\.js$'

          # Capability vocabulary, capability REFERENCES (the whole of both scanned source trees --
          # that is the generator's own scan root, so anything narrower is a hole), Object/action
          # metadata, the generator, and the generated artifacts themselves.
          CAPGRAPH='^functions/src/|^field-ops-app-vite/src/|^functions/scripts/governance/objectCapabilityMap\.mjs$|^config/environments\.json$|^scripts/buildCapabilityGraph\.mjs$|^scripts/capabilityGraph\.test\.mjs$|^docs/architecture/capability-graph\.(json|md)$|^functions/test/capabilityGraphDrift\.test\.mjs$'

          match() { grep -Eq "$1" /tmp/changed-paths.txt && echo true || echo false; }

          if grep -Eq "$SELF" /tmp/changed-paths.txt; then
            echo "This change edits the enforcement wiring -- opening every gate."
            {
              echo "legacy_surface=true"
              echo "d2_handoff=true"
              echo "capability_graph=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "legacy_surface=$(match "$LEGACY")"
            echo "d2_handoff=$(match "$D2")"
            echo "capability_graph=$(match "$CAPGRAPH")"
          } >> "$GITHUB_OUTPUT"

      # =================== THE GATED GUARDS, CHEAPEST FIRST ===================

      # Pure node:test, no dependencies: derives the governed sha256 with `git show HEAD:...` and
      # refuses any hand-copied hash literal in the runbook.
      - name: D2 deployment handoff static guard
        if: steps.surfaces.outputs.d2_handoff == 'true'
        run: node --test functions/test/d2HandoffStatic.test.js

      # Pure node:test, no dependencies: rebuilds the capability graph in memory from the same
      # exported functions the generator's CLI uses and compares against the committed artifacts.
      # Regenerate with `node scripts/buildCapabilityGraph.mjs` when this fails.
      - name: Capability graph drift guard
        if: steps.surfaces.outputs.capability_graph == 'true'
        run: node --test functions/test/capabilityGraphDrift.test.mjs

      # The only step here that installs anything. The corpus is compiled TypeScript, so the suite
      # needs functions/lib -- hence npm ci and a build, and hence the diff gate.
      - name: Install functions dependencies (reproducible)
        if: steps.surfaces.outputs.legacy_surface == 'true'
        run: npm ci
        working-directory: functions

      - name: Build functions (compiles the corpus to lib/)
        if: steps.surfaces.outputs.legacy_surface == 'true'
        run: npm run build
        working-directory: functions

      - name: Legacy authorization surface drift gate
        if: steps.surfaces.outputs.legacy_surface == 'true'
        run: node --test functions/test/legacyAuthorizationSurface.test.mjs
