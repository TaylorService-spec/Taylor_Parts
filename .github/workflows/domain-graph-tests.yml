name: Domain knowledge graph

# Guards the queries that turn researched knowledge into answers -- the moat calculation,
# the claim-vs-complaint wedge, the no-source-no-finding rule, and the boundary that keeps
# opportunity clustering to SEGMENTS rather than individuals.
on:
  pull_request:
    paths:
      - "docs/research/domainGraph*.mjs"
      - ".github/workflows/domain-graph-tests.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/domainGraph*.mjs"

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test docs/research/domainGraph.test.mjs
