name: Deploy Field Ops (Vite) to GitHub Pages

# ============ PRODUCTION PUBLISH -- MANUAL ONLY. Owner ruling: Option A, DECIDED. ============
#
# GOVERNANCE: docs/deployment/github-pages-promotion-governance-decision.md (Option A, decided
# 2026-09-24). That document was marked "OWNER DECISION REQUIRED" while this workflow kept
# publishing; it now records the ruling instead of asking the question.
#
# WHAT THIS WORKFLOW PUBLISHES. The PRODUCTION-identified frontend. The build step below is a
# bare `npm run build`, so no VITE_ENVIRONMENT_ID is set and config/environments.json's
# `defaultEnvironmentId` -- `taylor-parts-production` -- applies. The artifact it uploads
# self-identifies in dist/version.json as environmentId `taylor-parts-production`,
# environmentRole `production`. config/environments.json records this surface under the
# production environment with `"governed": false`.
#
# WHAT IT USED TO DO. It published on EVERY push to `main` whose diff touched `index.html`,
# `field-ops-app-vite/**` or this file. Measured on main's first-parent history at the time of
# this change: 838 of 1990 merges -- 42% -- matched those paths. A production-identified build
# of in-flight work was therefore republished roughly every other merge, with no Owner
# acceptance step anywhere in the path.
#
# MERGE TO `main` IS NOT A PRODUCTION PUBLISH. The trigger is now `workflow_dispatch` ONLY: no
# `push`, no `pull_request`, no `schedule`, no `workflow_run`, no path filter. Publishing
# production is a separate, deliberate, human act taken AFTER a merge, and it requires typing
# the confirmation phrase below. Nothing 404s in the meantime -- the URL keeps serving its last
# published build until someone republishes it.
#
# IT ALSO CLOSES THE BOT-PUSH HOLE FOR THIS WORKFLOW. GitHub creates no workflow runs for events
# generated by the default GITHUB_TOKEN (see scripts/workflowSelfPushFence.mjs and the #1929
# story). That defect cannot reach a publish here any more, because no push publishes anything.
#
# BUILD ASSURANCE IS UNCHANGED, AND IT WAS NEVER THIS WORKFLOW'S JOB.
# .github/workflows/vite-build-check.yml builds `field-ops-app-vite` on `pull_request:` (every
# PR, no path filter) and on `push: branches: [main]`, running
# npm ci -> build -> verify:build-base -> verify:version. That coverage is strictly WIDER than
# the build job below ever was -- this one was path-filtered, that one is not -- and it does not
# depend on this trigger. Removing `push:` here removes no build validation.
#
# THE GOVERNED NON-PRODUCTION PATH IS UNAFFECTED: platform-sandbox Firebase Hosting, deployed by
# scripts/deployHosting.mjs, which passes the environment id explicitly so the production default
# can never apply. Do not reach for this workflow as a substitute for it, and do not run
# deployHosting.mjs from an unmerged commit to work around this gate.
#
# ENFORCED, NOT MERELY DOCUMENTED. scripts/productionPublishTriggerFence.mjs refuses ANY workflow
# that publishes to GitHub Pages while declaring an automatic trigger -- so re-adding `push:`
# here, or introducing a second publishing workflow under a different name, fails CI. It runs as
# an always-on static fence in .github/workflows/governance-guard-enforcement.yml, on every pull
# request and every push to main.

on:
  # workflow_dispatch ONLY. Adding any other key here is a governance change, and the fence named
  # above will fail the build until it is reverted or the ruling is changed on its own PR.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH PRODUCTION to confirm this republishes the production-identified site"
        required: true
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==================== THE DELIBERATE-PUBLISH GATE, FAIL CLOSED ====================
      #
      # `workflow_dispatch` alone makes publishing manual; it does not make it deliberate. The
      # Run-workflow button is two clicks from anywhere in the Actions tab, and this workflow is
      # the only thing in the repository that writes to a production-identified surface. So the
      # dispatch carries a required input that has to be typed out in full, and it is checked
      # HERE, before the checkout -- nothing is fetched, installed, built or uploaded until the
      # phrase matches exactly.
      #
      # The input is read through `env:` rather than interpolated into the script body, so an
      # operator-supplied string is shell data and never shell source.
      #
      # NOT a `ref` input: the dispatch already chooses the ref, and a second one could disagree
      # with the commit actions/checkout resolves -- which would make provenance worse, not
      # better. What is published is the dispatched ref, echoed below so the run log says so.
      - name: Confirm deliberate production publish
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          EXPECTED='PUBLISH PRODUCTION'
          if [ "${CONFIRM:-}" != "$EXPECTED" ]; then
            echo "::error::Refusing to publish: the 'confirm' input must be exactly '${EXPECTED}'. This workflow republishes the production-identified GitHub Pages site; a merge to main does not." >&2
            exit 1
          fi
          echo "Confirmed by ${GITHUB_ACTOR}. Publishing ref ${GITHUB_REF} at ${GITHUB_SHA} to the production-identified GitHub Pages surface."

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json

      - name: Install dependencies
        working-directory: field-ops-app-vite
        run: npm ci

      - name: Build Vite app
        working-directory: field-ops-app-vite
        run: npm run build

      # GitHub Pages' "Source: GitHub Actions" mode replaces the legacy
      # branch-based deploy entirely -- whatever this workflow uploads is
      # the ENTIRE site. Stage the untouched root index.html (Parts Control
      # Center) alongside the Vite build under /field-ops/ so both keep
      # serving from the same domain instead of the legacy app disappearing.
      #
      # Sprint 2.0.1: also stage the Vite build's 404.html at the SITE
      # ROOT (not just inside field-ops/, where Vite's own copy of
      # public/404.html already lands). GitHub Pages only honors one
      # 404.html for the whole site, at the root of what's uploaded --
      # it has to be there for a deep-linked/refreshed
      # /Taylor_Parts/field-ops/<route> URL to fall through to the SPA
      # redirect script instead of a bare GitHub 404 page.
      - name: Assemble combined Pages site
        run: |
          mkdir -p site/field-ops
          cp index.html site/index.html
          cp -r field-ops-app-vite/dist/. site/field-ops/
          cp field-ops-app-vite/dist/404.html site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
