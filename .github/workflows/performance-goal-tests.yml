name: Performance Goal + Reporting Period Authority Unit Tests

# The governed TARGET authority (functions/src/performance/**) -- metric registry, goal record,
# scoped management authority, and the FIN-003 reconciliation.
#
# WHY THIS FILE EXISTS AT ALL. Every functions workflow in this repository is scoped to specific
# `functions/src/<domain>/**` paths and names its test files explicitly; nothing globs
# `functions/src/**`. A NEW subsystem therefore matches no existing filter and is CI-UNCOVERED until
# it has a lane of its own -- which is the "REGISTERED != SELECTED != GOVERNED" finding this
# repository already recorded once (release-tooling-validation.yml). This is that lane.
#
# Pure-logic only: no emulator, no deployment, no production access, no repository secrets. The suite
# runs against the compiled functions/lib output, so `npm run build` is the prerequisite the test
# command already carries.
#
# The FIN-003 and access paths are watched too, deliberately. This subsystem COMPOSES both --
# planVsActual.ts supplies the money comparison, financialApprovals.ts the self-approval invariant,
# resolveEffectivePermission/hierarchicalVisibility the reach. A change to any of them can break a
# goal guarantee without touching a file under performance/, and a filter that could not see that
# would report green on the change that broke it.

on:
  pull_request:
    paths:
      - "functions/src/performance/**"
      - "functions/test/performanceGoal.test.mjs"
      # G-05 reporting period authority. Same lane as goals rather than a new one: goal pacing and
      # every windowed metric compose it, so a change to either side can break the other, and two
      # lanes would each report green on the change that broke the pair.
      - "functions/src/reportingPeriod/**"
      - "functions/test/reportingPeriod.test.mjs"
      - "functions/test/reportingPeriodParity.test.mjs"
      # The CLIENT MIRROR is watched here deliberately. The parity suite imports it directly, so a
      # change to the mirror alone -- with no server file touched -- is exactly the edit that can
      # make the two ports disagree, and it must not be able to skip the suite that would catch it.
      - "field-ops-app-vite/src/domain/reportingPeriod.js"
      - "functions/src/ownership/operatingCompanyAuthority.ts"
      - "functions/src/finance/planVsActual.ts"
      - "functions/src/finance/financialApprovals.ts"
      - "functions/src/access/resolveEffectivePermission.ts"
      - "functions/src/access/hierarchicalVisibility.ts"
      - "functions/src/access/roleHierarchy.ts"
      - "functions/src/access/governedBusinessRoles.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/constants/collections.ts"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/performance-goal-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/performance/**"
      - "functions/test/performanceGoal.test.mjs"
      # G-05 reporting period authority. Same lane as goals rather than a new one: goal pacing and
      # every windowed metric compose it, so a change to either side can break the other, and two
      # lanes would each report green on the change that broke the pair.
      - "functions/src/reportingPeriod/**"
      - "functions/test/reportingPeriod.test.mjs"
      - "functions/test/reportingPeriodParity.test.mjs"
      # The CLIENT MIRROR is watched here deliberately. The parity suite imports it directly, so a
      # change to the mirror alone -- with no server file touched -- is exactly the edit that can
      # make the two ports disagree, and it must not be able to skip the suite that would catch it.
      - "field-ops-app-vite/src/domain/reportingPeriod.js"
      - "functions/src/ownership/operatingCompanyAuthority.ts"
      - "functions/src/finance/planVsActual.ts"
      - "functions/src/finance/financialApprovals.ts"
      - "functions/src/access/resolveEffectivePermission.ts"
      - "functions/src/access/hierarchicalVisibility.ts"
      - "functions/src/access/roleHierarchy.ts"
      - "functions/src/access/governedBusinessRoles.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/constants/collections.ts"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/performance-goal-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  performance-goal-tests:
    name: Performance goal + reporting period unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Build (the suite runs against functions/lib)
        run: npm run build
        working-directory: functions

      - name: Performance goal authority unit tests
        run: node --test test/performanceGoal.test.mjs
        working-directory: functions

      # Run in UTC, deliberately, and NOT in the reporting timezone. A reporting-period suite that
      # only passes on a machine already set to America/Phoenix proves nothing about the authority --
      # it proves the host agreed. This is the exact failure that hid in financialsPeriod's own suite
      # until G-05 moved its boundaries: eleven of seventeen tests passed locally and would have
      # failed here.
      - name: Reporting period authority unit tests (UTC runner)
        run: node --test test/reportingPeriod.test.mjs test/reportingPeriodParity.test.mjs
        working-directory: functions
        env:
          TZ: UTC
