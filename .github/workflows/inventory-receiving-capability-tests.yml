name: Inventory Receiving Capability Registration Tests

# EI Phase-2 Receiving (Phase C) -- INERT capability + AuditAction registration
# (permissionCatalog.ts inventory.stock.receive + types/access.ts + auditEventWriter.ts
# receiveInventoryStock). Offline unit test proving the capability is registered but UNGRANTED (no role,
# no wildcard/superuser bypass, no initializer mint). NO emulator, NO credentials, NO production, NO
# grant, NO deployment. (The AuditAction acceptance + the A3 exhaustiveness gate run in the existing
# Audit Event + Permission catalog/resolver workflows, which this change also triggers.)

on:
  pull_request:
    paths:
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/governedBusinessRoles.ts"
      - "functions/test/receivingCapabilityRegistration.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-receiving-capability-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/governedBusinessRoles.ts"
      - "functions/test/receivingCapabilityRegistration.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-receiving-capability-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-receiving-capability-tests:
    name: Inventory receiving capability registration tests (offline; granted to {admin,dispatcher,owner})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Receiving capability registration tests (offline; proves granted-by-exactly {admin,dispatcher,owner})
        run: npm run test:receivingCapability
        working-directory: functions
