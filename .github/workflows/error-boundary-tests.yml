name: Error boundary

# The root ErrorBoundary wraps the entire application (main.jsx, above AuthProvider).
# A regression here does not degrade one screen -- it kills the whole session. Its guard
# therefore needs its own path trigger; without one, editing the boundary runs no suite.
on:
  pull_request:
    paths:
      - "field-ops-app-vite/src/components/ErrorBoundary.jsx"
      - "field-ops-app-vite/src/shared/ui/FailureState.jsx"
      - "field-ops-app-vite/test/errorBoundary.test.jsx"
      - ".github/workflows/error-boundary-tests.yml"
  push:
    branches: [main]
    paths:
      - "field-ops-app-vite/src/components/ErrorBoundary.jsx"
      - "field-ops-app-vite/test/errorBoundary.test.jsx"

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-ops-app-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: field-ops-app-vite/package-lock.json }
      - run: npm ci
      - run: npx vitest run test/errorBoundary.test.jsx
