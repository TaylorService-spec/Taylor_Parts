name: Firebase Exit Guard

# Refuses a NEW Firebase business-runtime dependency (Firestore client, Firebase Functions
# client, firebase-admin Firestore, firebase-functions server runtime) beyond the committed
# baseline at docs/architecture/firebase-exit-baseline.json. The baseline may only shrink.
#
# TWO FENCES RUN HERE, and they cover different escapes:
#
#   1. the DIRECT-IMPORT fence (scripts/firebaseExitGuard.mjs) -- both the subpath form
#      (from "firebase-admin/firestore") and the NAMESPACE form (a bare "firebase-admin" root
#      import plus a Firestore access expression), which named no forbidden specifier and was a
#      confirmed live bypass until it was closed;
#
#   2. the SHIM BOUNDARY (scripts/firebaseShimBoundary.mjs) -- the growth of the approved
#      transitional Firestore re-export shims' consumer sets. The dependency IS fenced at each
#      shim; what was unfenced is a NEW module reaching Firestore through one and appearing
#      nowhere in the Firebase-exit ledger. Existing consumers are permitted by Owner ruling and
#      are NOT marked.
#
# See docs/architecture/firebase-exit-manifest.json for the IDENTITY_ONLY vs BUSINESS_RUNTIME
# classification and docs/architecture/firebase-exit-ratchet.md for why this is a ratchet.
#
# Path-filtered: only runs when a change could plausibly move the fenced dependency sets --
# the two scanned source trees, the baseline/manifest documents, the guard itself, or its tests.
# A documentation-only ledger change elsewhere in docs/ does not trigger this workflow.

on:
  pull_request:
    paths:
      - "field-ops-app-vite/src/**"
      - "functions/src/**"
      - "integrations/**"
      - "docs/architecture/firebase-exit-baseline.json"
      - "docs/architecture/firebase-exit-manifest.json"
      - "scripts/firebaseExitGuard.mjs"
      - "scripts/firebaseExitGuard.test.mjs"
      - "scripts/firebaseShimBoundary.mjs"
      - "scripts/firebaseShimBoundary.test.mjs"
      - "docs/architecture/firebase-shim-consumer-census.json"
      - ".github/workflows/firebase-exit-guard.yml"
  push:
    branches: [main]
    paths:
      - "field-ops-app-vite/src/**"
      - "functions/src/**"
      - "integrations/**"
      - "docs/architecture/firebase-exit-baseline.json"
      - "docs/architecture/firebase-exit-manifest.json"
      - "scripts/firebaseExitGuard.mjs"
      - "scripts/firebaseExitGuard.test.mjs"
      - "scripts/firebaseShimBoundary.mjs"
      - "scripts/firebaseShimBoundary.test.mjs"
      - "docs/architecture/firebase-shim-consumer-census.json"
      - ".github/workflows/firebase-exit-guard.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  firebase-exit-guard:
    name: No new Firebase business-runtime dependencies, directly or behind a transitional shim
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the previous-baseline step below needs to `git show` the baseline file as
      # it existed at the PR base sha (pull_request) or the pre-push commit (push to main), and a
      # shallow checkout may not have that commit available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard contract tests
        run: node --test scripts/firebaseExitGuard.test.mjs

      # The shim boundary's own contract tests. Separate step so a failure names which fence broke.
      - name: Shim boundary contract tests
        run: node --test scripts/firebaseShimBoundary.test.mjs

      # Resolve the previous accepted commit and fail closed if it can't be. An empty output
      # means "no previous commit is expected" (branch-creation push, or workflow_dispatch on a
      # root commit) -- the only cases where bootstrap is allowed without a resolvable sha. Any
      # sha we *do* expect to resolve (PR base, push "before", dispatch HEAD^) MUST resolve, or
      # the job fails; it must never be silently treated as "predates the baseline".
      - name: Determine previous accepted commit
        id: previous-commit
        shell: bash
        run: |
          set -eu
          ZERO_SHA="0000000000000000000000000000000000000000"
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.base.sha }}"
            if [ -z "$SHA" ] || ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              echo "::error::Firebase exit guard: pull_request base sha '$SHA' could not be resolved. Failing closed." >&2
              exit 1
            fi
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          elif [ "$EVENT" = "push" ]; then
            SHA="${{ github.event.before }}"
            if [ "$SHA" = "$ZERO_SHA" ]; then
              # Branch-creation push: genuinely no previous commit.
              echo "sha=" >> "$GITHUB_OUTPUT"
            elif [ -z "$SHA" ] || ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              echo "::error::Firebase exit guard: push 'before' sha '$SHA' could not be resolved. Failing closed." >&2
              exit 1
            else
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            fi

          else
            # workflow_dispatch: previous commit is HEAD^, if HEAD has one.
            if PARENT_SHA="$(git rev-parse --verify -q HEAD^)"; then
              echo "sha=$PARENT_SHA" >> "$GITHUB_OUTPUT"
            elif git rev-list --max-parents=0 HEAD | grep -qx "$(git rev-parse HEAD)"; then
              # HEAD is genuinely a root commit: no previous commit is expected.
              echo "sha=" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Firebase exit guard: workflow_dispatch expected parent of HEAD could not be resolved. Failing closed." >&2
              exit 1
            fi
          fi

      # Materialize the previous accepted baseline (if any) to a temp file so the pure Node
      # checker never has to shell out to git itself. The previous step already guaranteed that
      # any non-empty sha resolves to a real commit, so the only remaining bootstrap case here is
      # a resolvable commit that genuinely predates this baseline file.
      - name: Materialize previous accepted baseline
        id: previous-baseline
        shell: bash
        run: |
          set -u
          SHA="${{ steps.previous-commit.outputs.sha }}"
          TMP="$(mktemp)"
          if [ -n "$SHA" ] \
              && git cat-file -e "$SHA:docs/architecture/firebase-exit-baseline.json" 2>/dev/null; then
            git show "$SHA:docs/architecture/firebase-exit-baseline.json" > "$TMP"
            echo "path=$TMP" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan the tracked repository
        shell: bash
        run: |
          if [ -n "${{ steps.previous-baseline.outputs.path }}" ]; then
            node scripts/firebaseExitGuard.mjs --previous-baseline="${{ steps.previous-baseline.outputs.path }}"
          else
            node scripts/firebaseExitGuard.mjs
          fi

      # ================================ THE SHIM BOUNDARY ======================================
      #
      # The guard above is a DIRECT-IMPORT fence, so a Firestore handle re-exported from one module
      # is invisible to it everywhere downstream. Owner ruling: the approved transitional
      # re-export shims MAY REMAIN, and their existing consumers are NOT violations. What is
      # governed here is therefore the GROWTH of those consumer sets, not the shims' existence --
      # a new module reaching Firestore through a shim fails; an existing one does not.
      #
      # Same two-check shape as the guard, for the same reason: the committed census must match the
      # tree exactly, AND it may only shrink relative to the previously accepted census, so one
      # change cannot add a consumer and widen the census together.
      #
      # Retirement is not scheduled separately: a shim leaves the registry automatically when it
      # stops carrying a guard-fenced Firestore dependency, and its census section must go with it.
      - name: Materialize previous accepted shim census
        id: previous-census
        shell: bash
        run: |
          set -u
          SHA="${{ steps.previous-commit.outputs.sha }}"
          TMP="$(mktemp)"
          if [ -n "$SHA" ] \
              && git cat-file -e "$SHA:docs/architecture/firebase-shim-consumer-census.json" 2>/dev/null; then
            git show "$SHA:docs/architecture/firebase-shim-consumer-census.json" > "$TMP"
            echo "path=$TMP" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # NOTE the asymmetry with the guard, and it is deliberate: a bare run of the shim boundary
      # ENFORCES the committed census. It never bootstraps one. Writing the census takes --write,
      # explicitly, so "the job passed" can never mean "the census wrote itself a new floor".
      - name: Enforce the transitional shim boundary
        shell: bash
        run: |
          if [ -n "${{ steps.previous-census.outputs.path }}" ]; then
            node scripts/firebaseShimBoundary.mjs --previous-census="${{ steps.previous-census.outputs.path }}"
          else
            node scripts/firebaseShimBoundary.mjs
          fi
