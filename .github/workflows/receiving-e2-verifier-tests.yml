name: Receiving E2 Verifier + Rollback Tests

# EI Phase-2 Receiving -- Gate E2-V: the committed, offline-unit-tested production verifier
# (verifyReceivingE2Deployment.js + receivingE2VerifierCli.js) and the lossless typed warehouse
# backup/restore tooling (warehouseBackupCodec.ts + warehouseBackupRestoreCli.js). Offline + Firestore-
# emulator tests only: NO deployment, NO production. Proves the fail-closed verifier interpreters +
# atomic-publish-only-on-pass, and the snapshot -> mutate -> restore -> Timestamp-exact parity round-trip
# plus fail-closed identity-set drift.

on:
  pull_request:
    paths:
      - "functions/src/warehouseGovernance/warehouseBackupCodec.ts"
      - "functions/scripts/warehouseBackupRestoreCli.js"
      - "functions/scripts/receivingE2VerificationMatrix.js"
      - "functions/scripts/verifyReceivingE2Deployment.js"
      - "functions/scripts/firestoreRulesSourceHashCli.js"
      - "functions/scripts/receivingE2VerifierCli.js"
      - "functions/test/warehouseBackupCodec.test.mjs"
      - "functions/test/warehouseBackupRestore.test.mjs"
      - "functions/test/warehouseBackupRestoreEmulator.test.mjs"
      - "functions/test/verifyReceivingE2Deployment.test.mjs"
      - "functions/test/firestoreRulesSourceHash.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/receiving-e2-verifier-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/warehouseGovernance/warehouseBackupCodec.ts"
      - "functions/scripts/warehouseBackupRestoreCli.js"
      - "functions/scripts/receivingE2VerificationMatrix.js"
      - "functions/scripts/verifyReceivingE2Deployment.js"
      - "functions/scripts/firestoreRulesSourceHashCli.js"
      - "functions/scripts/receivingE2VerifierCli.js"
      - "functions/test/warehouseBackupCodec.test.mjs"
      - "functions/test/warehouseBackupRestore.test.mjs"
      - "functions/test/warehouseBackupRestoreEmulator.test.mjs"
      - "functions/test/verifyReceivingE2Deployment.test.mjs"
      - "functions/test/firestoreRulesSourceHash.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/receiving-e2-verifier-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiving-e2-verifier-tests:
    name: Receiving E2 verifier + rollback tests (offline + Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Offline verifier + backup/restore codec + CLI tests
        run: npm run test:receivingE2Verifier
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/e2-verifier-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/e2-verifier-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulator did not become ready in time"
          cat /tmp/e2-verifier-emulator.log
          exit 1
        working-directory: functions

      - name: Backup/restore round-trip on the Firestore emulator (build + run)
        run: npm run test:receivingE2VerifierEmulator
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-verifier-emulator-logs
          path: |
            /tmp/e2-verifier-emulator.log
          if-no-files-found: ignore
