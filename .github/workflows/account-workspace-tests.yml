# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  account-workspace-tests:
    name: Account workspace (health strip + financials composition + fail-closed reads)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json

      - name: Install app dependencies
        run: npm install
        working-directory: field-ops-app-vite

      # Pure view model: which metrics exist, and that an unavailable source never becomes a number.
      - name: Account health strip (offline)
        run: node test/accountHealthStrip.test.mjs
        working-directory: field-ops-app-vite

      - name: Account AR in-flight sharing (#1095)
        run: node test/accountArInFlightSharing.test.mjs
        working-directory: field-ops-app-vite

      # Locks the repetition regression: the unconfigured-provider sentence must not return 4x.
      - name: Account financials composition
        run: npx vitest run test/accountFinancialsSection.test.jsx
        working-directory: field-ops-app-vite

      # Pre-existing fail-closed guarantees for the account/contacts reads.
      - name: Account detail fail-closed reads
        run: npx vitest run test/accountDetailFailClosed.test.jsx
        working-directory: field-ops-app-vite

      # Wave 7 completion PARTS 2/3 -- account-scoped Opportunity/Sales Order pure view-models
      # (loading/denied/unavailable/empty/ready, bounded-truncation disclosure) and the owner-identity
      # resolver's new employeeId branch.
      - name: Account-scoped Opportunity/Sales Order view models (offline)
        run: node test/accountOpportunitiesView.test.mjs && node test/accountSalesOrdersView.test.mjs && node test/actorDisplayName.test.mjs
        working-directory: field-ops-app-vite

      # Component coverage: loading/denied/unavailable/empty/populated states, EMPTY kept distinct from
      # every FAILURE state, no raw uid ever rendered, and deep links point at real routes.
      - name: Account-scoped Opportunities + Sales Orders sections
        run: npx vitest run test/accountOpportunitiesAndSalesOrdersSections.test.jsx
        working-directory: field-ops-app-vite

      # The /customers list on the canonical structured object-list experience: metadata-driven
      # filters and sort, URL-backed criteria, the two-array-filter refusal, human owner names, and
      # the whole-book portfolio cards staying whole-book under paging.
      - name: Customers structured list + related-field projection
        run: npx vitest run test/accountsStructuredList.test.jsx
        working-directory: field-ops-app-vite

      # CRM-8: the build-time CRM authority route. Static selection, closed allowlist, no fallback, EOS path free of
      # Firebase business runtime.
      - name: CRM authority route contract (offline)
        run: node --test test/crmAuthorityRoute.test.mjs
        working-directory: field-ops-app-vite

      # The platform-sandbox selection of the public CRM modules: writers, reads and the Customers list use the EOS API
      # route only; a refusal or an unreachable API is a failure, never a Firestore read.
      - name: CRM client cutover, platform-sandbox selection (EOS API only)
        run: npx vitest run test/crmClientCutover.test.jsx test/crmAccountOwnerPrecondition.test.jsx
        working-directory: field-ops-app-vite

      # The production-capable bundle must not carry the EOS CRM route at all (tree-shaken, not merely unreachable),
      # and the platform-sandbox bundle must. Builds only -- nothing is deployed.
      - name: CRM route present only in the platform-sandbox bundle
        shell: bash
        run: |
          set -euo pipefail
          for env in taylor-parts-production platform-sandbox; do
            VITE_ENVIRONMENT_ID="$env" npx vite build --outDir "$RUNNER_TEMP/dist-$env" --emptyOutDir --logLevel error
          done
          if grep -rlF "/crm/customer" "$RUNNER_TEMP/dist-taylor-parts-production"; then
            echo "::error::the taylor-parts-production bundle carries the EOS CRM route"; exit 1
          fi
          grep -rqF "/crm/customer" "$RUNNER_TEMP/dist-platform-sandbox" || { echo "::error::the platform-sandbox bundle lost the EOS CRM route"; exit 1; }
        working-directory: field-ops-app-vite

      - name: Lint
        run: npx oxlint src/modules/accounts/ src/domain/accountHealthStrip.js src/domain/accountOpportunitiesView.js src/domain/accountSalesOrdersView.js src/domain/actorDisplayName.js src/hooks/useAccountOpportunities.js src/hooks/useAccountSalesOrders.js src/hooks/useEmployeeDirectory.js src/services/accountOpportunitiesReadCallableClient.js src/services/accountSalesOrdersReadCallableClient.js
        working-directory: field-ops-app-vite
