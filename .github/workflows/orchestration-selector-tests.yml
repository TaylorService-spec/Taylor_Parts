name: Orchestration Selector Tests

# Continuous Workstream Orchestrator — the PURE next-eligible work selector that the Option A `/loop`
# continuation driver runs each iteration (docs/orchestration/loop-continuation-driver.md). Zero-dependency
# node:test — no Firebase, no emulator, no npm install, no secrets, no deployment. It selects work and
# encodes the blocked-item prerequisite-decomposition correction; it activates, grants, and deploys nothing.

on:
  pull_request:
    paths:
      - "docs/orchestration/lib/selectNextWork.mjs"
      - "docs/orchestration/lib/selectNextWork.test.mjs"
      - "docs/orchestration/lib/controlCenterAdapter.mjs"
      - "docs/orchestration/lib/controlCenterAdapter.test.mjs"
      - "docs/orchestration/lib/agentManager.mjs"
      - "docs/orchestration/lib/agentManager.test.mjs"
      - "docs/orchestration/integration-backlog.json"
      - "docs/orchestration/integration-shadow-status.json"
      - "docs/orchestration/lib/integrationShadow.mjs"
      - "docs/orchestration/lib/integrationShadow.test.mjs"
      - ".github/workflows/orchestration-selector-tests.yml"
  push:
    branches: [main]
    paths:
      - "docs/orchestration/lib/selectNextWork.mjs"
      - "docs/orchestration/lib/selectNextWork.test.mjs"
      - "docs/orchestration/lib/controlCenterAdapter.mjs"
      - "docs/orchestration/lib/agentManager.mjs"
      - "docs/orchestration/integration-backlog.json"
      - "docs/orchestration/integration-shadow-status.json"
      - "docs/orchestration/lib/integrationShadow.mjs"
      - "docs/orchestration/lib/controlCenterAdapter.test.mjs"
      - ".github/workflows/orchestration-selector-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  selector:
    name: Next-eligible work selector (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Selector unit tests (node:test, zero-dependency)
        run: node --test docs/orchestration/lib/selectNextWork.test.mjs

      - name: Control Center adapter contract
        run: node --test docs/orchestration/lib/controlCenterAdapter.test.mjs
      - name: Agent Manager integration backlog contract
        run: node --test docs/orchestration/lib/agentManager.test.mjs
      - name: Read-only integration shadow contract
        run: node --test docs/orchestration/lib/integrationShadow.test.mjs
