# Reciprocal INDEPENDENT_AI GPT review — repo-safe trigger path.
#
# SAFETY: manual-dispatch ONLY (workflow_dispatch). It NEVER runs on push/PR, so a merge can never
# trigger a live OpenAI call. Default mode is DRY-RUN (no provider call, no key read). A live call
# requires (a) mode=live at dispatch AND (b) the OPENAI_API_KEY repo secret being set by the Owner —
# this is the activation boundary. The key is referenced only via the secrets context and is never
# printed. Ceilings are enforced in-code (openaiReviewProvider): $0.25/review, $10 pilot total, no
# auto-recharge.
name: Reciprocal GPT Review (manual, dry-run default)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default, no provider call) | live (Owner activation — real API call + spend)"
        required: true
        default: "dry-run"
        type: choice
        options: ["dry-run", "live"]
      request_id:
        description: "review request id"
        required: false
        default: "REVIEW-DRYRUN"
      diff_path:
        description: "path to a diff file in the repo to review (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # SAFE INPUT HANDLING: request_id / diff_path are NEVER interpolated into the shell command.
      # They flow ONLY through env vars, read by Node as plain strings (no shell, no eval, no command
      # substitution, no generated fragments). diff_path is validated in-code (repo-relative, in-
      # checkout, must exist). Dry-run and live use IDENTICAL input wiring — the only differences are
      # the API key (live only) and the --live flag.
      - name: Dry-run (no provider call, no key)
        if: ${{ inputs.mode != 'live' }}
        env:
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          REVIEW_REQUEST_ID: ${{ inputs.request_id }}
          REVIEW_DIFF_PATH: ${{ inputs.diff_path }}
          # Deliberately NO OPENAI_API_KEY here: dry-run must never receive the key or call OpenAI.
        run: node docs/orchestration/context/openai-review.mjs
      - name: Live review (Owner activation boundary — real spend, ceilings enforced in-code)
        if: ${{ inputs.mode == 'live' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # injected secret; never printed
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          REVIEW_REQUEST_ID: ${{ inputs.request_id }}
          REVIEW_DIFF_PATH: ${{ inputs.diff_path }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret not set — refusing live call (activation boundary not crossed)."
            exit 1
          fi
          node docs/orchestration/context/openai-review.mjs --live
