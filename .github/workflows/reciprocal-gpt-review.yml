name: Exact-head FACT_BASED GPT review

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or live (one authorized provider call)"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live]
      review_id:
        required: true
        type: string
      repo:
        required: true
        default: TaylorService-spec/Taylor_Parts
        type: string
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      review_question:
        required: true
        type: string
      review_profile:
        required: true
        default: security-credential-boundary
        type: string
      max_spend_usd:
        required: true
        default: "0.25"
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Root is the current governed runner from main. The immutable subject is isolated below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout immutable review subject
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
          path: review-subject
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify fact-review implementation
        run: node --test docs/orchestration/context/github-fact-review.test.mjs docs/orchestration/lib/reviewFeedInvocation.test.mjs docs/orchestration/lib/reviewWorkflowWiring.test.mjs
      - name: DRY fact review (no provider call, no key)
        if: ${{ inputs.mode != 'live' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          REVIEW_ID: ${{ inputs.review_id }}
          REVIEW_REPO: ${{ inputs.repo }}
          REVIEW_PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REVIEW_QUESTION: ${{ inputs.review_question }}
          REVIEW_PROFILE: ${{ inputs.review_profile }}
          REVIEW_MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          REVIEW_SUBJECT_ROOT: ${{ github.workspace }}/review-subject
        run: node docs/orchestration/context/github-fact-review.mjs
      - name: LIVE fact review (one authorized call)
        id: live_review
        if: ${{ inputs.mode == 'live' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          REVIEW_ID: ${{ inputs.review_id }}
          REVIEW_REPO: ${{ inputs.repo }}
          REVIEW_PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REVIEW_QUESTION: ${{ inputs.review_question }}
          REVIEW_PROFILE: ${{ inputs.review_profile }}
          REVIEW_MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          REVIEW_SUBJECT_ROOT: ${{ github.workspace }}/review-subject
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret not set; refusing before provider invocation."
            exit 1
          fi
          node docs/orchestration/context/github-fact-review.mjs --live
      - name: Upload content-addressed result
        if: ${{ inputs.mode == 'live' && steps.live_review.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: eos-review-${{ inputs.review_id }}-${{ steps.live_review.outputs.artifact_sha256 }}
          path: ${{ steps.live_review.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Persist result pointer on reviewed PR
        if: ${{ inputs.mode == 'live' && steps.live_review.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_REPO: ${{ inputs.repo }}
          REVIEW_ID: ${{ inputs.review_id }}
          REVIEWED_SHA: ${{ inputs.expected_head_sha }}
          ARTIFACT_SHA: ${{ steps.live_review.outputs.artifact_sha256 }}
          VERDICT: ${{ steps.live_review.outputs.verdict }}
        run: |
          printf 'Independent review `%s`: **%s**\n\nReviewed `%s` with `feedMode=FACT_BASED`. Content SHA-256: `%s`. Durable run: %s/actions/runs/%s\n' "$REVIEW_ID" "$VERDICT" "$REVIEWED_SHA" "$ARTIFACT_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/review-comment.md"
          gh pr comment "$PR_NUMBER" --repo "$REVIEW_REPO" --body-file "$RUNNER_TEMP/review-comment.md"
