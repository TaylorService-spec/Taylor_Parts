name: Inventory Transfer Command Tests

# Enterprise Inventory Phase 4 -- the transfer command family (functions/src/inventoryTransfer/**).
# Firestore-emulator tests only: NO production, NO deployment. Every inventory.transfer.* capability
# is registered `active: false` and granted to NO Role, so the callables never authorize a real
# principal until a later, separately-authorized grant + activation gate.

on:
  pull_request:
    paths:
      - "functions/src/inventoryTransfer/**"
      - "functions/src/inventoryLedger/**"
      - "functions/src/serializedAsset/**"
      - "functions/src/truckRegistry/**"
      - "functions/src/warehouseGovernance/**"
      - "functions/test/transferOrderCommand.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-transfer-command-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/inventoryTransfer/**"
      - "functions/src/inventoryLedger/**"
      - "functions/src/serializedAsset/**"
      - "functions/src/truckRegistry/**"
      - "functions/src/warehouseGovernance/**"
      - "functions/test/transferOrderCommand.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-transfer-command-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-transfer-command-tests:
    name: Inventory transfer command tests (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Build (TypeScript)
        run: npm run build
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/transfer-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/transfer-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulator did not become ready in time"
          cat /tmp/transfer-emulator.log
          exit 1
        working-directory: functions

      - name: Transfer command tests (create/dispatch/receive/cancel; NONE + SERIAL; WAREHOUSE + MOBILE)
        run: npm run test:transferOrderCommand
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-emulator-logs
          path: |
            /tmp/transfer-emulator.log
            functions/firestore-debug.log
          if-no-files-found: ignore
