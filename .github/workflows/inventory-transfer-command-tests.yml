name: Inventory Transfer Command Tests

# Enterprise Inventory Phase 4 -- the transfer command family (functions/src/inventoryTransfer/**).
# Firestore-emulator tests only: NO production, NO deployment. Every inventory.transfer.* capability
# is registered `active: false` and granted to NO Role, so the callables never authorize a real
# principal until a later, separately-authorized grant + activation gate.

on:
  pull_request:
    paths:
      - "functions/src/inventoryTransfer/**"
      - "functions/src/inventoryLedger/**"
      - "functions/src/serializedAsset/**"
      - "functions/src/truckRegistry/**"
      - "functions/src/warehouseGovernance/**"
      - "functions/test/transferOrderCommand.test.mjs"
      # BIN-P6 / Decision #170: the relocation authority, the one on-hand module, bin parentage, and
      # every reader moved onto it. A change to any of them re-runs the conservation proofs.
      - "functions/src/inventoryLocation/stockRelocationCommand.ts"
      - "functions/src/inventoryLocation/stockRelocationCallables.ts"
      - "functions/src/inventoryLocation/binParentage.ts"
      - "functions/src/inventoryLocation/putAwayCommand.ts"
      - "functions/src/fulfillment/fulfillmentAvailability.ts"
      - "functions/src/cycleCount/cycleCountExpectedQuantity.ts"
      - "functions/src/cycleCount/cycleCountTypes.ts"
      - "functions/src/cycleCount/cycleCountValidation.ts"
      - "functions/src/inventoryAnalyticsCallables.ts"
      - "functions/test/stockRelocationCommand.test.mjs"
      - "functions/test/locationOnHandAuthority.test.mjs"
      - "functions/test/binConversionReconciliation.test.mjs"
      - "functions/scripts/binConversionReconciliation.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-transfer-command-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/inventoryTransfer/**"
      - "functions/src/inventoryLedger/**"
      - "functions/src/serializedAsset/**"
      - "functions/src/truckRegistry/**"
      - "functions/src/warehouseGovernance/**"
      - "functions/test/transferOrderCommand.test.mjs"
      # BIN-P6 / Decision #170: the relocation authority, the one on-hand module, bin parentage, and
      # every reader moved onto it. A change to any of them re-runs the conservation proofs.
      - "functions/src/inventoryLocation/stockRelocationCommand.ts"
      - "functions/src/inventoryLocation/stockRelocationCallables.ts"
      - "functions/src/inventoryLocation/binParentage.ts"
      - "functions/src/inventoryLocation/putAwayCommand.ts"
      - "functions/src/fulfillment/fulfillmentAvailability.ts"
      - "functions/src/cycleCount/cycleCountExpectedQuantity.ts"
      - "functions/src/cycleCount/cycleCountTypes.ts"
      - "functions/src/cycleCount/cycleCountValidation.ts"
      - "functions/src/inventoryAnalyticsCallables.ts"
      - "functions/test/stockRelocationCommand.test.mjs"
      - "functions/test/locationOnHandAuthority.test.mjs"
      - "functions/test/binConversionReconciliation.test.mjs"
      - "functions/scripts/binConversionReconciliation.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-transfer-command-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  inventory-transfer-command-tests:
    name: Inventory transfer command tests (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Build (TypeScript)
        run: npm run build
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/transfer-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/transfer-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulator did not become ready in time"
          cat /tmp/transfer-emulator.log
          exit 1
        working-directory: functions

      - name: Transfer command tests (create/dispatch/receive/cancel; NONE + SERIAL; WAREHOUSE + MOBILE)
        run: npm run test:transferOrderCommand
        working-directory: functions

      # BIN-P6. Named explicitly: an unnamed suite does not run in this repository's CI at all.
      - name: One on-hand authority (static + pure guards, no emulator)
        run: node --test test/locationOnHandAuthority.test.mjs
        working-directory: functions

      - name: Stock relocation (conservation, exact source, replay, serialized custody, Transfer bin endpoints)
        run: node test/stockRelocationCommand.test.mjs
        working-directory: functions
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

      - name: Bin conversion reconciliation (before = after per part; read-only script refuses production)
        run: node test/binConversionReconciliation.test.mjs
        working-directory: functions
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-emulator-logs
          path: |
            /tmp/transfer-emulator.log
            functions/firestore-debug.log
          if-no-files-found: ignore
