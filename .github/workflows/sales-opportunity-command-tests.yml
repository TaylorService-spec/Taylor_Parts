name: Sales Opportunity Command Tests

# Sales Opportunity Cycle 3 -- pure-logic unit tests for the governed Opportunity write core (lifecycle
# transition authority + create/transition command builders): the minimal transition graph, product-level
# line enforcement (serialized asset forbidden), canonical owner requirement, fail-closed error mapping. No
# emulator, no deployment, no production access, no secrets -- runs against the compiled functions/lib. The
# `opportunity.write` capability is registered active:false and the callables are exported but undeployed, so
# nothing runs in production.

on:
  pull_request:
    paths:
      - "functions/src/opportunity/**"
      - "functions/src/constants/collections.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/test/opportunityCommands.test.mjs"
      - "functions/test/opportunityReadService.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/sales-opportunity-command-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/opportunity/**"
      - "functions/src/constants/collections.ts"
      - "functions/test/opportunityCommands.test.mjs"
      - "functions/test/opportunityReadService.test.mjs"
      - ".github/workflows/sales-opportunity-command-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Batch 1 proved the mechanism:
# two superseded PR runs cancelled, the newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sales-opportunity-command-tests:
    name: Opportunity write core (build + run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Opportunity command tests (build + run)
        run: npm run test:opportunity
        working-directory: functions
