name: CRM retire Firestore writes one-shot apply

on:
  push:
    branches:
      - crm/nonprod-retire-firestore-writes
    paths:
      - ".github/workflows/crm-retire-firestore-writes-apply.yml"
      - "functions/scripts/retireCrmFirestoreWritesOnce.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm/nonprod-retire-firestore-writes
          fetch-depth: 0

      - name: Verify branch still descends from expected main baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "6077e9ca6fb7d3e74d7c408a91b2f5c7802eb5bd"
          test "$(git rev-parse origin/main)" = "6077e9ca6fb7d3e74d7c408a91b2f5c7802eb5bd"

      - name: Apply CRM Firestore write retirement
        shell: bash
        run: |
          set -euo pipefail
          python functions/scripts/retireCrmFirestoreWritesOnce.py
          cmp -s firestore.rules field-ops-app-vite/firestore.rules
          ! grep -q 'accountPaymentTermsValid\|accountTaxStatusValid\|accountGovernedFieldsValid\|accountGovernedFieldsUnchanged\|accountGovernedCreateBaseline' firestore.rules
          git diff --check

      - name: Commit only intended changes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/crm-retire-firestore-writes-apply.yml
          rm functions/scripts/retireCrmFirestoreWritesOnce.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules field-ops-app-vite/firestore.rules functions/test/accountsGovernedFieldsRules.test.js .github/workflows/crm-retire-firestore-writes-apply.yml functions/scripts/retireCrmFirestoreWritesOnce.py
          git diff --cached --check
          git commit -m "fix(crm): retire legacy Firestore CRM write grants"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6077e9ca6fb7d3e74d7c408a91b2f5c7802eb5bd"
          git push origin HEAD:crm/nonprod-retire-firestore-writes
