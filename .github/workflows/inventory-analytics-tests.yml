# The inventory analytics path had NO workflow path-filtering it, so a change to the callable or the
# analytics engine ran no test in CI at all. That is how a payload the callable protocol cannot encode
# reached the live sandbox as a bare 500. This workflow exists so the wire-encoding regression stays
# covered; it needs no emulator, because the encoder and the analytics engine are both pure.
name: Inventory analytics tests

on:
  pull_request:
    paths:
      - "functions/src/inventoryAnalyticsCallables.ts"
      - "functions/src/inventoryAnalyticsService.ts"
      - "functions/src/ledgerNormalizer.ts"
      - "functions/test/inventoryAnalyticsWireEncoding.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-analytics-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/inventoryAnalyticsCallables.ts"
      - "functions/src/inventoryAnalyticsService.ts"
      - "functions/src/ledgerNormalizer.ts"
      - "functions/test/inventoryAnalyticsWireEncoding.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/inventory-analytics-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:inventoryAnalyticsWire
