name: Composition Conformance Tests

# Site-wide card/composition standardization gate. The design system (WorkspaceShell/ContextBand/ActionRail/
# StatusPill, Wave 0) spreads surface-by-surface; this workflow is what stops it backsliding. It runs the
# burn-down conformance gates (no new fo-badge outside a shrinking legacy allowlist; conformant surfaces adopt
# the shell + carry zero fo-badge; the allowlist may not go stale) plus the migrated Truck Inventory render
# regression. Broad path triggers on modules/** and shared/** because the "no new fo-badge" gate scans every
# surface — a new offender anywhere must fail the PR. Offline: no emulator, deploy, or secrets.

on:
  pull_request:
    paths:
      - "field-ops-app-vite/src/modules/**"
      - "field-ops-app-vite/src/shared/**"
      - "field-ops-app-vite/src/domain/truckInventoryView.js"
      - "field-ops-app-vite/src/index.css"
      - "field-ops-app-vite/test/compositionConformance.test.jsx"
      - "field-ops-app-vite/test/truckInventory.test.jsx"
      # Field presentation + navigation, and the raw-id guard that spans both architectures.
      - "field-ops-app-vite/src/domain/structuredFields.js"
      - "field-ops-app-vite/src/navigation/objectRoutes.js"
      - "field-ops-app-vite/src/navigation/listStateMemory.js"
      - "field-ops-app-vite/test/rawIdPresentationGuard.test.jsx"
      # ADR-013 -- the canonical object-list metadata layer and its boundary.
      - "field-ops-app-vite/src/metadata/listUrlState.js"
      - "field-ops-app-vite/src/metadata/unsupportedReason.js"
      - "field-ops-app-vite/src/metadata/gapRegister.js"
      - "field-ops-app-vite/src/metadata/absence.js"
      - "field-ops-app-vite/src/metadata/entityDefinition.js"
      - "field-ops-app-vite/test/metadataConvergedFeatures.test.mjs"
      - "field-ops-app-vite/test/objectListMetadataAuthority.test.mjs"
      - "field-ops-app-vite/src/metadata/uxMigrationManifest.js"
      - "field-ops-app-vite/test/uxMigrationManifest.test.jsx"
      - "field-ops-app-vite/src/modules/workOrders/WorkOrdersList.jsx"
      - "field-ops-app-vite/src/domain/workOrderSearch.js"
      - "field-ops-app-vite/src/domain/workOrderStatusGroups.js"
      - "field-ops-app-vite/src/metadata/definitions/workOrder.js"
      - "field-ops-app-vite/test/workOrdersListMigration.test.jsx"
      - ".github/workflows/composition-conformance-tests.yml"
  push:
    branches: [main]
    paths:
      - "field-ops-app-vite/src/modules/**"
      - "field-ops-app-vite/src/shared/**"
      - "field-ops-app-vite/src/domain/truckInventoryView.js"
      - "field-ops-app-vite/src/index.css"
      - "field-ops-app-vite/test/compositionConformance.test.jsx"
      - "field-ops-app-vite/test/truckInventory.test.jsx"
      # Field presentation + navigation, and the raw-id guard that spans both architectures.
      - "field-ops-app-vite/src/domain/structuredFields.js"
      - "field-ops-app-vite/src/navigation/objectRoutes.js"
      - "field-ops-app-vite/src/navigation/listStateMemory.js"
      - "field-ops-app-vite/test/rawIdPresentationGuard.test.jsx"
      # ADR-013 -- the canonical object-list metadata layer and its boundary.
      - "field-ops-app-vite/src/metadata/listUrlState.js"
      - "field-ops-app-vite/src/metadata/unsupportedReason.js"
      - "field-ops-app-vite/src/metadata/gapRegister.js"
      - "field-ops-app-vite/src/metadata/absence.js"
      - "field-ops-app-vite/src/metadata/entityDefinition.js"
      - "field-ops-app-vite/test/metadataConvergedFeatures.test.mjs"
      - "field-ops-app-vite/test/objectListMetadataAuthority.test.mjs"
      - "field-ops-app-vite/src/metadata/uxMigrationManifest.js"
      - "field-ops-app-vite/test/uxMigrationManifest.test.jsx"
      - "field-ops-app-vite/src/modules/workOrders/WorkOrdersList.jsx"
      - "field-ops-app-vite/src/domain/workOrderSearch.js"
      - "field-ops-app-vite/src/domain/workOrderStatusGroups.js"
      - "field-ops-app-vite/src/metadata/definitions/workOrder.js"
      - "field-ops-app-vite/test/workOrdersListMigration.test.jsx"
      - ".github/workflows/composition-conformance-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition-conformance-tests:
    name: Composition conformance + Truck render (vitest + jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: field-ops-app-vite
      - name: Conformance gates + Truck workspace regression
        run: npx vitest run test/compositionConformance.test.jsx test/truckInventory.test.jsx test/rawIdPresentationGuard.test.jsx
        # MISSING working-directory, pre-existing: this step ran from the repo root, so its
        # tests were never actually executing in this lane. Adding it makes them run.
        working-directory: field-ops-app-vite

      # The five features converged into src/metadata/ (ADR-013), each with its mutation proof:
      # URL-backed criteria, named unsupported reasons, the gap register, dropped-criteria
      # reporting, and structured absence. Replaces the two retired pilot suites this step used
      # to run -- their requirements moved with the code rather than being dropped.
      - name: Converged metadata features (URL state, reasons, gaps, absence)
        run: node --test test/metadataConvergedFeatures.test.mjs
        working-directory: field-ops-app-vite

      # The boundary itself: one architecture, one filter UI, one sort UI, one URL layer, and no
      # screen building its own bounded query.
      - name: Object list metadata authority boundary
        run: node --test test/objectListMetadataAuthority.test.mjs
        working-directory: field-ops-app-vite

      # WHAT IS ACTUALLY MOUNTED, read from the real screen files. A release report once claimed
      # six migrated lists when two were; this is what makes that impossible to repeat.
      - name: UX migration manifest (derived, not asserted)
        run: npx vitest run test/uxMigrationManifest.test.jsx
        working-directory: field-ops-app-vite

      # Work Orders: the bounded list AND the realtime dispatch subscription five other surfaces
      # read. The migration risk was never the list -- it was paging the board along with it.
      - name: Work Orders list migration (bounded list, realtime board intact)
        run: npx vitest run test/workOrdersListMigration.test.jsx
        working-directory: field-ops-app-vite
