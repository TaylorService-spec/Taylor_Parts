permissions:
  contents: read

jobs:
  composition-conformance-tests:
    name: Composition conformance + Truck render (vitest + jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-ops-app-vite/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: field-ops-app-vite
      - name: Conformance gates + Truck workspace regression
        run: npx vitest run test/compositionConformance.test.jsx test/truckInventory.test.jsx test/rawIdPresentationGuard.test.jsx test/workOrderNorthStarSurface.test.jsx test/lifecycleBand.test.jsx test/workOrderNorthStarPage.test.jsx test/workOrderNorthStarAuthority.test.jsx test/workOrderActionEmphasis.test.jsx test/workOrderNorthStarPage.test.jsx test/workOrderNorthStarAuthority.test.jsx test/workOrderActionEmphasisRule.test.jsx
        # MISSING working-directory, pre-existing: this step ran from the repo root, so its
        # tests were never actually executing in this lane. Adding it makes them run.
        working-directory: field-ops-app-vite

      # THE SALES ORDER FAMILY (family 2). Named here rather than left to `npm test`: a vitest
      # suite runs in CI only where a workflow names it (see test/ciSuiteCoverage.test.mjs).
      - name: Sales Order North Star composition (grammar + unchanged authority)
        run: npx vitest run test/salesOrderNorthStarPage.test.jsx test/salesOrderDetail.test.jsx
        working-directory: field-ops-app-vite

      # THE ACCOUNT FAMILY (family 3).
      - name: Account North Star composition (NS-P2 ordering + no fabricated lifecycle)
        run: npx vitest run test/accountNorthStarPage.test.jsx test/accountDetailFailClosed.test.jsx
        working-directory: field-ops-app-vite

      # THE OPPORTUNITY FAMILY (family 4). Named here for the reason family 2 recorded: a vitest
      # suite runs in CI only where a workflow names it (test/ciSuiteCoverage.test.mjs enforces it).
      - name: Opportunity North Star composition (one spine, one write path, no fabricated times)
        run: npx vitest run test/opportunityNorthStarPage.test.jsx test/opportunityLifecycleControl.test.jsx
        working-directory: field-ops-app-vite

      # Family 5. Its DERIVATION and READ SEAM run in the node manifest lane; this is the
      # COMPOSITION, which has no manifest and runs only where a workflow names it.
      - name: Sales Agreement North Star composition (no spine, governed actions only, honest absence)
        run: npx vitest run test/salesAgreementNorthStarPage.test.jsx test/salesAgreementCommandWiring.test.jsx test/salesAgreementLineage.test.jsx
        working-directory: field-ops-app-vite

      # The five features converged into src/metadata/ (ADR-013), each with its mutation proof:
      # URL-backed criteria, named unsupported reasons, the gap register, dropped-criteria
      # reporting, and structured absence. Replaces the two retired pilot suites this step used
      # to run -- their requirements moved with the code rather than being dropped.
      - name: Converged metadata features (URL state, reasons, gaps, absence)
        run: node --test test/metadataConvergedFeatures.test.mjs
        working-directory: field-ops-app-vite

      # The boundary itself: one architecture, one filter UI, one sort UI, one URL layer, and no
      # screen building its own bounded query.
      - name: Object list metadata authority boundary
        run: node --test test/objectListMetadataAuthority.test.mjs
        working-directory: field-ops-app-vite

      # WHAT IS ACTUALLY MOUNTED, read from the real screen files. A release report once claimed
      # six migrated lists when two were; this is what makes that impossible to repeat.
      - name: UX migration manifest (derived, not asserted)
        run: npx vitest run test/uxMigrationManifest.test.jsx
        working-directory: field-ops-app-vite

      # Work Orders: the bounded list AND the realtime dispatch subscription five other surfaces
      # read. The migration risk was never the list -- it was paging the board along with it.
      - name: Work Orders list migration (bounded list, realtime board intact)
        run: npx vitest run test/workOrdersListMigration.test.jsx
        working-directory: field-ops-app-vite

      # Equipment: TWO lists over one domain. The global register filters on the server; the
      # Account register stays Account-scoped, because widening it would break the create flow.
      - name: Equipment list migration (global vs account-scoped, index honesty)
        run: npx vitest run test/equipmentListMigration.test.jsx
        working-directory: field-ops-app-vite

      # Purchase Orders: which collection IS the Purchase Order. Pins the two-collections-one-name
      # trap and the measured emptiness of the canonical one, so neither has to be re-derived.
      - name: Purchase Order source of record (two collections, one name)
        run: npx vitest run test/purchaseOrderSourceOfRecord.test.jsx
        working-directory: field-ops-app-vite

      # The money a Sales Order carries, and the shared list-view header every object renders.
      - name: Sales Order money + shared list view chrome
        run: npx vitest run test/salesOrderMoney.test.jsx test/listViewChrome.test.jsx
        working-directory: field-ops-app-vite

      # The shared record page, proved on Account: derived two-column fields, truthful nulls, and
      # an edit allowlist compared against the payload the governed form actually sends.
      - name: Account record page (shared shell + editability allowlist)
        run: npx vitest run test/accountRecordPage.test.jsx
        working-directory: field-ops-app-vite

      # Equipment / Sales Order / Work Order on the same record grammar, and the two objects that
      # are deliberately NOT on it. Density, collapse, touch floor, and the editability that is
      # derived from each object's own write path rather than chosen.
      - name: Core record pages (density, collapse, per-object authority)
        run: npx vitest run test/coreRecordPages.test.jsx
        working-directory: field-ops-app-vite

      # Which machine a Work Order is about: the client rule mirror that must not drift from the
      # server, the picker that must never become an id box, and the label that must never be a key.
      - name: Work Order equipment (client rule mirror + picker + label)
        run: npx vitest run test/workOrderEquipmentClient.test.jsx
        working-directory: field-ops-app-vite
