name: Sales Order Command Tests

# Sales Order Cycle 4 -- pure-logic unit tests for the governed Sales Order write core (lifecycle + create/
# transition builders): commercial-vs-physical cardinality (one product-level line with quantity; serialized
# asset forbidden), the ordered/allocated/fulfilled quantity model, canonical-ref requirements, and the
# fulfillment-gated lifecycle. No emulator, no deployment, no production access, no secrets -- runs against the
# compiled functions/lib. Capability `salesOrder.write` is active:false and the callables are undeployed.
#
# Second job: Firestore-emulator coverage for the source-Opportunity integrity guards (createSalesOrder's
# sourceOpportunityId cross-check, the WON -> Create Sales Order callable boundary + transactional back-link,
# createServiceForSalesOrder's pure line-ref builder, and the commercial create/transition idempotency-replay
# guards shared by Opportunity + Sales Order). These sit below the still-inactive salesOrder.write /
# opportunity.write / opportunity.createSalesOrder capability gates, so they prove the persistence invariants
# without activating any dormant capability. Emulator-only, project "taylor-parts", loopback host -- no
# production access, no credentials, no repository secrets.

on:
  pull_request:
    paths:
      - "functions/src/salesOrder/**"
      - "functions/src/opportunity/**"
      - "functions/src/constants/collections.ts"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/environmentCapabilityOverrides.ts"
      - "config/environments.json"
      - "scripts/resolveEnvironment.mjs"
      - "functions/test/salesOrderCommands.test.mjs"
      - "functions/test/salesOrderPricingCompleteness.test.mjs"
      - "functions/test/salesOrderReadService.test.mjs"
      - "functions/test/salesOrderReadCallable.test.mjs"
      - "functions/test/createSalesOrderSourceOpportunity.test.mjs"
      - "functions/test/createSalesOrderFromOpportunityCallable.test.mjs"
      - "functions/test/createServiceForSalesOrderLineRefs.test.mjs"
      - "functions/test/commercialCreateIdempotency.test.mjs"
      - "functions/test/commercialTransitionIdempotency.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/sales-order-command-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/salesOrder/**"
      - "functions/src/opportunity/**"
      - "functions/src/access/permissionCatalog.ts"
      - "functions/src/access/compatibilityRoles.ts"
      - "functions/src/access/environmentCapabilityOverrides.ts"
      - "config/environments.json"
      - "scripts/resolveEnvironment.mjs"
      - "functions/test/salesOrderCommands.test.mjs"
      - "functions/test/salesOrderPricingCompleteness.test.mjs"
      - "functions/test/salesOrderReadService.test.mjs"
      - "functions/test/salesOrderReadCallable.test.mjs"
      - "functions/test/createSalesOrderSourceOpportunity.test.mjs"
      - "functions/test/createSalesOrderFromOpportunityCallable.test.mjs"
      - "functions/test/createServiceForSalesOrderLineRefs.test.mjs"
      - "functions/test/commercialCreateIdempotency.test.mjs"
      - "functions/test/commercialTransitionIdempotency.test.mjs"
      - ".github/workflows/sales-order-command-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-order-command-tests:
    name: Sales Order write core (build + run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions
      - name: Sales Order command tests (build + run)
        run: npm run test:salesOrder
        working-directory: functions
      - name: createServiceForSalesOrder line-ref builder tests (pure, build + run)
        run: npm run test:createServiceForSalesOrderLineRefs
        working-directory: functions

  sales-order-source-opportunity-emulator:
    name: Sales Order / Opportunity source-integrity + idempotency (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Start Firestore emulator (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore --project taylor-parts --config ../firebase.json > /tmp/sales-order-source-opportunity-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/sales-order-source-opportunity-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Firestore emulator did not become ready in time"
          cat /tmp/sales-order-source-opportunity-emulator.log
          exit 1
        working-directory: functions

      - name: Sales Order source-Opportunity + commercial idempotency tests (build + run)
        run: npm run test:salesOrderSourceOpportunityEmulator
        working-directory: functions
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-order-source-opportunity-emulator-logs
          path: /tmp/sales-order-source-opportunity-emulator.log
          if-no-files-found: ignore
          retention-days: 7
