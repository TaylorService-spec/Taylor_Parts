name: EOS unextracted-result detector

on:
  pull_request:
    paths:
      - "docs/orchestration/lib/unextractedResults*.mjs"
      - "docs/orchestration/context/scan-unextracted-results.mjs"
      - ".github/workflows/eos-unextracted-results-tests.yml"
  push:
    branches: [main]
    paths:
      - "docs/orchestration/lib/unextractedResults*.mjs"
      - "docs/orchestration/context/scan-unextracted-results.mjs"

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test "docs/orchestration/lib/unextractedResults.test.mjs"
      # Report-only on purpose: known-unextracted historical results (EOS-ISSUE-852)
      # are expected to be flagged until they are dispositioned. Not --strict, so a
      # pre-existing backlog cannot block unrelated PRs.
      - name: Scan landed results (report-only)
        run: node docs/orchestration/context/scan-unextracted-results.mjs
