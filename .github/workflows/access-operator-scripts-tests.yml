name: Access Operator Script Tests

# Enterprise Access & Administration Platform (Issue #226) test for
# functions/scripts/operatorAccessCommand.js -- the Owner-authorized
# operator-script CLI wrapper around the Row 7 trusted-writer commands
# (Spec sec17). Runs the pure-logic suite unconditionally (no emulator
# needed) plus the --execute wiring suite against freshly started
# Firestore + Auth emulators. Emulator-only, project "taylor-parts",
# loopback host -- no production access, no credentials, no repository
# secrets. NOT a production activation workflow -- this script requires
# an interactive human to type the exact --ownerAuthorization phrase and
# pass --execute; nothing here runs it against a real project.
#
# ALSO enforces the environment fence across the operator-script surface
# (functions/test/operatorScriptEnvironmentFence.test.mjs): NO EXPLICIT ENVIRONMENT =
# REFUSE, production named twice or not at all, and every refusal proved to precede SDK
# construction. Those cases assert refusals only, so they contact nothing and need no
# emulator, no credentials and no secrets.

on:
  pull_request:
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/**"
      - "functions/scripts/operatorAccessCommand.js"
      - "functions/test/operatorAccessCommand.test.js"
      - "functions/test/operatorAccessCommandExecute.test.js"
      - "functions/scripts/projectTargetGuard.js"
      - "functions/scripts/generatePasswordResetLink.js"
      - "functions/scripts/assignTechnicianToUser.js"
      - "functions/scripts/provisionEmployeeAccess.js"
      - "functions/scripts/d1SmokeCompleteAssignedJob.js"
      - "functions/scripts/d2SmokeRulesVerification.js"
      - "functions/scripts/d3SmokeUiVerification.js"
      # EMPLOYEE PROFILE MIGRATION + CAPABILITY GRANTS (fence cases in operatorScriptEnvironmentFence.test.mjs).
      - "functions/scripts/employeeProfileCutover.js"
      - "functions/scripts/exportEmployeeProfileSnapshot.js"
      - "functions/scripts/employeeCapabilityGrantMigrationCli.js"
      - "functions/scripts/catalogCutover.js"
      - "functions/scripts/exportCatalogSnapshot.js"
      - "functions/test/operatorScriptEnvironmentFence.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/access-operator-scripts-tests.yml"
  push:
    branches: [main]
    paths:
      - "functions/src/types/access.ts"
      - "functions/src/access/**"
      - "functions/scripts/operatorAccessCommand.js"
      - "functions/test/operatorAccessCommand.test.js"
      - "functions/test/operatorAccessCommandExecute.test.js"
      - "functions/scripts/projectTargetGuard.js"
      - "functions/scripts/generatePasswordResetLink.js"
      - "functions/scripts/assignTechnicianToUser.js"
      - "functions/scripts/provisionEmployeeAccess.js"
      - "functions/scripts/d1SmokeCompleteAssignedJob.js"
      - "functions/scripts/d2SmokeRulesVerification.js"
      - "functions/scripts/d3SmokeUiVerification.js"
      # EMPLOYEE PROFILE MIGRATION + CAPABILITY GRANTS (fence cases in operatorScriptEnvironmentFence.test.mjs).
      - "functions/scripts/employeeProfileCutover.js"
      - "functions/scripts/exportEmployeeProfileSnapshot.js"
      - "functions/scripts/employeeCapabilityGrantMigrationCli.js"
      - "functions/scripts/catalogCutover.js"
      - "functions/scripts/exportCatalogSnapshot.js"
      - "functions/test/operatorScriptEnvironmentFence.test.mjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".github/workflows/access-operator-scripts-tests.yml"
  workflow_dispatch:

# CI-V2-1. Cancel a superseded PR validation; NEVER cancel a main run.
#
# `event_name` is in the group so PR and main runs can never share one, and
# `cancel-in-progress` is conditional so that even if they did, a merge landing on main
# could not cancel the validation of the merge before it. Proven across Batches 1 and 2:
# superseded PR runs cancelled, newest SHA completed, zero main runs affected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  access-operator-scripts-tests:
    name: Operator-script command tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (reproducible)
        run: npm ci
        working-directory: functions

      - name: Pure-logic tests (no emulator)
        run: npm run test:operatorAccess
        working-directory: functions

      # ENVIRONMENT FENCE. Subprocess tests proving every operator script under this workflow's
      # surface REFUSES when no environment is named, and refuses production unless production is
      # named a second time as an explicit per-run confirmation -- with each refusal proved to fire
      # before any client library is even loaded, so no SDK client can have existed. Needs no
      # emulator and no build: every case is a refusal, so nothing is ever contacted.
      - name: Operator environment fence (no emulator, contacts nothing)
        run: npm run test:operatorEnvironmentFence
        working-directory: functions

      - name: Start Firestore + Auth emulators (background)
        run: |
          nohup node node_modules/firebase-tools/lib/bin/firebase.js emulators:start --only firestore,auth --project taylor-parts --config ../firebase.json > /tmp/operator-access-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "All emulators ready" /tmp/operator-access-emulator.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Emulators did not become ready in time"
          cat /tmp/operator-access-emulator.log
          exit 1
        working-directory: functions

      - name: --execute wiring tests (build + run)
        run: npm run test:operatorAccessExecute
        working-directory: functions

      - name: Upload emulator debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-operator-scripts-emulator-logs
          path: /tmp/operator-access-emulator.log
          if-no-files-found: ignore
          retention-days: 7
